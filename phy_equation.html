<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKDSE 物理公式競技場 (Ultimate Edition)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .blur-reveal { filter: blur(8px); user-select: none; transition: filter 0.3s ease; }
        .blur-reveal.revealed { filter: blur(0); user-select: auto; }
        .electron-flow { animation: flow 1s linear infinite; }
        @keyframes flow { from { stroke-dashoffset: 20; } to { stroke-dashoffset: 0; } }
        .bubble { animation: rise 2s infinite ease-in; opacity: 0; }
        @keyframes rise { 0% { transform: translateY(0) scale(0.5); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-40px) scale(1); opacity: 0; } }
        /* MC Button Styles */
        .mc-btn { @apply w-full py-3 px-4 rounded-lg border-2 border-slate-200 bg-white text-slate-700 font-bold text-lg transition-all hover:bg-indigo-50 hover:border-indigo-300 active:scale-95 text-left; }
        .mc-btn.correct { @apply bg-green-100 border-green-500 text-green-700; }
        .mc-btn.wrong { @apply bg-red-100 border-red-500 text-red-700 opacity-50; }
        sup { font-size: 0.75em; vertical-align: super; line-height: 0; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-slate-900 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-lg md:text-2xl font-bold flex items-center gap-2 text-indigo-400">
                ⚛️ HKDSE Physics Arena
                <span class="text-xs bg-indigo-600 text-white px-2 py-1 rounded hidden md:inline-block">Full Syllabus</span>
            </h1>
            <div class="bg-slate-800 px-4 py-2 rounded-lg text-center border border-slate-700">
                <span class="text-xs text-slate-400 block">Streak</span>
                <span id="streakCount" class="text-xl font-bold text-yellow-400">0</span>
            </div>
        </div>
    </header>

    <nav class="bg-white shadow-sm overflow-x-auto border-b border-slate-200">
        <div class="max-w-7xl mx-auto flex min-w-max">
            <button onclick="setTopic('mechanics')" class="nav-btn flex-1 py-3 px-4 font-bold border-b-4 border-indigo-500 text-indigo-600" data-topic="mechanics">力學</button>
            <button onclick="setTopic('waves')" class="nav-btn flex-1 py-3 px-4 font-bold border-b-4 border-transparent text-slate-500" data-topic="waves">波動</button>
            <button onclick="setTopic('heat')" class="nav-btn flex-1 py-3 px-4 font-bold border-b-4 border-transparent text-slate-500" data-topic="heat">熱學</button>
            <button onclick="setTopic('em')" class="nav-btn flex-1 py-3 px-4 font-bold border-b-4 border-transparent text-slate-500" data-topic="em">電磁</button>
            <button onclick="setTopic('nuclear')" class="nav-btn flex-1 py-3 px-4 font-bold border-b-4 border-transparent text-slate-500" data-topic="nuclear">放射</button>
            <button onclick="setTopic('med')" class="nav-btn flex-1 py-3 px-4 font-bold border-b-4 border-transparent text-slate-500" data-topic="med">醫學(選)</button>
            <button onclick="setTopic('eng')" class="nav-btn flex-1 py-3 px-4 font-bold border-b-4 border-transparent text-slate-500" data-topic="eng">能源(選)</button>
        </div>
    </nav>

    <main class="flex-grow p-4 md:p-6 max-w-7xl mx-auto w-full flex flex-col gap-6">
        <div class="bg-white rounded-xl shadow-sm p-4 border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="w-full md:w-1/3">
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">選擇公式 Formula</label>
                <select id="formulaSelect" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm" onchange="loadFormula(this.value)"></select>
            </div>
            
            <div class="flex-grow relative flex justify-center items-center bg-slate-50 rounded-lg p-2 border border-slate-100 min-h-[80px] w-full md:w-auto overflow-hidden group cursor-pointer" onclick="toggleFormula()">
                <div id="latexContainer" class="blur-reveal transition-all duration-300">
                    <div id="latexFormula" class="text-xl md:text-2xl text-slate-800 font-serif px-4">$$ F = ma $$</div>
                </div>
                <div id="revealOverlay" class="absolute inset-0 flex items-center justify-center bg-slate-50/50 backdrop-blur-[2px] transition-opacity duration-300">
                    <button class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold py-2 px-4 rounded-full shadow-md">👁️ 顯示公式 Show</button>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 h-full">
            <div class="lg:col-span-2 bg-slate-900 rounded-xl shadow-inner border border-slate-700 relative overflow-hidden min-h-[350px] flex items-center justify-center group">
                <div id="visualContainer" class="w-full h-full absolute inset-0 transition-opacity duration-500"></div>
                <div class="absolute top-4 right-4 pointer-events-none">
                    <div id="simStatus" class="bg-black/60 backdrop-blur text-white/90 text-xs font-mono py-1 px-3 rounded-full border border-white/10">Ready</div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-md border border-slate-200 p-6 flex flex-col h-full">
                <div class="flex-grow">
                    <div class="flex items-center justify-between mb-4">
                        <span class="bg-indigo-100 text-indigo-700 text-xs font-bold px-2 py-1 rounded uppercase tracking-wide" id="qTag">TOPIC</span>
                        <button onclick="generateQuestion()" class="text-slate-400 hover:text-indigo-600 transition" title="Next"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg></button>
                    </div>
                    <div id="qText" class="text-slate-700 text-base mb-8 leading-relaxed font-medium">Loading...</div>
                    
                    <!-- Numerical Input Mode -->
                    <div id="inputMode" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-400 mb-1.5 uppercase">答案 (3 sig fig)</label>
                            <div class="flex shadow-sm">
                                <input type="number" id="userAns" class="flex-grow p-3 border border-slate-300 rounded-l-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono text-lg bg-slate-50" placeholder="0.00" step="any" onkeydown="if(event.key==='Enter') checkAnswer()">
                                <span id="unitLabel" class="bg-slate-200 border border-l-0 border-slate-300 px-4 flex items-center justify-center rounded-r-lg text-slate-600 font-bold min-w-[3.5rem] text-sm">--</span>
                            </div>
                        </div>
                        <button onclick="checkAnswer()" id="checkBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-lg shadow-lg mt-6">提交驗證 Submit</button>
                    </div>

                    <!-- Multiple Choice Mode -->
                    <div id="mcMode" class="hidden space-y-3 mt-2">
                        <label class="block text-xs font-bold text-slate-400 mb-1.5 uppercase">選擇正確單位 Select Unit</label>
                        <div id="mcContainer" class="grid grid-cols-1 gap-2">
                            <!-- Buttons generated by JS -->
                        </div>
                    </div>

                </div>
                <div class="mt-4">
                    <div id="feedback" class="text-center font-bold text-sm min-h-[20px] transition-all"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const CONSTANTS = { g: 9.81, c: 3.00e8, R: 8.31, NA: 6.02e23, k: 1.38e-23, G: 6.67e-11, me: 9.11e-31, e: 1.60e-19, epsilon0: 8.85e-12 };
        
        function rand(min, max, dec) { return parseFloat((Math.random()*(max-min)+min).toFixed(dec)); }
        
        function fmt(n) { 
            let abs = Math.abs(n);
            if (abs === 0) return "0";
            if(abs < 0.01 || abs >= 1000) { 
                let [m, e] = n.toExponential(2).split('e'); 
                return `${m} × 10<sup>${parseInt(e)}</sup>`; 
            } 
            return parseFloat(n.toFixed(3)).toString(); 
        }

        // --- Unit Quiz Database ---
        const unitDB = {
            mechanics: [
                {q: "位移 (Displacement)", a: "m"}, {q: "速度 (Velocity)", a: "m s⁻¹"}, {q: "加速度 (Acceleration)", a: "m s⁻²"},
                {q: "力 (Force)", a: "N"}, {q: "動量 (Momentum)", a: "kg m s⁻¹"}, {q: "動量變化 (Change in Momentum)", a: "N s"},
                {q: "功 (Work) / 能量 (Energy)", a: "J"}, {q: "功率 (Power)", a: "W"}, 
                {q: "重力場強度 (g)", a: "N kg⁻¹"}, {q: "力矩 (Moment)", a: "N m"}
            ],
            waves: [
                {q: "頻率 (Frequency)", a: "Hz"}, {q: "週期 (Period)", a: "s"}, {q: "波長 (Wavelength)", a: "m"},
                {q: "波速率 (Wave Speed)", a: "m s⁻¹"}, {q: "折射率 (Refractive Index)", a: "無單位 (No Unit)"},
                {q: "透鏡焦強 (Power of Lens)", a: "D"}
            ],
            heat: [
                {q: "溫度 (Temperature)", a: "K"}, {q: "熱容量 (Heat Capacity)", a: "J K⁻¹"},
                {q: "比熱容量 (Specific Heat Capacity)", a: "J kg⁻¹ K⁻¹"}, {q: "比潛熱 (Specific Latent Heat)", a: "J kg⁻¹"},
                {q: "氣體常數 (Gas Constant)", a: "J mol⁻¹ K⁻¹"}, {q: "壓強 (Pressure)", a: "Pa"}
            ],
            em: [
                {q: "電荷 (Charge)", a: "C"}, {q: "電流 (Current)", a: "A"}, {q: "電壓 / 電勢差 (Voltage)", a: "V"},
                {q: "電阻 (Resistance)", a: "Ω"}, {q: "電阻率 (Resistivity)", a: "Ω m"}, {q: "電功率 (Electric Power)", a: "W"},
                {q: "電場強度 (Electric Field)", a: "N C⁻¹"}, {q: "磁通量密度 (B-Field)", a: "T"},
                {q: "磁通量 (Magnetic Flux)", a: "Wb"}
            ],
            nuclear: [
                {q: "質量虧損 (Mass Defect)", a: "kg"}, {q: "結合能 (Binding Energy)", a: "J"},
                {q: "放射強度 (Activity)", a: "Bq"}, {q: "衰變常數 (Decay Constant)", a: "s⁻¹"},
                {q: "半衰期 (Half-life)", a: "s"}
            ],
            med: [
                {q: "聲強級 (Sound Intensity Level)", a: "dB"}, {q: "聲阻抗 (Acoustic Impedance)", a: "kg m⁻² s⁻¹"},
                {q: "線衰減係數 (Linear Attenuation)", a: "m⁻¹"}, {q: "等效劑量 (Equivalent Dose)", a: "Sv"}
            ],
            eng: [
                {q: "光通量 (Luminous Flux)", a: "lm"}, {q: "照明度 (Illuminance)", a: "lx"},
                {q: "熱傳導係數 U-值 (U-value)", a: "W m⁻² K⁻¹"}, {q: "太陽常數 (Solar Constant)", a: "W m⁻²"}
            ]
        };

        // Helper to generate options for units
        function getUnitQuiz(topic) {
            const list = unitDB[topic];
            if(!list || list.length === 0) return null;
            const target = list[Math.floor(Math.random() * list.length)];
            
            // Get distractors (unique units from same topic preferred)
            const others = list.filter(i => i.a !== target.a).map(i => i.a);
            // Fallback distractors if not enough
            const fallback = ["J", "W", "N", "Pa", "T", "m s⁻¹", "kg"];
            while (others.length < 3) {
                const f = fallback[Math.floor(Math.random() * fallback.length)];
                if (f !== target.a && !others.includes(f)) others.push(f);
            }
            
            // Shuffle
            const options = others.sort(() => 0.5 - Math.random()).slice(0, 3);
            options.push(target.a);
            options.sort(() => 0.5 - Math.random());
            
            return {
                q: `請選擇以下物理量的正確單位：<br><br><strong class="text-xl text-indigo-400">${target.q}</strong>`,
                options: options,
                answer: target.a
            };
        }

        const formulaDB = {
            mechanics: [
                {id:'unit_quiz', label:'🛡️ 單位挑戰 (Unit Challenge)', latex:'\\text{Unit Check}', visual:'unit_scale', type:'mc'},
                {id:'suvat_1', label:'勻加速運動方程 1 (Equations of U.A.M. 1)', latex:'v = u + a t', visual:'mech_linear', gen:()=>{ 
                    const isGravity = Math.random() < 0.5;
                    let u, a, t, v, qText;

                    if (isGravity) {
                        // Free fall or throw up
                        a = 9.81;
                        if (Math.random() < 0.5) {
                            // Drop from rest
                            u = 0; t = rand(1, 4, 1); v = u + a*t;
                            qText = `一物體由靜止開始自由下墜，歷時 ${fmt(t)} s。求物體著地前的速率。（取 $g=9.81$ m s⁻²）`;
                        } else {
                            // Throw down
                            u = rand(2, 10, 0); t = rand(1, 3, 1); v = u + a*t;
                            qText = `一物體以初速率 ${fmt(u)} m s⁻¹ 垂直向下拋出，歷時 ${fmt(t)} s。求末速率。（取 $g=9.81$ m s⁻²）`;
                        }
                        return {unit:'m s⁻¹', q:qText, a:v};
                    } else {
                        // Horizontal motion
                        u=rand(0,10,0); a=rand(1,5,1); t=rand(2,10,0); v = u + a*t;
                        const mode = Math.floor(Math.random()*3); // 0:v, 1:u, 2:t
                        if(mode===0) return {unit:'m s⁻¹', q:`一物體以初速度 ${fmt(u)} m s⁻¹ 及勻加速度 ${fmt(a)} m s⁻² 沿直線運動，歷時 ${fmt(t)} s。求末速度。`, a:v};
                        if(mode===1) return {unit:'m s⁻¹', q:`一物體以勻加速度 ${fmt(a)} m s⁻² 運動 ${fmt(t)} s 後，速度變為 ${fmt(v)} m s⁻¹。求其初速度。`, a:u};
                        if(mode===2) return {unit:'s', q:`一物體由初速度 ${fmt(u)} m s⁻¹ 以勻加速度 ${fmt(a)} m s⁻² 加速至 ${fmt(v)} m s⁻¹。求所需時間。`, a:t};
                    }
                }},
                {id:'suvat_2', label:'勻加速運動方程 2 (Equations of U.A.M. 2)', latex:'s = u t + \\frac{1}{2} a t^2', visual:'mech_linear', gen:()=>{ 
                    const isGravity = Math.random() < 0.5;
                    let u, a, t, s, qText;

                    if (isGravity) {
                        a = 9.81;
                        if (Math.random() < 0.5) {
                            // Drop from rest
                            u = 0; t = rand(1, 5, 1); s = u*t + 0.5*a*t*t;
                            qText = `一石塊由靜止自由落下，歷時 ${fmt(t)} s。求石塊下墜的距離。（取 $g=9.81$ m s⁻²）`;
                            return {unit:'m', q:qText, a:s};
                        } else {
                            // Throw up (calculate height) - careful with signs
                            // Let's do simple drop height calculation or throw down distance
                            u = rand(5, 15, 0); t = rand(1, 2, 1); s = u*t + 0.5*a*t*t;
                            qText = `一物體以 ${fmt(u)} m s⁻¹ 的初速垂直向下拋出，經過 ${fmt(t)} s。求位移大小。（取 $g=9.81$ m s⁻²）`;
                            return {unit:'m', q:qText, a:s};
                        }
                    } else {
                        u=rand(0,10,0); a=rand(1,4,1); t=rand(2,8,0); s = u*t + 0.5*a*t*t;
                        const mode = Math.floor(Math.random()*2); // 0:s, 1:u
                        if(mode===0) return {unit:'m', q:`一汽車以初速 ${fmt(u)} m s⁻¹ 及勻加速度 ${fmt(a)} m s⁻² 行駛 ${fmt(t)} s。求行駛距離。`, a:s};
                        if(mode===1) return {unit:'m s⁻¹', q:`一物體以勻加速度 ${fmt(a)} m s⁻² 行駛 ${fmt(t)} s，位移為 ${fmt(s)} m。求初速度。`, a:u};
                    }
                }},
                {id:'suvat_3', label:'勻加速運動方程 3 (Equations of U.A.M. 3)', latex:'v^2 = u^2 + 2 a s', visual:'mech_linear', gen:()=>{ 
                    const isGravity = Math.random() < 0.5;
                    let u, a, s, v, qText;

                    if (isGravity) {
                        a = 9.81;
                        // Drop from height
                        u = 0; s = rand(10, 50, 0); 
                        // v^2 = 0 + 2as => v = sqrt(2as)
                        v = Math.sqrt(2*a*s);
                        qText = `一物體由靜止從 ${fmt(s)} m 高處自由落下。求著地時的速率。（取 $g=9.81$ m s⁻²）`;
                        return {unit:'m s⁻¹', q:qText, a:v};
                    } else {
                        u=rand(0,10,0); a=rand(1,5,1); s=rand(10,50,0); 
                        // Ensure v^2 is positive (it is since u, a, s > 0)
                        v = Math.sqrt(u*u + 2*a*s);
                        const mode = Math.floor(Math.random()*2); // 0:v, 1:s
                        if(mode===0) return {unit:'m s⁻¹', q:`一物體初速 ${fmt(u)} m s⁻¹，以勻加速度 ${fmt(a)} m s⁻² 移動了 ${fmt(s)} m。求末速率。`, a:v};
                        if(mode===1) return {unit:'m', q:`一物體由靜止以勻加速度 ${fmt(a)} m s⁻² 加速至 ${fmt(v)} m s⁻¹。求加速距離。`, a:(v*v)/(2*a)}; // u=0 case for simplicity in reverse
                    }
                }},
                {id:'newton2', label:'牛頓第二定律 (Newton\'s 2nd Law)', latex:'F = m a', visual:'mech_linear', gen:()=>{ 
                    const m=rand(5,50,0), a=rand(2,10,1); const F = m*a;
                    const mode = Math.floor(Math.random()*3); // 0:F, 1:m, 2:a
                    if(mode===0) return {unit:'N', q:`一個質量為 ${fmt(m)} kg 的物體正以加速度 ${fmt(a)} m s⁻² 運動。求作用在物體上的淨力。`, a:F};
                    if(mode===1) return {unit:'kg', q:`一物體在 ${fmt(F)} N 的淨力作用下，產生 ${fmt(a)} m s⁻² 的加速度。求該物體的質量。`, a:m};
                    if(mode===2) return {unit:'m s⁻²', q:`一恆力 ${fmt(F)} N 作用於質量為 ${fmt(m)} kg 的物體上。求物體產生的加速度。`, a:a};
                }},
                {id:'momentum', label:'動量 (Momentum)', latex:'p = m v', visual:'mech_linear', gen:()=>{ 
                    const m=rand(2,20,0), v=rand(5,20,0); const p = m*v;
                    const mode = Math.floor(Math.random()*2);
                    if(mode===0) return {unit:'kg m s⁻¹', q:`一物體質量為 ${fmt(m)} kg，速度為 ${fmt(v)} m s⁻¹。求該物體的動量。`, a:p};
                    if(mode===1) return {unit:'m s⁻¹', q:`一質量為 ${fmt(m)} kg 的物體擁有 ${fmt(p)} kg m s⁻¹ 的動量。求其速度。`, a:v};
                }},
                {id:'impulse', label:'衝量 (Impulse)', latex:'F \\Delta t = \\Delta p', unit:'N s', visual:'mech_linear', gen:()=>{ 
                    const f=rand(10,100,0), t=rand(0.2,2,1); const dp = f*t;
                    const mode = Math.floor(Math.random()*2);
                    if(mode===0) return {unit:'kg m s⁻¹', q:`一恆力 ${fmt(f)} N 作用於某物體 ${fmt(t)} s。求物體的動量變化。`, a:dp};
                    if(mode===1) return {unit:'N', q:`某物體在 ${fmt(t)} s 內的動量變化為 ${fmt(dp)} kg m s⁻¹。求作用在物體上的平均力。`, a:f};
                }},
                {id:'moment', label:'力矩 (Moment)', latex:'M = F d \\sin\\theta', unit:'N m', visual:'mech_linear', gen:()=>{ 
                    const F=rand(10,50,0), d=rand(1,5,1); const M = F*d*0.5; // sin30=0.5
                    const mode = Math.floor(Math.random()*2);
                    if(mode===0) return {unit:'N m', q:`一力 ${fmt(F)} N 作用於距轉軸 ${fmt(d)} m 處，力與力臂夾角為 30°。求該力產生的力矩。`, a:M};
                    if(mode===1) return {unit:'m', q:`一力 ${fmt(F)} N 作用於距轉軸 $d$ 處 (夾角 30°)，產生力矩 ${fmt(M)} N m。求距離 $d$。`, a:d};
                }},
                {id:'work', label:'機械功 (Work)', latex:'W = F s \\cos\\theta', unit:'J', visual:'mech_linear', gen:()=>{ 
                    const F=rand(50,200,0), s=rand(5,20,0); const W = F*s;
                    const mode = Math.floor(Math.random()*2);
                    if(mode===0) return {unit:'J', q:`一外力 ${fmt(F)} N 將物體沿力的方向推動了 ${fmt(s)} m (力與位移平行)。求該力所做的功。`, a:W};
                    if(mode===1) return {unit:'N', q:`某外力將物體沿力的方向推動了 ${fmt(s)} m，作功 ${fmt(W)} J。求該外力的大小。`, a:F};
                }},
                {id:'ke', label:'動能 (Kinetic Energy)', latex:'E_k = \\frac{1}{2} m v^2', unit:'J', visual:'mech_linear', gen:()=>{ 
                    const m=rand(1000,2000,0), v=rand(10,40,0); const ke = 0.5*m*v*v;
                    const mode = Math.floor(Math.random()*3);

        function setTopic(t){ curTopic=t; updateNav(); renderSelect(); loadFormula(formulaDB[t][0].id); }
        function updateNav(){ document.querySelectorAll('.nav-btn').forEach(b=>{ const active=b.dataset.topic===curTopic; b.className=`nav-btn flex-1 py-3 px-4 font-bold border-b-4 transition ${active?'border-indigo-500 text-indigo-600':'border-transparent text-slate-500'}`; }); }
        function renderSelect(){ const s=document.getElementById('formulaSelect'); s.innerHTML=''; formulaDB[curTopic].forEach(f=>{ const o=document.createElement('option'); o.value=f.id; o.text=f.label; s.add(o); }); }
        function loadFormula(id){ curId=id; const item=formulaDB[curTopic].find(i=>i.id===id); isRevealed=false; toggleFormula(false); const l=document.getElementById('latexFormula'); l.innerHTML=`$$ ${item.latex} $$`; if(window.MathJax)MathJax.typesetPromise([l]); renderVisual(item.visual); generateQuestion(); }
        function toggleFormula(force){ const c=document.getElementById('latexContainer'), o=document.getElementById('revealOverlay'); if(force!==undefined) isRevealed=force; else isRevealed=!isRevealed; if(isRevealed){c.classList.add('revealed'); o.classList.add('opacity-0','pointer-events-none');}else{c.classList.remove('revealed'); o.classList.remove('opacity-0','pointer-events-none');} }
        
        function generateQuestion(){ 
            const item=formulaDB[curTopic].find(i=>i.id===curId); 
            const inputMode = document.getElementById('inputMode');
            const mcMode = document.getElementById('mcMode');
            const feedback = document.getElementById('feedback');
            
            feedback.innerHTML = ''; // Clear old feedback

            // Handle MC Type
            if (item.type === 'mc') {
                curData = getUnitQuiz(curTopic);
                inputMode.classList.add('hidden');
                mcMode.classList.remove('hidden');
                
                const mcContainer = document.getElementById('mcContainer');
                mcContainer.innerHTML = '';
                curData.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'mc-btn';
                    btn.innerHTML = opt;
                    btn.onclick = () => checkMCAnswer(opt, btn);
                    mcContainer.appendChild(btn);
                });
            } else {
                // Normal Numerical Type
                curData = item.gen();
                inputMode.classList.remove('hidden');
                mcMode.classList.add('hidden');
                
                // FIX: Update unit label dynamically based on question mode
                document.getElementById('unitLabel').innerText=curData.unit; 
                
                document.getElementById('userAns').value=''; 
                document.getElementById('checkBtn').disabled=false;
            }

            const q=document.getElementById('qText'); 
            q.style.opacity=0; 
            setTimeout(()=>{ q.innerHTML=curData.q; if(window.MathJax)MathJax.typesetPromise([q]); q.style.opacity=1; },100); 
            
            renderVisual(item.visual);
        }

        function checkMCAnswer(selected, btnElement) {
            const correct = selected === curData.answer;
            const feedback = document.getElementById('feedback');
            const buttons = document.querySelectorAll('.mc-btn');
            
            // Disable all buttons
            buttons.forEach(b => {
                b.disabled = true;
                if(b.innerHTML === curData.answer) b.classList.add('correct');
            });

            if (correct) {
                feedback.innerHTML='<span class="text-green-600">✅ 正確！ Correct!</span>';
                document.getElementById('streakCount').innerText = ++streak;
            } else {
                btnElement.classList.add('wrong');
                feedback.innerHTML=`<span class="text-red-500">❌ 錯誤。正確答案：${curData.answer}</span>`;
                streak = 0;
                document.getElementById('streakCount').innerText = 0;
            }
        }

        function checkAnswer(){ const v=parseFloat(document.getElementById('userAns').value); if(isNaN(v))return; const tol=Math.abs(curData.a*0.01); const correct=Math.abs(v-curData.a)<=tol || (Math.abs(curData.a)<1e-9 && Math.abs(v)<1e-9); const fb=document.getElementById('feedback'); if(correct){ streak++; fb.innerHTML='<span class="text-green-600">✅ 正確！ Correct!</span>'; document.getElementById('checkBtn').disabled=true; }else{ streak=0; let ans=curData.a; if(Math.abs(ans)<0.01||Math.abs(ans)>=1000) ans=`${ans.toExponential(2).split('e')[0]} × 10<sup>${parseInt(ans.toExponential(2).split('e')[1])}</sup>`; else ans=ans.toPrecision(3); fb.innerHTML=`<span class="text-red-500">❌ 錯誤。答案 Answer: ${ans}</span>`; } document.getElementById('streakCount').innerText = streak; }
        
        function renderVisual(t){ 
            if(t === 'unit_scale') {
                document.getElementById('visualContainer').innerHTML = `<svg class="w-full h-full" viewBox="0 0 400 300"><path d="M200,250 L200,50 M100,50 L300,50 M100,50 L100,150 M300,50 L300,150" stroke="#64748b" stroke-width="4" fill="none"/><rect x="70" y="150" width="60" height="40" fill="#indigo-500"/><rect x="270" y="150" width="60" height="40" fill="#indigo-500"/><text x="200" y="280" text-anchor="middle" fill="#64748b" font-weight="bold">Unit Balance</text></svg>`;
                return;
            }
            document.getElementById('visualContainer').innerHTML=`<svg class="w-full h-full"><text x="50%" y="50%" text-anchor="middle" fill="#aaa">Visual: ${t}</text></svg>`; 
        }

        let streak = 0;
        window.addEventListener('load', ()=>setTopic('mechanics'));
    </script>
</body>
</html>
