<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HKDSE Physics Arena (Full Variable Diversity)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Roboto+Mono:wght@500&display=swap');
        
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #f8fafc; 
        }
        
        /* DSE Paper Style Font - Times New Roman for Physics variables/units */
        .paper-font {
            font-family: 'Times New Roman', Times, serif;
        }

        /* Scientific Notation Superscript */
        .sci-exp {
            font-size: 0.7em;
            vertical-align: super;
            line-height: 0;
        }

        /* Variable Italics (Physics Standard) */
        .var {
            font-style: italic;
        }
        
        /* Calculator Styles */
        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
        }
        .calc-btn {
            @apply h-12 md:h-14 text-lg md:text-xl font-bold rounded shadow-sm transition-all active:scale-95 flex items-center justify-center select-none;
            font-family: 'Roboto Mono', monospace;
        }
        .btn-num { @apply bg-white text-slate-800 border border-slate-300 hover:bg-slate-50; }
        .btn-action { @apply bg-slate-200 text-slate-800 border border-slate-300 hover:bg-slate-300; }
        .btn-enter { @apply bg-blue-600 text-white border border-blue-700 hover:bg-blue-700; }
        
        .display-screen {
            font-family: 'Roboto Mono', monospace;
            letter-spacing: 0.05em;
        }

        /* Formula Reveal Effect */
        .blur-reveal { filter: blur(6px); user-select: none; transition: filter 0.3s ease; }
        .blur-reveal.revealed { filter: blur(0); user-select: auto; }

        /* Scrollbar for nav */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Modal Styles */
        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

    <!-- Header -->
    <header class="bg-slate-800 text-white p-3 shadow-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold flex items-center gap-2">
                📖 HKDSE Physics
            </h1>
            <div class="bg-slate-700 px-3 py-1 rounded text-sm font-mono border border-slate-600">
                Streak: <span id="streakCount" class="text-yellow-400 font-bold">0</span>
            </div>
        </div>
    </header>

    <!-- Navigation (Scrollable) -->
    <nav class="bg-white shadow-sm border-b border-slate-200 sticky top-[52px] z-40">
        <div class="max-w-5xl mx-auto flex overflow-x-auto hide-scrollbar py-1">
            <button onclick="setTopic('heat')" class="nav-btn whitespace-nowrap px-4 py-2 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-blue-600" data-topic="heat">熱學 Heat</button>
            <button onclick="setTopic('mechanics')" class="nav-btn whitespace-nowrap px-4 py-2 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-blue-600" data-topic="mechanics">力學 Mech</button>
            <button onclick="setTopic('waves')" class="nav-btn whitespace-nowrap px-4 py-2 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-blue-600" data-topic="waves">波動 Waves</button>
            <button onclick="setTopic('em')" class="nav-btn whitespace-nowrap px-4 py-2 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-blue-600" data-topic="em">電磁 E&M</button>
            <button onclick="setTopic('atomic')" class="nav-btn whitespace-nowrap px-4 py-2 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-blue-600" data-topic="atomic">原子 Atomic</button>
            <button onclick="setTopic('medical')" class="nav-btn whitespace-nowrap px-4 py-2 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-blue-600" data-topic="medical">醫學 Med</button>
            <button onclick="setTopic('energy')" class="nav-btn whitespace-nowrap px-4 py-2 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-blue-600" data-topic="energy">能源 Energy</button>
        </div>
    </nav>

    <main class="flex-grow p-3 md:p-6 max-w-5xl mx-auto w-full flex flex-col gap-4">
        
        <!-- Formula Selector & Display -->
        <div class="bg-white rounded-lg shadow-sm border border-slate-200 p-4">
            <div class="flex flex-col md:flex-row gap-4 items-center">
                <div class="w-full md:w-1/3 flex gap-2 items-end">
                    <div class="flex-grow">
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-1">公式 Formula</label>
                        <select id="formulaSelect" class="w-full p-2 bg-slate-50 border border-slate-300 rounded font-bold text-slate-700 text-sm" onchange="loadFormula(this.value)"></select>
                    </div>
                    <button onclick="openSymbolModal()" class="h-[38px] w-[38px] flex-shrink-0 bg-blue-100 text-blue-600 rounded border border-blue-200 hover:bg-blue-200 flex items-center justify-center" title="符號意思 Symbol Meanings">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                    </button>
                </div>
                <div class="w-full md:w-2/3 relative cursor-pointer group" onclick="toggleFormula()">
                    <div class="absolute top-0 left-0 text-[10px] text-slate-400 uppercase font-bold tracking-wider">Tap to reveal</div>
                    <div id="latexContainer" class="blur-reveal bg-slate-50 rounded border border-slate-200 p-4 min-h-[80px] flex items-center justify-center text-center">
                        <div id="formulaDisplay" class="text-2xl md:text-3xl paper-font italic text-slate-800"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Question & Calculator -->
        <div class="flex flex-col lg:flex-row gap-4">
            
            <!-- Question Panel -->
            <div class="bg-white rounded-lg shadow-sm border border-slate-200 p-5 lg:w-3/5 flex flex-col relative">
                <div class="flex justify-between items-start mb-4">
                    <span class="bg-slate-100 text-slate-500 text-[10px] font-bold px-2 py-1 rounded uppercase tracking-wide" id="qTag">TOPIC</span>
                    <button onclick="generateQuestion()" class="text-blue-600 hover:bg-blue-50 p-1.5 rounded transition" title="Next Question">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    </button>
                </div>
                
                <div class="flex-grow flex items-center justify-center py-6">
                    <div id="qText" class="text-xl md:text-2xl leading-relaxed paper-font text-slate-900 w-full">Loading...</div>
                </div>
                
                <div class="mt-auto">
                    <div id="feedback" class="text-center font-bold p-3 rounded bg-slate-50 border border-slate-100 min-h-[3.5rem] flex items-center justify-center paper-font text-lg">
                        <span class="text-slate-400 text-sm font-sans font-normal">請輸入答案 Input Answer</span>
                    </div>
                </div>
            </div>

            <!-- Calculator Panel -->
            <div class="bg-slate-100 rounded-lg border border-slate-200 p-4 lg:w-2/5">
                <div class="mb-4 relative">
                    <input type="text" id="calcDisplay" class="display-screen w-full p-3 text-right text-2xl bg-white border border-slate-300 rounded shadow-inner text-slate-800" placeholder="0" readonly>
                    <span id="unitLabel" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 font-bold text-sm paper-font bg-slate-50 px-1 rounded border border-slate-200">--</span>
                </div>

                <div class="calc-grid">
                    <button onclick="calcInput('7')" class="calc-btn btn-num">7</button>
                    <button onclick="calcInput('8')" class="calc-btn btn-num">8</button>
                    <button onclick="calcInput('9')" class="calc-btn btn-num">9</button>
                    <button onclick="calcAction('DEL')" class="calc-btn btn-action text-red-600 text-base">DEL</button>
                    
                    <button onclick="calcInput('4')" class="calc-btn btn-num">4</button>
                    <button onclick="calcInput('5')" class="calc-btn btn-num">5</button>
                    <button onclick="calcInput('6')" class="calc-btn btn-num">6</button>
                    <button onclick="calcAction('AC')" class="calc-btn btn-action text-red-600 text-base">AC</button>
                    
                    <button onclick="calcInput('1')" class="calc-btn btn-num">1</button>
                    <button onclick="calcInput('2')" class="calc-btn btn-num">2</button>
                    <button onclick="calcInput('3')" class="calc-btn btn-num">3</button>
                    <button onclick="calcInput('EXP')" class="calc-btn btn-action text-sm">EXP</button>
                    
                    <button onclick="calcInput('0')" class="calc-btn btn-num">0</button>
                    <button onclick="calcInput('.')" class="calc-btn btn-num">.</button>
                    <button onclick="calcInput('-')" class="calc-btn btn-num">(-)</button>
                    <button onclick="checkAnswer()" id="enterBtn" class="calc-btn btn-enter text-base">EXE</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Symbol Modal -->
    <div id="symbolModal" class="fixed inset-0 z-[100] hidden">
        <div class="modal-backdrop absolute inset-0" onclick="closeSymbolModal()"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-md p-4">
            <div class="bg-white rounded-xl shadow-2xl border border-slate-200 overflow-hidden">
                <div class="bg-slate-50 p-4 border-b border-slate-200 flex justify-between items-center">
                    <h3 class="font-bold text-slate-700 flex items-center gap-2">
                        <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        符號意思 Symbol Meanings
                    </h3>
                    <button onclick="closeSymbolModal()" class="text-slate-400 hover:text-slate-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
                <div class="p-0 max-h-[60vh] overflow-y-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-slate-50 text-xs uppercase text-slate-500 font-bold sticky top-0">
                            <tr>
                                <th class="px-4 py-2 border-b">符號</th>
                                <th class="px-4 py-2 border-b">意義 (單位)</th>
                            </tr>
                        </thead>
                        <tbody id="symbolTableBody" class="divide-y divide-slate-100">
                            <!-- Content injected by JS -->
                        </tbody>
                    </table>
                </div>
                <div class="p-3 bg-slate-50 border-t border-slate-200 text-center">
                    <button onclick="closeSymbolModal()" class="px-4 py-2 bg-slate-800 text-white text-sm font-bold rounded hover:bg-slate-700 w-full">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Constants ---
        const C = { 
            g: 9.81, c: 3.00e8, R: 8.31, NA: 6.02e23, k: 1.38e-23, 
            G: 6.67e-11, me: 9.11e-31, e: 1.60e-19, epsilon0: 8.85e-12,
            mu0: 4 * Math.PI * 1e-7, water_c: 4200, ice_lf: 3.34e5, water_lv: 2.26e6,
            I0: 1e-12, solar: 1360
        };

        // --- Formatting Helpers ---
        function unitSup(str) {
            const map = {
                '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴',
                '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹',
                '-': '⁻', '+': '⁺'
            };
            return str.replace(/[-+0-9]/g, char => map[char] || char);
        }

        function toSci(num, precision = 2) {
            if (num === 0) return "0";
            let str = num.toExponential(precision); 
            let [mantissa, exponent] = str.split('e');
            let expInt = parseInt(exponent);
            if (expInt === 0) return parseFloat(mantissa).toFixed(precision);
            return `${mantissa} × 10<sup class="sci-exp">${expInt}</sup>`;
        }

        function fmt(n) {
            let abs = Math.abs(n);
            if (abs === 0) return "0";
            if (abs >= 0.001 && abs <= 9999) return parseFloat(n.toPrecision(4)).toString(); 
            return toSci(n);
        }

        function rand(min, max, dec) { 
            return parseFloat((Math.random()*(max-min)+min).toFixed(dec)); 
        }

        // Helper to solve for one variable
        function solveFor(vars, targetKey, unit, symbolMap) {
            // vars: object with all known values { Q:100, m:2, ... }
            // targetKey: string 'Q'
            // unit: string 'J'
            // symbolMap: object mapping keys to display HTML { Q: '<i>Q</i>', m: '<i>m</i>' }
            
            let qStr = "";
            for (let k in vars) {
                if (k !== targetKey && k !== 'ans') {
                    // Skip constants if they are implicit, but here we usually pass them
                    let val = vars[k];
                    let displaySym = symbolMap[k] || `<i>${k}</i>`;
                    // Special handling for constants display if needed, but simple is fine
                    qStr += `${displaySym} = ${fmt(val)}，`;
                }
            }
            // Remove last comma
            qStr = qStr.slice(0, -1);
            let targetSym = symbolMap[targetKey] || `<i>${targetKey}</i>`;
            
            return {
                unit: unit,
                q: `${qStr}。求 ${targetSym}。`,
                a: vars[targetKey]
            };
        }

        // --- Formula Database (With Symbols) ---
        const formulaDB = {
            heat: [
                {
                    id:'h1', label:'比熱容量 Q=mcΔT', html:'Q = mc&Delta;T',
                    symbols: { 'Q': '能量 (J)', 'm': '質量 (kg)', 'c': '比熱容量', '&Delta;T': '溫差 (°C)' },
                    gen:()=>{ 
                        const m=rand(0.5, 5, 1); const dt=rand(10, 40, 0); const c=4200; const Q = m * c * dt;
                        const vars = { 'Q':Q, 'm':m, '&Delta;T':dt }; // c is const
                        const choice = Math.random() < 0.33 ? 'Q' : (Math.random() < 0.5 ? 'm' : '&Delta;T');
                        const units = { 'Q':'J', 'm':'kg', '&Delta;T':'°C' };
                        
                        let q = "";
                        if(choice === 'Q') q = `質量 <i>m</i> = ${fmt(m)} kg，溫差 &Delta;<i>T</i> = ${fmt(dt)}°C。求 <i>Q</i>。`;
                        else if(choice === 'm') q = `能量 <i>Q</i> = ${fmt(Q)} J，溫差 &Delta;<i>T</i> = ${fmt(dt)}°C。求質量 <i>m</i>。`;
                        else q = `能量 <i>Q</i> = ${fmt(Q)} J，質量 <i>m</i> = ${fmt(m)} kg。求溫差 &Delta;<i>T</i>。`;
                        
                        return { unit: units[choice], q: q + `<br>(<i>c</i> = 4200 J kg${unitSup('-1')} °C${unitSup('-1')})`, a: vars[choice] };
                    }
                },
                {
                    id:'h2', label:'熱容量 Q=CΔT', html:'Q = C&Delta;T',
                    symbols: { 'Q': '能量 (J)', 'C': '熱容量', '&Delta;T': '溫差 (°C)' },
                    gen:()=>{ 
                        const C=rand(200, 800, 0); const dt=rand(5, 20, 0); const Q = C * dt;
                        const vars = { 'Q':Q, 'C':C, '&Delta;T':dt };
                        const choice = ['Q','C','&Delta;T'][Math.floor(Math.random()*3)];
                        const units = { 'Q':'J', 'C':'J °C⁻¹', '&Delta;T':'°C' };
                        
                        let q = "";
                        if(choice==='Q') q=`熱容量 <i>C</i> = ${fmt(C)} J °C${unitSup('-1')}，溫差 &Delta;<i>T</i> = ${fmt(dt)}°C。求 <i>Q</i>。`;
                        else if(choice==='C') q=`能量 <i>Q</i> = ${fmt(Q)} J，溫差 &Delta;<i>T</i> = ${fmt(dt)}°C。求熱容量 <i>C</i>。`;
                        else q=`能量 <i>Q</i> = ${fmt(Q)} J，熱容量 <i>C</i> = ${fmt(C)} J °C${unitSup('-1')}。求溫差 &Delta;<i>T</i>。`;
                        
                        return { unit: units[choice], q: q, a: vars[choice] };
                    }
                },
                {
                    id:'h3', label:'熔解潛熱 Q=ml_f', html:'Q = ml<sub>f</sub>',
                    symbols: { 'Q': '能量 (J)', 'm': '質量 (kg)', 'l<sub>f</sub>': '熔解比潛熱' },
                    gen:()=>{ 
                        const m=rand(0.1, 1, 2); const lf=C.ice_lf; const Q = m * lf;
                        const choice = Math.random() < 0.5 ? 'Q' : 'm';
                        const units = { 'Q':'J', 'm':'kg' };
                        let q = choice==='Q' ? `質量 <i>m</i> = ${fmt(m)} kg。求 <i>Q</i>。` : `能量 <i>Q</i> = ${fmt(Q)} J。求 <i>m</i>。`;
                        return { unit: units[choice], q: q + `<br>(<i>l<sub>f</sub></i> = ${fmt(lf)} J kg${unitSup('-1')})`, a: choice==='Q'?Q:m };
                    }
                },
                {
                    id:'h4', label:'汽化潛熱 Q=ml_v', html:'Q = ml<sub>v</sub>',
                    symbols: { 'Q': '能量 (J)', 'm': '質量 (kg)', 'l<sub>v</sub>': '汽化比潛熱' },
                    gen:()=>{ 
                        const m=rand(0.1, 0.5, 2); const lv=C.water_lv; const Q = m * lv;
                        const choice = Math.random() < 0.5 ? 'Q' : 'm';
                        const units = { 'Q':'J', 'm':'kg' };
                        let q = choice==='Q' ? `質量 <i>m</i> = ${fmt(m)} kg。求 <i>Q</i>。` : `能量 <i>Q</i> = ${fmt(Q)} J。求 <i>m</i>。`;
                        return { unit: units[choice], q: q + `<br>(<i>l<sub>v</sub></i> = ${fmt(lv)} J kg${unitSup('-1')})`, a: choice==='Q'?Q:m };
                    }
                },
                {
                    id:'h5', label:'氣體定律 pV=nRT', html:'pV = nRT',
                    symbols: { 'p':'壓強 (Pa)', 'V':'體積 (m³)', 'n':'摩爾數', 'T':'溫度 (K)' },
                    gen:()=>{ 
                        const n=rand(1, 3, 1); const T=rand(300, 400, 0); const V=rand(0.02, 0.05, 3);
                        const p = (n * C.R * T) / V;
                        const vars = { 'p':p, 'V':V, 'n':n, 'T':T };
                        const keys = ['p','V','n','T'];
                        const choice = keys[Math.floor(Math.random()*keys.length)];
                        const units = { 'p':'Pa', 'V':'m³', 'n':'mol', 'T':'K' };
                        
                        let qStr = "";
                        keys.forEach(k => {
                            if(k !== choice) qStr += `<i>${k}</i> = ${fmt(vars[k])} ${units[k]}，`;
                        });
                        return { unit: units[choice], q: qStr.slice(0,-1) + `。求 <i>${choice}</i>。`, a: vars[choice] };
                    }
                },
                {
                    id:'h6', label:'分子運動論 pV=1/3Nmc²', html:'pV = 1/3 Nm<span style="text-decoration:overline">c<sup>2</sup></span>', 
                    symbols: { 'p':'壓強', 'V':'體積', 'N':'分子數', 'm':'分子質量', 'c2':'方均速率' },
                    gen:()=>{ 
                        const N = rand(1e23, 5e23, 0); const m = 5e-26; const c2 = 250000; const V = 0.1;
                        const p = (1/3 * N * m * c2) / V;
                        const c = Math.sqrt(c2);
                        
                        // Variables to play with: p, V, N. (Assume m and c are given constants for simplicity in question text flow, or vary them too)
                        // Let's vary p, V, N.
                        const choice = ['p','V','N'][Math.floor(Math.random()*3)];
                        const common = `<i>m</i> = ${fmt(m)} kg，方均速率 = ${fmt(c)} m s${unitSup('-1')}`;
                        
                        if(choice==='p') return { unit:'Pa', q:`<i>N</i> = ${fmt(N)}，體積 <i>V</i> = ${fmt(V)} m${unitSup('3')}，${common}。求 <i>p</i>。`, a:p };
                        if(choice==='V') return { unit:'m³', q:`<i>N</i> = ${fmt(N)}，壓強 <i>p</i> = ${fmt(p)} Pa，${common}。求 <i>V</i>。`, a:V };
                        return { unit:'', q:`壓強 <i>p</i> = ${fmt(p)} Pa，體積 <i>V</i> = ${fmt(V)} m${unitSup('3')}，${common}。求 <i>N</i>。`, a:N };
                    }
                },
                {
                    id:'h7', label:'氣體動能 Ek=3RT/2NA', html:'E<sub>k</sub> = 3RT / 2N<sub>A</sub>',
                    symbols: { 'E<sub>k</sub>':'平均動能', 'T':'溫度' },
                    gen:()=>{ 
                        const T=rand(200, 600, 0); const Ek = (3 * C.R * T) / (2 * C.NA);
                        const choice = Math.random() < 0.5 ? 'Ek' : 'T';
                        if(choice==='Ek') return { unit:'J', q:`溫度 <i>T</i> = ${fmt(T)} K。求 <i>E<sub>k</sub></i>。`, a:Ek };
                        return { unit:'K', q:`平均動能 <i>E<sub>k</sub></i> = ${fmt(Ek)} J。求 <i>T</i>。`, a:T };
                    }
                }
            ],
            mechanics: [
                {
                    id:'m1', label:'運動方程 v=u+at', html:'v = u + at', 
                    symbols: { 'v':'末速', 'u':'初速', 'a':'加速度', 't':'時間' },
                    gen:()=>{ 
                        const u=rand(0, 10, 0); const a=rand(2, 5, 0); const t=rand(2, 6, 0); const v = u+a*t;
                        const vars = { 'v':v, 'u':u, 'a':a, 't':t };
                        const choice = ['v','u','a','t'][Math.floor(Math.random()*4)];
                        const units = { 'v':'m s⁻¹', 'u':'m s⁻¹', 'a':'m s⁻²', 't':'s' };
                        
                        let qStr = "";

                        for(let k in vars) if(k!==choice) qStr += `<i>${k}</i> = ${fmt(vars[k])} ${units[k]}，`;
                        return { unit: units[choice], q: qStr.slice(0,-1) + `。求 <i>${choice}</i>。`, a: vars[choice] };
                    }
                },
                {
                    id:'en6', label:'能源效益', html:'Eff = E<sub>out</sub> / E<sub>in</sub>', 
                    symbols: { 'Eff':'效率', 'E<sub>out</sub>':'輸出', 'E<sub>in</sub>':'輸入' },
                    gen:()=>{ 
                        const out=800; const inp=1000; const eff=(out/inp)*100;
                        const vars = { 'Eff':eff, 'E<sub>out</sub>':out, 'E<sub>in</sub>':inp };
                        const choice = ['Eff','E<sub>out</sub>','E<sub>in</sub>'][Math.floor(Math.random()*3)];
                        const units = { 'Eff':'%', 'E<sub>out</sub>':'J', 'E<sub>in</sub>':'J' };
                        let qStr = "";
                        for(let k in vars) if(k!==choice) qStr += `<i>${k}</i> = ${fmt(vars[k])} ${units[k]}，`;
                        return { unit: units[choice], q: qStr.slice(0,-1) + `。求 <i>${choice}</i>。`, a: vars[choice] };
                    }
                }
            ]
        };

        // --- State & Logic ---
        let curTopic = 'heat';
        let curId = null;
        let curData = {};
        let isRevealed = false;
        let streak = 0;
        let calcBuffer = "";

        window.addEventListener('load', () => setTopic('heat'));

        function setTopic(t) {
            curTopic = t;
            document.querySelectorAll('.nav-btn').forEach(b => {
                const active = b.dataset.topic === t;
                b.className = `nav-btn whitespace-nowrap px-4 py-2 text-sm font-bold border-b-2 transition ${active ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500 hover:text-blue-600'}`;
            });
            
            const s = document.getElementById('formulaSelect');
            s.innerHTML = '';
            formulaDB[t].forEach(f => {
                const o = document.createElement('option');
                o.value = f.id;
                o.text = f.label;
                s.add(o);
            });
            
            // Sync dropdown
            const firstId = formulaDB[t][0].id;
            s.value = firstId;
            loadFormula(firstId);
        }

        function loadFormula(id) {
            curId = id;
            const item = formulaDB[curTopic].find(i => i.id === id);
            
            isRevealed = false;
            const c = document.getElementById('latexContainer');
            c.classList.remove('revealed');
            
            document.getElementById('formulaDisplay').innerHTML = item.html;
            generateQuestion();
        }

        function toggleFormula() {
            isRevealed = !isRevealed;
            const c = document.getElementById('latexContainer');
            if(isRevealed) c.classList.add('revealed');
            else c.classList.remove('revealed');
        }

        function generateQuestion() {
            const item = formulaDB[curTopic].find(i => i.id === curId);
            curData = item.gen();
            
            document.getElementById('qTag').innerText = curTopic.toUpperCase();
            document.getElementById('unitLabel').innerText = curData.unit || '--';
            
            calcBuffer = "";
            updateDisplay();
            const btn = document.getElementById('enterBtn');
            btn.disabled = false;
            btn.classList.remove('opacity-50', 'cursor-not-allowed');

            document.getElementById('feedback').innerHTML = '<span class="text-slate-400 text-sm font-sans font-normal">請輸入答案 Input Answer</span>';
            document.getElementById('feedback').className = "text-center font-bold p-3 rounded bg-slate-50 border border-slate-100 min-h-[3.5rem] flex items-center justify-center paper-font text-lg";

            const q = document.getElementById('qText');
            q.style.opacity = 0;
            setTimeout(() => {
                q.innerHTML = curData.q;
                q.style.opacity = 1;
            }, 100);
        }

        // --- Symbol Modal Logic ---
        function openSymbolModal() {
            const item = formulaDB[curTopic].find(i => i.id === curId);
            const tbody = document.getElementById('symbolTableBody');
            tbody.innerHTML = '';

            if (item.symbols) {
                for (const [sym, meaning] of Object.entries(item.symbols)) {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="px-4 py-3 border-b font-mono font-bold text-blue-700 text-base md:text-lg">${sym}</td>
                        <td class="px-4 py-3 border-b text-slate-700">${meaning}</td>
                    `;
                    tbody.appendChild(tr);
                }
            } else {
                tbody.innerHTML = '<tr><td colspan="2" class="px-4 py-4 text-center text-slate-500">No symbol data available.</td></tr>';
            }

            document.getElementById('symbolModal').classList.remove('hidden');
        }

        function closeSymbolModal() {
            document.getElementById('symbolModal').classList.add('hidden');
        }

        // --- Calculator ---
        function calcInput(val) {
            if (val === 'EXP') {
                if (calcBuffer.includes('e')) return;
                if (calcBuffer === "") calcBuffer = "1e";
                else calcBuffer += "e";
            } else if (val === '-') {
                if(calcBuffer === "") calcBuffer = "-";
                else if (calcBuffer.slice(-1) === 'e') calcBuffer += "-";
            } else {
                calcBuffer += val;
            }
            updateDisplay();
        }

        function calcAction(act) {
            if (act === 'AC') calcBuffer = "";
            if (act === 'DEL') calcBuffer = calcBuffer.slice(0, -1);
            updateDisplay();
        }

        function updateDisplay() {
            document.getElementById('calcDisplay').value = calcBuffer || "0";
        }

        function checkAnswer() {
            if (!calcBuffer) return;
            const userVal = parseFloat(calcBuffer);
            if (isNaN(userVal)) return;

            const correct = curData.a;
            // Adaptive tolerance: 1.5% relative error or absolute error for small numbers
            const tol = Math.abs(correct) < 1e-15 ? 1e-15 : Math.abs(correct * 0.015);
            const diff = Math.abs(userVal - correct);
            const isCorrect = diff <= tol;

            const fb = document.getElementById('feedback');
            if (isCorrect) {
                streak++;
                fb.innerHTML = "Correct! ✅";
                fb.className = "text-center font-bold p-3 rounded bg-green-100 text-green-700 border border-green-200 min-h-[3.5rem] flex items-center justify-center paper-font text-lg";
                document.getElementById('enterBtn').disabled = true;
                document.getElementById('enterBtn').classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                streak = 0;
                fb.innerHTML = `Wrong. Answer: ${fmt(correct)}`;
                fb.className = "text-center font-bold p-3 rounded bg-red-100 text-red-700 border border-red-200 min-h-[3.5rem] flex items-center justify-center paper-font text-lg";
            }
            document.getElementById('streakCount').innerText = streak;
        }
    </script>
</body>
</html>
