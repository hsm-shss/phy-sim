<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HKDSE Physics Arena (Full Syllabus)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Roboto+Mono:wght@500&display=swap');
        
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #f8fafc; 
        }
        
        /* DSE Paper Style Font */
        .paper-font {
            font-family: 'Times New Roman', Times, serif;
        }

        /* Scientific Notation Superscript */
        .sci-exp {
            font-size: 0.75em;
            vertical-align: super;
            margin-left: 1px;
        }

        /* Calculator Styles */
        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
        }
        .calc-btn {
            @apply h-12 md:h-14 text-lg md:text-xl font-bold rounded shadow-sm transition-all active:scale-95 flex items-center justify-center select-none;
            font-family: 'Roboto Mono', monospace;
        }
        .btn-num { @apply bg-white text-slate-800 border border-slate-300 hover:bg-slate-50; }
        .btn-action { @apply bg-slate-200 text-slate-800 border border-slate-300 hover:bg-slate-300; }
        .btn-enter { @apply bg-blue-600 text-white border border-blue-700 hover:bg-blue-700; }
        
        .display-screen {
            font-family: 'Roboto Mono', monospace;
            letter-spacing: 0.05em;
        }

        /* Formula Reveal Effect */
        .blur-reveal { filter: blur(6px); user-select: none; transition: filter 0.3s ease; }
        .blur-reveal.revealed { filter: blur(0); user-select: auto; }

        /* Scrollbar for nav */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

    <!-- Header -->
    <header class="bg-slate-800 text-white p-3 shadow-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold flex items-center gap-2">
                📖 HKDSE Physics
            </h1>
            <div class="bg-slate-700 px-3 py-1 rounded text-sm font-mono border border-slate-600">
                Streak: <span id="streakCount" class="text-yellow-400 font-bold">0</span>
            </div>
        </div>
    </header>

    <!-- Navigation (Scrollable) -->
    <nav class="bg-white shadow-sm border-b border-slate-200 sticky top-[52px] z-40">
        <div class="max-w-5xl mx-auto flex overflow-x-auto hide-scrollbar py-1">
            <button onclick="setTopic('heat')" class="nav-btn whitespace-nowrap px-4 py-2 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-blue-600" data-topic="heat">熱學 Heat</button>
            <button onclick="setTopic('mechanics')" class="nav-btn whitespace-nowrap px-4 py-2 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-blue-600" data-topic="mechanics">力學 Mech</button>
            <button onclick="setTopic('waves')" class="nav-btn whitespace-nowrap px-4 py-2 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-blue-600" data-topic="waves">波動 Waves</button>
            <button onclick="setTopic('em')" class="nav-btn whitespace-nowrap px-4 py-2 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-blue-600" data-topic="em">電磁 E&M</button>
            <button onclick="setTopic('atomic')" class="nav-btn whitespace-nowrap px-4 py-2 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-blue-600" data-topic="atomic">原子 Atomic</button>
            <button onclick="setTopic('medical')" class="nav-btn whitespace-nowrap px-4 py-2 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-blue-600" data-topic="medical">醫學 Med</button>
            <button onclick="setTopic('energy')" class="nav-btn whitespace-nowrap px-4 py-2 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-blue-600" data-topic="energy">能源 Energy</button>
        </div>
    </nav>

    <main class="flex-grow p-3 md:p-6 max-w-5xl mx-auto w-full flex flex-col gap-4">
        
        <!-- Formula Selector & Display -->
        <div class="bg-white rounded-lg shadow-sm border border-slate-200 p-4">
            <div class="flex flex-col md:flex-row gap-4 items-center">
                <div class="w-full md:w-1/3">
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">公式 Formula</label>
                    <select id="formulaSelect" class="w-full p-2 bg-slate-50 border border-slate-300 rounded font-bold text-slate-700 text-sm" onchange="loadFormula(this.value)"></select>
                </div>
                <div class="w-full md:w-2/3 relative cursor-pointer group" onclick="toggleFormula()">
                    <div class="absolute top-0 left-0 text-[10px] text-slate-400 uppercase font-bold tracking-wider">Tap to reveal</div>
                    <div id="latexContainer" class="blur-reveal bg-slate-50 rounded border border-slate-200 p-4 min-h-[80px] flex items-center justify-center text-center">
                        <div id="formulaDisplay" class="text-2xl md:text-3xl paper-font italic text-slate-800"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Question & Calculator -->
        <div class="flex flex-col lg:flex-row gap-4">
            
            <!-- Question Panel -->
            <div class="bg-white rounded-lg shadow-sm border border-slate-200 p-5 lg:w-3/5 flex flex-col relative">
                <div class="flex justify-between items-start mb-4">
                    <span class="bg-slate-100 text-slate-500 text-[10px] font-bold px-2 py-1 rounded uppercase tracking-wide" id="qTag">TOPIC</span>
                    <button onclick="generateQuestion()" class="text-blue-600 hover:bg-blue-50 p-1.5 rounded transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    </button>
                </div>
                
                <div class="flex-grow flex items-center justify-center py-6">
                    <div id="qText" class="text-xl md:text-2xl leading-relaxed paper-font text-slate-900 w-full">Loading...</div>
                </div>
                
                <div class="mt-auto">
                    <div id="feedback" class="text-center font-bold p-3 rounded bg-slate-50 border border-slate-100 min-h-[3.5rem] flex items-center justify-center paper-font text-lg">
                        <span class="text-slate-400 text-sm font-sans font-normal">請輸入答案 Input Answer</span>
                    </div>
                </div>
            </div>

            <!-- Calculator Panel -->
            <div class="bg-slate-100 rounded-lg border border-slate-200 p-4 lg:w-2/5">
                <div class="mb-4 relative">
                    <input type="text" id="calcDisplay" class="display-screen w-full p-3 text-right text-2xl bg-white border border-slate-300 rounded shadow-inner text-slate-800" placeholder="0" readonly>
                    <span id="unitLabel" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 font-bold text-sm paper-font bg-slate-50 px-1 rounded border border-slate-200">--</span>
                </div>

                <div class="calc-grid">
                    <button onclick="calcInput('7')" class="calc-btn btn-num">7</button>
                    <button onclick="calcInput('8')" class="calc-btn btn-num">8</button>
                    <button onclick="calcInput('9')" class="calc-btn btn-num">9</button>
                    <button onclick="calcAction('DEL')" class="calc-btn btn-action text-red-600 text-base">DEL</button>
                    
                    <button onclick="calcInput('4')" class="calc-btn btn-num">4</button>
                    <button onclick="calcInput('5')" class="calc-btn btn-num">5</button>
                    <button onclick="calcInput('6')" class="calc-btn btn-num">6</button>
                    <button onclick="calcAction('AC')" class="calc-btn btn-action text-red-600 text-base">AC</button>
                    
                    <button onclick="calcInput('1')" class="calc-btn btn-num">1</button>
                    <button onclick="calcInput('2')" class="calc-btn btn-num">2</button>
                    <button onclick="calcInput('3')" class="calc-btn btn-num">3</button>
                    <button onclick="calcInput('EXP')" class="calc-btn btn-action text-sm">EXP</button>
                    
                    <button onclick="calcInput('0')" class="calc-btn btn-num">0</button>
                    <button onclick="calcInput('.')" class="calc-btn btn-num">.</button>
                    <button onclick="calcInput('-')" class="calc-btn btn-num">(-)</button>
                    <button onclick="checkAnswer()" id="enterBtn" class="calc-btn btn-enter text-base">EXE</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- Constants ---
        const C = { 
            g: 9.81, c: 3.00e8, R: 8.31, NA: 6.02e23, k: 1.38e-23, 
            G: 6.67e-11, me: 9.11e-31, e: 1.60e-19, epsilon0: 8.85e-12,
            mu0: 4 * Math.PI * 1e-7, water_c: 4200, ice_lf: 3.34e5, water_lv: 2.26e6,
            I0: 1e-12, solar: 1360
        };

        // --- Formatting Helpers ---

        // 1. Unicode Superscript for Units (e.g. m s^-1)
        function unitSup(str) {
            const map = {
                '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴',
                '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹',
                '-': '⁻', '+': '⁺'
            };
            return str.replace(/[-+0-9]/g, char => map[char] || char);
        }

        // 2. Scientific Notation HTML (A x 10^n)
        function toSci(num, precision = 2) {
            if (num === 0) return "0";
            let str = num.toExponential(precision); 
            let [mantissa, exponent] = str.split('e');
            let expInt = parseInt(exponent);
            if (expInt === 0) return parseFloat(mantissa).toFixed(precision);
            return `${mantissa} × 10<sup class="sci-exp">${expInt}</sup>`;
        }

        // 3. Smart Formatter
        function fmt(n) {
            let abs = Math.abs(n);
            if (abs === 0) return "0";
            
            if (abs >= 0.001 && abs <= 9999) {
                return parseFloat(n.toPrecision(4)).toString(); 
            }
            return toSci(n);
        }

        function rand(min, max, dec) { 
            return parseFloat((Math.random()*(max-min)+min).toFixed(dec)); 
        }

        // --- Formula Database (Updated: Removed $ symbols, used <i> for variables) ---
        const formulaDB = {
            heat: [
                {id:'h1', label:'比熱容量 Q=mcΔT', html:'Q = mc&Delta;T', unit:'J', gen:()=>{ 
                    const m=rand(0.5, 5, 1); const dt=rand(10, 40, 0); const Q = m * 4200 * dt;
                    return {unit:'J', q:`質量 ${fmt(m)} kg 的水，溫度上升 ${fmt(dt)}°C。求 <i>Q</i>。<br>(<i>c</i> = 4200 J kg${unitSup('-1')} °C${unitSup('-1')})`, a:Q};
                }},
                {id:'h2', label:'熱容量 Q=CΔT', html:'Q = C&Delta;T', unit:'J', gen:()=>{ 
                    const C=rand(200, 800, 0); const dt=rand(5, 20, 0); const Q = C * dt;
                    return {unit:'J', q:`熱容量 ${fmt(C)} J °C${unitSup('-1')}，溫升 ${fmt(dt)}°C。求 <i>Q</i>。`, a:Q};
                }},
                {id:'h3', label:'熔解潛熱 Q=ml_f', html:'Q = ml<sub>f</sub>', unit:'J', gen:()=>{ 
                    const m=rand(0.1, 1, 2); const Q = m * C.ice_lf;
                    return {unit:'J', q:`熔解 ${fmt(m)} kg 的冰。求 <i>Q</i>。<br>(<i>l<sub>f</sub></i> = ${fmt(C.ice_lf)} J kg${unitSup('-1')})`, a:Q};
                }},
                {id:'h4', label:'汽化潛熱 Q=ml_v', html:'Q = ml<sub>v</sub>', unit:'J', gen:()=>{ 
                    const m=rand(0.1, 0.5, 2); const Q = m * C.water_lv;
                    return {unit:'J', q:`汽化 ${fmt(m)} kg 的水。求 <i>Q</i>。<br>(<i>l<sub>v</sub></i> = ${fmt(C.water_lv)} J kg${unitSup('-1')})`, a:Q};
                }},
                {id:'h5', label:'氣體定律 pV=nRT', html:'pV = nRT', unit:'Pa', gen:()=>{ 
                    const n=rand(1, 3, 1); const T=rand(300, 400, 0); const V=rand(0.02, 0.05, 3);
                    const p = (n * C.R * T) / V;
                    return {unit:'Pa', q:`${fmt(n)} mol 氣體，${fmt(T)} K，體積 ${fmt(V)} m${unitSup('3')}。求 <i>p</i>。`, a:p};
                }},
                {id:'h6', label:'分子運動論 pV=1/3Nmc²', html:'pV = &frac{1}{3}Nm<span style="text-decoration:overline">c<sup>2</sup></span>', unit:'Pa', gen:()=>{ 
                    const N=rand(1e23, 5e23, 0); const m=5e-26; const c2=250000; const V=0.1;
                    const p = (1/3 * N * m * c2) / V;
                    return {unit:'Pa', q:`<i>N</i>=${fmt(N)}，<i>m</i>=${fmt(m)} kg，方均速率 ${fmt(Math.sqrt(c2))} m s${unitSup('-1')}，體積 ${fmt(V)} m${unitSup('3')}。求 <i>p</i>。`, a:p};
                }},
                {id:'h7', label:'氣體動能 Ek=3RT/2NA', html:'E<sub>k</sub> = 3RT / 2N<sub>A</sub>', unit:'J', gen:()=>{ 
                    const T=rand(200, 600, 0); const Ek = (3 * C.R * T) / (2 * C.NA);
                    return {unit:'J', q:`溫度 ${fmt(T)} K。求單原子分子的平均動能。`, a:Ek};
                }}
            ],
            mechanics: [
                {id:'m1', label:'運動方程 v=u+at', html:'v = u + at', unit:'m s⁻¹', gen:()=>{ 
                    const u=rand(0, 10, 0); const a=rand(2, 5, 0); const t=rand(2, 6, 0);
                    return {unit:'m s⁻¹', q:`<i>u</i>=${fmt(u)} m s${unitSup('-1')}，<i>a</i>=${fmt(a)} m s${unitSup('-2')}，<i>t</i>=${fmt(t)} s。求 <i>v</i>。`, a:u+a*t};
                }},
                {id:'m2', label:'運動方程 s=(u+v)t/2', html:'s = (u+v)t / 2', unit:'m', gen:()=>{ 
                    const u=10; const v=20; const t=4;
                    return {unit:'m', q:`<i>u</i>=${u} m s${unitSup('-1')}，<i>v</i>=${v} m s${unitSup('-1')}，<i>t</i>=${t} s。求 <i>s</i>。`, a:(u+v)*t/2};
                }},
                {id:'m3', label:'運動方程 s=ut+½at²', html:'s = ut + &frac{1}{2}at<sup>2</sup>', unit:'m', gen:()=>{ 
                    const u=0; const a=4; const t=5;
                    return {unit:'m', q:`<i>u</i>=${u}，<i>a</i>=${a} m s${unitSup('-2')}，<i>t</i>=${t} s。求 <i>s</i>。`, a:u*t + 0.5*a*t*t};
                }},
                {id:'m4', label:'運動方程 v²=u²+2as', html:'v<sup>2</sup> = u<sup>2</sup> + 2as', unit:'m s⁻¹', gen:()=>{ 
                    const u=0; const a=2; const s=100;
                    return {unit:'m s⁻¹', q:`<i>u</i>=${u}，<i>a</i>=${a} m s${unitSup('-2')}，<i>s</i>=${s} m。求 <i>v</i>。`, a:Math.sqrt(u*u + 2*a*s)};
                }},
                {id:'m5', label:'牛頓第二定律 F=ma', html:'F = ma', unit:'N', gen:()=>{ 
                    const m=50; const a=2; 
                    return {unit:'N', q:`質量 ${m} kg，加速度 ${a} m s${unitSup('-2')}。求 <i>F</i>。`, a:m*a};
                }},
                {id:'m6', label:'動量 p=mv', html:'p = mv', unit:'kg m s⁻¹', gen:()=>{ 
                    const m=2; const v=10;
                    return {unit:'kg m s⁻¹', q:`質量 ${m} kg，速度 ${v} m s${unitSup('-1')}。求 <i>p</i>。`, a:m*v};
                }},
                {id:'m7', label:'力與動量 F=Δp/Δt', html:'F = &Delta;p / &Delta;t', unit:'N', gen:()=>{ 
                    const dp=20; const dt=0.5;
                    return {unit:'N', q:`動量變化 ${dp} kg m s${unitSup('-1')}，歷時 ${dt} s。求平均力 <i>F</i>。`, a:dp/dt};
                }},
                {id:'m8', label:'衝量 Δp=FΔt', html:'&Delta;p = F&Delta;t', unit:'N s', gen:()=>{ 
                    const F=100; const dt=0.2;
                    return {unit:'N s', q:`力 ${F} N 作用 ${dt} s。求衝量。`, a:F*dt};
                }},
                {id:'m9', label:'機械功 W=Fs cosθ', html:'W = Fs cos&theta;', unit:'J', gen:()=>{ 
                    const F=50; const s=10; const deg=60;
                    return {unit:'J', q:`力 ${F} N，位移 ${s} m，夾角 ${deg}°。求功 <i>W</i>。`, a:F*s*Math.cos(deg*Math.PI/180)};
                }},
                {id:'m10', label:'動能 Ek=½mv²', html:'E<sub>k</sub> = &frac{1}{2}mv<sup>2</sup>', unit:'J', gen:()=>{ 
                    const m=1000; const v=20;
                    return {unit:'J', q:`質量 ${m} kg，速率 ${v} m s${unitSup('-1')}。求 <i>E<sub>k</sub></i>。`, a:0.5*m*v*v};
                }},
                {id:'m11', label:'勢能 Ep=mgh', html:'E<sub>p</sub> = mgh', unit:'J', gen:()=>{ 
                    const m=10; const h=50;
                    return {unit:'J', q:`質量 ${m} kg，高度 ${h} m。求 <i>E<sub>p</sub></i>。`, a:m*C.g*h};
                }},
                {id:'m12', label:'功率 P=Fv', html:'P = Fv', unit:'W', gen:()=>{ 
                    const F=500; const v=10;
                    return {unit:'W', q:`驅動力 ${F} N，速率 ${v} m s${unitSup('-1')}。求功率 <i>P</i>。`, a:F*v};
                }},
                {id:'m13', label:'向心加速度 a=v²/r', html:'a = v<sup>2</sup> / r', unit:'m s⁻²', gen:()=>{ 
                    const v=10; const r=5;
                    return {unit:'m s⁻²', q:`速率 ${v} m s${unitSup('-1')}，半徑 ${r} m。求 <i>a</i>。`, a:v*v/r};
                }},
                {id:'m14', label:'向心力 F=mv²/r', html:'F = mv<sup>2</sup> / r', unit:'N', gen:()=>{ 
                    const m=2; const v=5; const r=1;
                    return {unit:'N', q:`質量 ${m} kg，速率 ${v} m s${unitSup('-1')}，半徑 ${r} m。求 <i>F</i>。`, a:m*v*v/r};
                }},
                {id:'m15', label:'萬有引力 F=GMm/r²', html:'F = GMm / r<sup>2</sup>', unit:'N', gen:()=>{ 
                    const M=6e24; const m=1000; const r=7e6;
                    return {unit:'N', q:`<i>M</i>=${fmt(M)} kg，<i>m</i>=${fmt(m)} kg，<i>r</i>=${fmt(r)} m。求 <i>F</i>。`, a:(C.G*M*m)/(r*r)};
                }},
                {id:'m16', label:'引力場 g=GM/r²', html:'g = GM / r<sup>2</sup>', unit:'N kg⁻¹', gen:()=>{ 
                    const M=6e24; const r=6.4e6;
                    return {unit:'N kg⁻¹', q:`地球質量 ${fmt(M)} kg，半徑 ${fmt(r)} m。求表面 <i>g</i>。`, a:(C.G*M)/(r*r)};
                }},
                {id:'m17', label:'引力勢能 U=-GMm/r', html:'U = -GMm / r', unit:'J', gen:()=>{ 
                    const M=6e24; const m=500; const r=8e6;
                    return {unit:'J', q:`<i>M</i>=${fmt(M)} kg，<i>m</i>=${fmt(m)} kg，<i>r</i>=${fmt(r)} m。求 <i>U</i>。`, a:-(C.G*M*m)/r};
                }}
            ],
            waves: [
                {id:'w1', label:'波速 v=fλ', html:'v = f&lambda;', unit:'m s⁻¹', gen:()=>{ 
                    const f=200; const l=1.5;
                    return {unit:'m s⁻¹', q:`頻率 ${f} Hz，波長 ${l} m。求 <i>v</i>。`, a:f*l};
                }},
                {id:'w2', label:'頻率 f=1/T', html:'f = 1 / T', unit:'Hz', gen:()=>{ 
                    const T=0.02;
                    return {unit:'Hz', q:`週期 ${T} s。求 <i>f</i>。`, a:1/T};
                }},
                {id:'w3', label:'折射率 n=c/v', html:'n = c / v', unit:'', gen:()=>{ 
                    const v=2e8;
                    return {unit:'', q:`介質光速 ${fmt(v)} m s${unitSup('-1')}。求 <i>n</i>。`, a:C.c/v};
                }},
                {id:'w4', label:'斯涅耳定律', html:'n<sub>1</sub>sin&theta;<sub>1</sub> = n<sub>2</sub>sin&theta;<sub>2</sub>', unit:'', gen:()=>{ 
                    const n1=1; const t1=45; const t2=30;
                    const n2 = (n1 * Math.sin(t1*Math.PI/180)) / Math.sin(t2*Math.PI/180);
                    return {unit:'', q:`光由空氣(<i>n</i>=1)射入，入射角 45°，折射角 30°。求介質 <i>n</i>。`, a:n2};
                }},
                {id:'w5', label:'透鏡公式 1/f=1/u+1/v', html:'1/f = 1/u + 1/v', unit:'m', gen:()=>{ 
                    const u=0.2; const f=0.1;
                    const v = 1/(1/f - 1/u);
                    return {unit:'m', q:`物距 ${u} m，焦距 ${f} m (凸透鏡)。求像距 <i>v</i>。`, a:v};
                }},
                {id:'w6', label:'放大率 m=v/u', html:'m = v / u', unit:'', gen:()=>{ 
                    const v=0.3; const u=0.1;
                    return {unit:'', q:`像距 ${v} m，物距 ${u} m。求 <i>m</i>。`, a:v/u};
                }},
                {id:'w7', label:'雙縫干涉 Δy=λD/a', html:'&Delta;y = &lambda;D / a', unit:'m', gen:()=>{ 
                    const l=6e-7; const D=1; const a=1e-3;
                    return {unit:'m', q:`波長 ${fmt(l)} m，縫屏距 ${D} m，縫距 ${fmt(a)} m。求條紋間距。`, a:(l*D)/a};
                }},
                {id:'w8', label:'光柵 d sinθ=nλ', html:'d sin&theta; = n&lambda;', unit:'°', gen:()=>{ 
                    const d=2e-6; const l=5e-7; const n=1;
                    const sinT = (n*l)/d;
                    return {unit:'°', q:`光柵間距 ${fmt(d)} m，波長 ${fmt(l)} m。求第一級角度。`, a:Math.asin(sinT)*180/Math.PI};
                }}
            ],
            em: [
                {id:'e1', label:'庫侖定律', html:'F = Q<sub>1</sub>Q<sub>2</sub> / 4&pi;&epsilon;<sub>0</sub>r<sup>2</sup>', unit:'N', gen:()=>{ 
                    const Q=1e-6; const r=0.1;
                    return {unit:'N', q:`兩電荷均為 ${fmt(Q)} C，相距 ${r} m。求靜電力。`, a:(Q*Q)/(4*Math.PI*C.epsilon0*r*r)};
                }},
                {id:'e2', label:'點電荷電場', html:'E = Q / 4&pi;&epsilon;<sub>0</sub>r<sup>2</sup>', unit:'N C⁻¹', gen:()=>{ 
                    const Q=2e-6; const r=0.5;
                    return {unit:'N C⁻¹', q:`電荷 ${fmt(Q)} C，距離 ${r} m。求電場強度。`, a:Q/(4*Math.PI*C.epsilon0*r*r)};
                }},
                {id:'e3', label:'勻強電場 E=V/d', html:'E = V / d', unit:'V m⁻¹', gen:()=>{ 
                    const V=100; const d=0.05;
                    return {unit:'V m⁻¹', q:`電壓 ${V} V，板間距 ${d} m。求 <i>E</i>。`, a:V/d};
                }},
                {id:'e4', label:'歐姆定律 V=IR', html:'V = IR', unit:'V', gen:()=>{ 
                    const I=2; const R=10;
                    return {unit:'V', q:`電流 ${I} A，電阻 ${R} &Omega;。求 <i>V</i>。`, a:I*R};
                }},
                {id:'e5', label:'電阻率 R=ρl/A', html:'R = &rho;l / A', unit:'Ω', gen:()=>{ 
                    const rho=1e-6; const l=2; const A=1e-6;
                    return {unit:'Ω', q:`&rho;=${fmt(rho)} &Omega; m，<i>l</i>=${l} m，<i>A</i>=${fmt(A)} m${unitSup('2')}。求 <i>R</i>。`, a:(rho*l)/A};
                }},
                {id:'e6', label:'電功率 P=V²/R', html:'P = V<sup>2</sup> / R', unit:'W', gen:()=>{ 
                    const V=12; const R=6;
                    return {unit:'W', q:`電壓 ${V} V，電阻 ${R} &Omega;。求 <i>P</i>。`, a:(V*V)/R};
                }},
                {id:'e7', label:'直導線磁場', html:'B = &mu;<sub>0</sub>I / 2&pi;r', unit:'T', gen:()=>{ 
                    const I=5; const r=0.02;
                    return {unit:'T', q:`電流 ${I} A，距離 ${r} m。求 <i>B</i>。`, a:(C.mu0*I)/(2*Math.PI*r)};
                }},
                {id:'e8', label:'磁力 F=BIl sinθ', html:'F = BIl sin&theta;', unit:'N', gen:()=>{ 
                    const B=0.5; const I=2; const l=0.5;
                    return {unit:'N', q:`<i>B</i>=${B} T，<i>I</i>=${I} A，長 ${l} m (垂直)。求 <i>F</i>。`, a:B*I*l};
                }},
                {id:'e9', label:'磁力 F=BQv sinθ', html:'F = BQv sin&theta;', unit:'N', gen:()=>{ 
                    const B=0.1; const Q=1.6e-19; const v=1e6;
                    return {unit:'N', q:`<i>B</i>=${B} T，質子速率 ${fmt(v)} m s${unitSup('-1')} (垂直)。求 <i>F</i>。`, a:B*Q*v};
                }},
                {id:'e10', label:'磁通量 Φ=BA cosθ', html:'&Phi; = BA cos&theta;', unit:'Wb', gen:()=>{ 
                    const B=0.2; const A=0.5; const deg=0;
                    return {unit:'Wb', q:`<i>B</i>=${B} T，面積 ${A} m${unitSup('2')} (垂直)。求 &Phi;。`, a:B*A};
                }},
                {id:'e11', label:'法拉第定律', html:'&epsilon; = N&Delta;&Phi; / &Delta;t', unit:'V', gen:()=>{ 
                    const N=100; const dPhi=0.05; const dt=0.1;
                    return {unit:'V', q:`線圈 ${N} 匝，磁通改變 ${dPhi} Wb，歷時 ${dt} s。求 &epsilon;。`, a:N*dPhi/dt};
                }},
                {id:'e12', label:'方均根 Vrms', html:'V<sub>rms</sub> = V<sub>0</sub> / &radic;2', unit:'V', gen:()=>{ 
                    const V0=311;
                    return {unit:'V', q:`峰值電壓 ${V0} V。求 <i>V<sub>rms</sub></i>。`, a:V0/Math.sqrt(2)};
                }},
                {id:'e13', label:'變壓器', html:'V<sub>s</sub>/V<sub>p</sub> = N<sub>s</sub>/N<sub>p</sub>', unit:'V', gen:()=>{ 
                    const Vp=220; const Np=1000; const Ns=50;
                    return {unit:'V', q:`原線圈 ${Np} 匝，副線圈 ${Ns} 匝，輸入 ${Vp} V。求輸出。`, a:Vp*(Ns/Np)};
                }}
            ],
            atomic: [
                {id:'a1', label:'放射強度 A=kN', html:'A = kN', unit:'Bq', gen:()=>{ 
                    const k=0.05; const N=10000;
                    return {unit:'Bq', q:`衰變常數 ${k} s${unitSup('-1')}，核數目 ${N}。求 <i>A</i>。`, a:k*N};
                }},
                {id:'a2', label:'半衰期', html:'k = ln2 / t<sub>1/2</sub>', unit:'s⁻¹', gen:()=>{ 
                    const t=100;
                    return {unit:'s⁻¹', q:`半衰期 ${t} s。求 <i>k</i>。`, a:Math.log(2)/t};
                }},
                {id:'a3', label:'衰變定律', html:'N = N<sub>0</sub>e<sup>-kt</sup>', unit:'', gen:()=>{ 
                    const N0=1000; const k=0.1; const t=10;
                    return {unit:'(數目)', q:`初始 ${N0}，常數 ${k} s${unitSup('-1')}，經過 ${t} s。求剩餘核數。`, a:N0*Math.exp(-k*t)};
                }},
                {id:'a4', label:'質能關係', html:'&Delta;E = &Delta;mc<sup>2</sup>', unit:'J', gen:()=>{ 
                    const dm=1.66e-27;
                    return {unit:'J', q:`質量虧損 ${fmt(dm)} kg。求能量。`, a:dm*C.c*C.c};
                }}
            ],
            medical: [
                {id:'med1', label:'瑞利判據', html:'&theta; &approx; 1.22&lambda; / d', unit:'rad', gen:()=>{ 
                    const l=5e-7; const d=0.002;
                    return {unit:'rad', q:`波長 ${fmt(l)} m，瞳孔直徑 ${fmt(d)} m。求角解像度。`, a:1.22*l/d};
                }},
                {id:'med2', label:'聲強級', html:'L = 10 log(I/I<sub>0</sub>)', unit:'dB', gen:()=>{ 
                    const I=1e-6;
                    return {unit:'dB', q:`聲強 ${fmt(I)} W m${unitSup('-2')}。求聲強級。`, a:10*Math.log10(I/C.I0)};
                }},
                {id:'med3', label:'聲阻抗 Z=ρc', html:'Z = &rho;c', unit:'kg m⁻² s⁻¹', gen:()=>{ 
                    const rho=1000; const c=1500;
                    return {unit:'kg m⁻² s⁻¹', q:`密度 ${rho} kg m${unitSup('-3')}，聲速 ${c} m s${unitSup('-1')}。求 <i>Z</i>。`, a:rho*c};
                }},
                {id:'med4', label:'反射係數', html:'&alpha; = (Z<sub>2</sub>-Z<sub>1</sub>)<sup>2</sup> / (Z<sub>2</sub>+Z<sub>1</sub>)<sup>2</sup>', unit:'', gen:()=>{ 
                    const Z1=400; const Z2=1200;
                    const num = Math.pow(Z2-Z1, 2);
                    const den = Math.pow(Z2+Z1, 2);
                    return {unit:'(比率)', q:`<i>Z<sub>1</sub></i>=${Z1}，<i>Z<sub>2</sub></i>=${Z2}。求反射係數。`, a:num/den};
                }},
                {id:'med5', label:'衰減 I=I₀e^-μx', html:'I = I<sub>0</sub>e<sup>-&mu;x</sup>', unit:'W m⁻²', gen:()=>{ 
                    const I0=100; const mu=2; const x=0.5;
                    return {unit:'W m⁻²', q:`<i>I<sub>0</sub></i>=${I0}，衰減系數 ${mu} m${unitSup('-1')}，厚度 ${x} m。求透射強度。`, a:I0*Math.exp(-mu*x)};
                }}
            ],
            energy: [
                {id:'en1', label:'風力功率', html:'P = &frac{1}{2}&eta;&rho;Av<sup>3</sup>', unit:'W', gen:()=>{ 
                    const eta=0.4; const A=100; const v=10; const rho=1.2;
                    return {unit:'W', q:`效率 ${eta}，面積 ${A} m${unitSup('2')}，風速 ${v} m s${unitSup('-1')}，密度 ${rho}。求 <i>P</i>。`, a:0.5*eta*rho*A*Math.pow(v,3)};
                }},
                {id:'en2', label:'太陽能板', html:'P = S &times; A &times; cos&theta; &times; &eta;', unit:'W', gen:()=>{ 
                    const S=1000; const A=2; const eta=0.15;
                    return {unit:'W', q:`輻射強度 ${S} W m${unitSup('-2')}，面積 ${A} m${unitSup('2')}，垂直照射，效率 ${eta}。求 <i>P</i>。`, a:S*A*eta};
                }},
                {id:'en3', label:'熱傳導 Q/t', html:'Q/t = &kappa;A&Delta;T / d', unit:'W', gen:()=>{ 
                    const k=0.8; const A=2; const dt=10; const d=0.2;
                    return {unit:'W', q:`&kappa;=${k}，面積 ${A} m${unitSup('2')}，溫差 ${dt}，厚度 ${d} m。求傳熱率。`, a:(k*A*dt)/d};
                }},
                {id:'en4', label:'U-值', html:'U = &kappa; / d', unit:'W m⁻² K⁻¹', gen:()=>{ 
                    const k=0.6; const d=0.15;
                    return {unit:'W m⁻² K⁻¹', q:`&kappa;=${k} W m${unitSup('-1')} K${unitSup('-1')}，厚度 ${d} m。求 U-value。`, a:k/d};
                }},
                {id:'en5', label:'COP', html:'COP = Q<sub>c</sub> / P', unit:'', gen:()=>{ 
                    const Qc=3000; const P=1000;
                    return {unit:'', q:`製冷量 ${Qc} W，輸入功率 ${P} W。求 COP。`, a:Qc/P};
                }},
                {id:'en6', label:'能源效益', html:'Eff = E<sub>out</sub> / E<sub>in</sub>', unit:'%', gen:()=>{ 
                    const out=800; const inp=1000;
                    return {unit:'%', q:`輸出 ${out} J，輸入 ${inp} J。求效益 (%)。`, a:(out/inp)*100};
                }}
            ]
        };

        // --- State & Logic ---
        let curTopic = 'heat';
        let curId = null;
        let curData = {};
        let isRevealed = false;
        let streak = 0;
        let calcBuffer = "";

        window.addEventListener('load', () => setTopic('heat'));

        function setTopic(t) {
            curTopic = t;
            // Update Nav Styles
            document.querySelectorAll('.nav-btn').forEach(b => {
                const active = b.dataset.topic === t;
                b.className = `nav-btn whitespace-nowrap px-4 py-2 text-sm font-bold border-b-2 transition ${active ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500 hover:text-blue-600'}`;
            });
            
            // Populate Select
            const s = document.getElementById('formulaSelect');
            s.innerHTML = '';
            formulaDB[t].forEach(f => {
                const o = document.createElement('option');
                o.value = f.id;
                o.text = f.label;
                s.add(o);
            });
            
            loadFormula(formulaDB[t][0].id);
        }

        function loadFormula(id) {
            curId = id;
            const item = formulaDB[curTopic].find(i => i.id === id);
            
            // Reset Reveal
            isRevealed = false;
            const c = document.getElementById('latexContainer');
            c.classList.remove('revealed');
            
            document.getElementById('formulaDisplay').innerHTML = item.html;
            generateQuestion();
        }

        function toggleFormula() {
            isRevealed = !isRevealed;
            const c = document.getElementById('latexContainer');
            if(isRevealed) c.classList.add('revealed');
            else c.classList.remove('revealed');
        }

        function generateQuestion() {
            const item = formulaDB[curTopic].find(i => i.id === curId);
            curData = item.gen();
            
            document.getElementById('qTag').innerText = curTopic.toUpperCase();
            document.getElementById('unitLabel').innerText = curData.unit;
            
            // Reset Calc
            calcBuffer = "";
            updateDisplay();
            const btn = document.getElementById('enterBtn');
            btn.disabled = false;
            btn.classList.remove('opacity-50', 'cursor-not-allowed');

            // Reset Feedback
            document.getElementById('feedback').innerHTML = '<span class="text-slate-400 text-sm font-sans font-normal">請輸入答案 Input Answer</span>';
            document.getElementById('feedback').className = "text-center font-bold p-3 rounded bg-slate-50 border border-slate-100 min-h-[3.5rem] flex items-center justify-center paper-font text-lg";

            // Fade in Question
            const q = document.getElementById('qText');
            q.style.opacity = 0;
            setTimeout(() => {
                q.innerHTML = curData.q;
                q.style.opacity = 1;
            }, 100);
        }

        // --- Calculator ---
        function calcInput(val) {
            if (val === 'EXP') {
                if (calcBuffer.includes('e')) return;
                if (calcBuffer === "") calcBuffer = "1e";
                else calcBuffer += "e";
            } else if (val === '-') {
                if(calcBuffer === "") calcBuffer = "-";
                else if (calcBuffer.slice(-1) === 'e') calcBuffer += "-";
            } else {
                calcBuffer += val;
            }
            updateDisplay();
        }

        function calcAction(act) {
            if (act === 'AC') calcBuffer = "";
            if (act === 'DEL') calcBuffer = calcBuffer.slice(0, -1);
            updateDisplay();
        }

        function updateDisplay() {
            document.getElementById('calcDisplay').value = calcBuffer || "0";
        }

        function checkAnswer() {
            if (!calcBuffer) return;
            const userVal = parseFloat(calcBuffer);
            if (isNaN(userVal)) return;

            const correct = curData.a;
            // Tolerance: 1% or 1e-15 absolute
            const tol = Math.abs(correct) < 1e-15 ? 1e-15 : Math.abs(correct * 0.015);
            const diff = Math.abs(userVal - correct);
            const isCorrect = diff <= tol;

            const fb = document.getElementById('feedback');
            if (isCorrect) {
                streak++;
                fb.innerHTML = "Correct! ✅";
                fb.className = "text-center font-bold p-3 rounded bg-green-100 text-green-700 border border-green-200 min-h-[3.5rem] flex items-center justify-center paper-font text-lg";
                document.getElementById('enterBtn').disabled = true;
                document.getElementById('enterBtn').classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                streak = 0;
                fb.innerHTML = `Wrong. Answer: ${fmt(correct)}`;
                fb.className = "text-center font-bold p-3 rounded bg-red-100 text-red-700 border border-red-200 min-h-[3.5rem] flex items-center justify-center paper-font text-lg";
            }
            document.getElementById('streakCount').innerText = streak;
        }
    </script>
</body>
