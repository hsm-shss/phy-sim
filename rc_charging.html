<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⏱️ RC 充放電 | SHSS物理虛擬實驗室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { background-color: #f0f9ff; font-family: 'Noto Sans TC', sans-serif; }
        
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">
    <header class="bg-slate-900 text-white p-4 md:p-5 shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <a href="index.html" class="bg-blue-600 p-2 rounded-xl shadow-blue-500/40 shadow-lg shrink-0 hover:bg-blue-500 transition" title="返回主頁">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                    </svg>
                </a>
                <div class="min-w-0">
                    <h1 class="text-lg md:text-xl font-black tracking-wide truncate">⏱️ RC 充放電</h1>
                    <p class="text-slate-400 text-xs font-medium tracking-wider">SHSS Physics Lab</p>
                </div>
            </div>
            <a href="index.html" class="text-sm font-bold text-blue-300 hover:text-white whitespace-nowrap">← 返回主頁</a>
        </div>
    </header>
    <main class="flex-grow p-4 md:p-8 max-w-6xl mx-auto w-full">
        <div class="bg-blue-50 border border-blue-100 rounded-2xl p-4 mb-6">
            <p class="text-sm font-bold text-blue-800 mb-1">🎯 學習目標</p>
            <p class="text-sm text-slate-600">電容器充電 V = ε(1−e^(−t/τ))、放電 V = V₀ e^(−t/τ)；τ = RC。</p>
        </div>

        <div class="grid lg:grid-cols-5 gap-6">
            <div class="lg:col-span-2 space-y-4">
                <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
                    <h2 class="font-bold text-slate-700">參數</h2>
                    <label class="block text-sm"><span class="font-medium text-slate-600">R：<b id="Rv">10</b> kΩ</span>
                        <input id="R" type="range" min="1" max="50" step="1" value="10" class="w-full accent-yellow-600 mt-1"></label>
                    <label class="block text-sm"><span class="font-medium text-slate-600">C：<b id="Cv">100</b> μF</span>
                        <input id="C" type="range" min="10" max="500" step="10" value="100" class="w-full accent-yellow-600 mt-1"></label>
                    <label class="block text-sm"><span class="font-medium text-slate-600">ε：<b id="ev">5</b> V</span>
                        <input id="e" type="range" min="1" max="12" step="1" value="5" class="w-full accent-yellow-600 mt-1"></label>
                    <div class="flex gap-2">
                        <button id="chg" class="flex-1 px-3 py-2 rounded-xl bg-slate-900 text-white text-sm font-bold">充電</button>
                        <button id="dis" class="flex-1 px-3 py-2 rounded-xl bg-slate-100 text-sm font-bold">放電</button>
                    </div>
                    <div class="rounded-xl bg-yellow-50 border border-yellow-100 p-3 text-sm">
                        <p>τ = RC = <b id="tau">—</b> s</p>
                        <p>V_C = <b id="Vc">0.00</b> V　t = <b id="tt">0.00</b> s</p>
                    </div>
                </div>
            </div>
            <div class="lg:col-span-3 bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
                <canvas id="cv" width="560" height="360" class="w-full h-auto rounded-xl bg-slate-50"></canvas>
            </div>
        </div>

    </main>
    <footer class="bg-slate-900 text-slate-400 py-6 mt-10 border-t border-slate-800">
        <div class="max-w-6xl mx-auto px-6 text-center text-sm">
            &copy; 2026 SHSS物理虛擬實驗室 · 原創課堂互動教材
        </div>
    </footer>
<script>

(function(){
  const R=document.getElementById('R'),C=document.getElementById('C'),eEl=document.getElementById('e');
  const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  let mode='idle', t=0, Vc=0, hist=[], last=null;
  function tau(){return (+R.value)*1e3 * (+C.value)*1e-6;}
  function sync(){
    document.getElementById('Rv').textContent=R.value;
    document.getElementById('Cv').textContent=C.value;
    document.getElementById('ev').textContent=eEl.value;
    document.getElementById('tau').textContent=tau().toFixed(3);
    document.getElementById('Vc').textContent=Vc.toFixed(2);
    document.getElementById('tt').textContent=t.toFixed(2);
  }
  function drawGraph(){
    sync();
    ctx.clearRect(0,0,560,360);ctx.fillStyle='#f8fafc';ctx.fillRect(0,0,560,360);
    const L=50,RR=530,T=30,B=300, eps=+eEl.value;
    ctx.strokeStyle='#94a3b8';ctx.beginPath();ctx.moveTo(L,B);ctx.lineTo(RR,B);ctx.moveTo(L,T);ctx.lineTo(L,B);ctx.stroke();
    ctx.fillStyle='#64748b';ctx.font='12px sans-serif';ctx.fillText('t',RR-10,B+18);ctx.fillText('V',L-18,T+8);
    const tmax=Math.max(5*tau(),1);
    function px(tt){return L+(RR-L)*(tt/tmax);} function py(v){return B-(B-T)*(v/eps);}
    ctx.strokeStyle='#eab308';ctx.lineWidth=2;ctx.beginPath();
    hist.forEach((p,i)=>{const X=px(p.t),Y=py(p.v); if(i===0)ctx.moveTo(X,Y); else ctx.lineTo(X,Y);});
    ctx.stroke();ctx.lineWidth=1;
    // 0.63 eps marker
    ctx.setLineDash([4,4]);ctx.strokeStyle='#94a3b8';ctx.beginPath();ctx.moveTo(L,py(0.632*eps));ctx.lineTo(RR,py(0.632*eps));ctx.stroke();ctx.setLineDash([]);
    ctx.fillText('0.63ε (~τ)', L+8, py(0.632*eps)-4);
  }
  function loop(ts){
    if(mode==='idle'){drawGraph();return;}
    if(last==null)last=ts; const dt=Math.min(0.05,(ts-last)/1000); last=ts;
    const eps=+eEl.value, ta=tau();
    if(mode==='charge'){ Vc = eps - (eps-Vc)*Math.exp(-dt/ta); }
    else { Vc = Vc*Math.exp(-dt/ta); }
    t+=dt; hist.push({t,v:Vc}); if(hist.length>800) hist.shift();
    drawGraph(); requestAnimationFrame(loop);
  }
  document.getElementById('chg').onclick=()=>{mode='charge';t=0;hist=[];last=null;requestAnimationFrame(loop);};
  document.getElementById('dis').onclick=()=>{mode='discharge'; /* keep Vc */ t=0;hist=[{t:0,v:Vc}];last=null;requestAnimationFrame(loop);};
  [R,C,eEl].forEach(e=>e.addEventListener('input',()=>{if(mode==='idle')drawGraph();}));
  drawGraph();
})();

</script>
</body>
</html>
