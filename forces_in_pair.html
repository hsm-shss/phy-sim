<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚖️ 作用力與反作用力 | SHSS物理虛擬實驗室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { background-color: #f0f9ff; font-family: 'Noto Sans TC', sans-serif; }
        
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">
    <header class="bg-slate-900 text-white p-4 md:p-5 shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <a href="index.html" class="bg-blue-600 p-2 rounded-xl shadow-blue-500/40 shadow-lg shrink-0 hover:bg-blue-500 transition" title="返回主頁">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                    </svg>
                </a>
                <div class="min-w-0">
                    <h1 class="text-lg md:text-xl font-black tracking-wide truncate">⚖️ 作用力與反作用力</h1>
                    <p class="text-slate-400 text-xs font-medium tracking-wider">SHSS Physics Lab</p>
                </div>
            </div>
            <a href="index.html" class="text-sm font-bold text-blue-300 hover:text-white whitespace-nowrap">← 返回主頁</a>
        </div>
    </header>
    <main class="flex-grow p-4 md:p-8 max-w-6xl mx-auto w-full">
        <div class="bg-blue-50 border border-blue-100 rounded-2xl p-4 mb-6">
            <p class="text-sm font-bold text-blue-800 mb-1">🎯 學習目標</p>
            <p class="text-sm text-slate-600">牛頓第三定律：A 對 B 的力與 B 對 A 的力等大反向、作用於不同物體。</p>
        </div>

        <div class="grid lg:grid-cols-5 gap-6">
            <div class="lg:col-span-2 space-y-4">
                <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
                    <h2 class="font-bold text-slate-700">情景</h2>
                    <select id="scene" class="w-full border rounded-xl px-3 py-2 text-sm">
                        <option value="push">兩人互推</option>
                        <option value="rocket">火箭噴氣</option>
                        <option value="box">推箱子（人↔箱）</option>
                    </select>
                    <label class="block text-sm"><span class="font-medium text-slate-600">作用力大小 F：<b id="fv">50</b> N</span>
                        <input id="F" type="range" min="10" max="120" step="5" value="50" class="w-full accent-orange-600 mt-1"></label>
                    <label class="block text-sm"><span class="font-medium text-slate-600">質量比 m₁:m₂：<b id="ratiov">1 : 2</b></span>
                        <input id="ratio" type="range" min="1" max="5" step="0.5" value="2" class="w-full accent-orange-600 mt-1"></label>
                    <div class="rounded-xl bg-orange-50 border border-orange-100 p-3 text-sm space-y-1">
                        <p>F₁₂ = <b id="f12">50</b> N　F₂₁ = <b id="f21">50</b> N</p>
                        <p class="text-xs text-slate-500">永遠 |F₁₂| = |F₂₁|，方向相反；加速度 a = F/m 可不同。</p>
                        <p>a₁ = <b id="a1">—</b>　a₂ = <b id="a2">—</b> m/s²</p>
                    </div>
                </div>
            </div>
            <div class="lg:col-span-3 bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
                <canvas id="cv" width="600" height="360" class="w-full h-auto rounded-xl bg-slate-50"></canvas>
            </div>
        </div>

    </main>
    <footer class="bg-slate-900 text-slate-400 py-6 mt-10 border-t border-slate-800">
        <div class="max-w-6xl mx-auto px-6 text-center text-sm">
            &copy; 2026 SHSS物理虛擬實驗室 · 原創課堂互動教材
        </div>
    </footer>
<script>

(function(){
  const F=document.getElementById('F'),ratio=document.getElementById('ratio'),scene=document.getElementById('scene');
  const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  function draw(){
    const f=+F.value, r=+ratio.value, m1=1, m2=r;
    document.getElementById('fv').textContent=f;
    document.getElementById('ratiov').textContent='1 : '+r;
    document.getElementById('f12').textContent=f;
    document.getElementById('f21').textContent=f;
    document.getElementById('a1').textContent=(f/m1).toFixed(1);
    document.getElementById('a2').textContent=(f/m2).toFixed(1);
    ctx.clearRect(0,0,600,360);ctx.fillStyle='#f8fafc';ctx.fillRect(0,0,600,360);
    ctx.fillStyle='#64748b';ctx.font='14px sans-serif';
    const sc=scene.value;
    // two blocks
    const y=180;
    ctx.fillStyle='#38bdf8';ctx.fillRect(120,y-30,80,60);
    ctx.fillStyle='#f97316';ctx.fillRect(400,y-30,80+m2*10,60);
    ctx.fillStyle='#0f172a';ctx.fillText('物體 1',130,y+5);ctx.fillText('物體 2',410,y+5);
    // arrows
    ctx.strokeStyle='#dc2626';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(210,y-15);ctx.lineTo(210+Math.min(120,f),y-15);ctx.stroke();
    ctx.beginPath();ctx.moveTo(390,y+15);ctx.lineTo(390-Math.min(120,f),y+15);ctx.stroke();
    ctx.lineWidth=1;ctx.fillStyle='#dc2626';
    ctx.fillText('F₁₂ →', 220, y-25); ctx.fillText('← F₂₁', 300, y+35);
    ctx.fillStyle='#334155';
    if(sc==='rocket') ctx.fillText('火箭：氣體被向後推，火箭被向前推（同一對力）', 80, 60);
    else if(sc==='box') ctx.fillText('人推箱：人對箱的力 = 箱對人的力（人會後退）', 80, 60);
    else ctx.fillText('互推：兩人受力等大，質量小者加速度較大', 80, 60);
  }
  [F,ratio,scene].forEach(e=>e.addEventListener('input',draw)); scene.addEventListener('change',draw); draw();
})();

</script>
</body>
</html>
