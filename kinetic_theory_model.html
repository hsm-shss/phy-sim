<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚛️ 分子動力論模型 | SHSS物理虛擬實驗室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { background-color: #f0f9ff; font-family: 'Noto Sans TC', sans-serif; }
        
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">
    <header class="bg-slate-900 text-white p-4 md:p-5 shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <a href="index.html" class="bg-blue-600 p-2 rounded-xl shadow-blue-500/40 shadow-lg shrink-0 hover:bg-blue-500 transition" title="返回主頁">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                    </svg>
                </a>
                <div class="min-w-0">
                    <h1 class="text-lg md:text-xl font-black tracking-wide truncate">⚛️ 分子動力論模型</h1>
                    <p class="text-slate-400 text-xs font-medium tracking-wider">SHSS Physics Lab</p>
                </div>
            </div>
            <a href="index.html" class="text-sm font-bold text-blue-300 hover:text-white whitespace-nowrap">← 返回主頁</a>
        </div>
    </header>
    <main class="flex-grow p-4 md:p-8 max-w-6xl mx-auto w-full">
        <div class="bg-blue-50 border border-blue-100 rounded-2xl p-4 mb-6">
            <p class="text-sm font-bold text-blue-800 mb-1">🎯 學習目標</p>
            <p class="text-sm text-slate-600">觀察密閉盒內粒子速率、碰撞頻率與壓強的定性關係；溫度↑ → 平均速率↑ → 壓強↑。</p>
        </div>

        <div class="grid lg:grid-cols-5 gap-6">
            <div class="lg:col-span-2 space-y-4">
                <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
                    <h2 class="font-bold text-slate-700">控制</h2>
                    <label class="block text-sm"><span class="font-medium text-slate-600">相對溫度：<b id="tempv">1.0</b></span>
                        <input id="temp" type="range" min="0.3" max="3" step="0.1" value="1" class="w-full accent-cyan-600 mt-1"></label>
                    <label class="block text-sm"><span class="font-medium text-slate-600">粒子數 N：<b id="nv">40</b></span>
                        <input id="n" type="range" min="10" max="80" step="5" value="40" class="w-full accent-cyan-600 mt-1"></label>
                    <div class="rounded-xl bg-cyan-50 border border-cyan-100 p-3 text-sm space-y-1">
                        <p>撞擊計數（近 2 秒）：<b id="hits">0</b></p>
                        <p>相對壓強指標：<b id="Pind">—</b></p>
                        <p class="text-xs text-slate-500">P ∝ N × ⟨v²⟩（定性演示）</p>
                    </div>
                </div>
            </div>
            <div class="lg:col-span-3 bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
                <canvas id="cv" width="560" height="400" class="w-full h-auto rounded-xl bg-slate-900"></canvas>
            </div>
        </div>

    </main>
    <footer class="bg-slate-900 text-slate-400 py-6 mt-10 border-t border-slate-800">
        <div class="max-w-6xl mx-auto px-6 text-center text-sm">
            &copy; 2026 SHSS物理虛擬實驗室 · 原創課堂互動教材
        </div>
    </footer>
<script>

(function(){
  const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  const temp=document.getElementById('temp'),nEl=document.getElementById('n');
  let particles=[], hits=[], last=performance.now();
  function spawn(){
    const N=+nEl.value; particles=[];
    for(let i=0;i<N;i++){
      const sp=1.5*(+temp.value);
      const ang=Math.random()*Math.PI*2;
      particles.push({x:40+Math.random()*480,y:40+Math.random()*320,vx:Math.cos(ang)*sp*(0.5+Math.random()),vy:Math.sin(ang)*sp*(0.5+Math.random())});
    }
  }
  function step(dt){
    let wallHits=0;
    const W=560,H=400,r=4;
    particles.forEach(p=>{
      p.x+=p.vx*dt*60; p.y+=p.vy*dt*60;
      if(p.x<r){p.x=r;p.vx=Math.abs(p.vx);wallHits++;}
      if(p.x>W-r){p.x=W-r;p.vx=-Math.abs(p.vx);wallHits++;}
      if(p.y<r){p.y=r;p.vy=Math.abs(p.vy);wallHits++;}
      if(p.y>H-r){p.y=H-r;p.vy=-Math.abs(p.vy);wallHits++;}
    });
    const now=performance.now(); hits.push({t:now,n:wallHits});
    hits=hits.filter(h=>now-h.t<2000);
  }
  function draw(){
    ctx.fillStyle='#0f172a';ctx.fillRect(0,0,560,400);
    ctx.strokeStyle='#334155';ctx.strokeRect(1,1,558,398);
    particles.forEach(p=>{
      ctx.beginPath();ctx.arc(p.x,p.y,4,0,6.28);
      ctx.fillStyle='#38bdf8';ctx.fill();
    });
  }
  function loop(ts){
    const dt=Math.min(0.05,(ts-last)/1000); last=ts;
    step(dt); draw();
    const total=hits.reduce((a,h)=>a+h.n,0);
    document.getElementById('hits').textContent=total;
    const meanV2=particles.reduce((a,p)=>a+p.vx*p.vx+p.vy*p.vy,0)/(particles.length||1);
    document.getElementById('Pind').textContent=(particles.length*meanV2).toFixed(0);
    document.getElementById('tempv').textContent=(+temp.value).toFixed(1);
    document.getElementById('nv').textContent=nEl.value;
    requestAnimationFrame(loop);
  }
  temp.addEventListener('input',()=>{particles.forEach(p=>{const s=Math.hypot(p.vx,p.vy)||1; const ns=1.5*(+temp.value)*(0.7+Math.random()*0.6); p.vx*=ns/s; p.vy*=ns/s;});});
  nEl.addEventListener('input',spawn);
  spawn(); requestAnimationFrame(loop);
})();

</script>
</body>
</html>
