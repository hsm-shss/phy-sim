<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物理虛擬實驗室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f0f9ff; font-family: sans-serif; }
        .card { transition: transform 0.2s, box-shadow 0.2s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 頁首 Header -->
    <header class="bg-slate-900 text-white p-6 shadow-md">
        <div class="max-w-5xl mx-auto flex items-center gap-3">
            <div class="bg-blue-500 p-2 rounded-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                </svg>
            </div>
            <div>
                <h1 class="text-2xl font-bold tracking-wide">物理虛擬實驗室</h1>
                <p class="text-slate-400 text-sm">Physics Simulation Hub</p>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-grow p-6 md:p-10 max-w-5xl mx-auto w-full">
        
        <h2 class="text-xl font-bold text-slate-700 mb-6 border-l-4 border-blue-500 pl-3">選擇實驗項目</h2>

        <!-- 實驗卡片網格 -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

            <!-- 實驗 1：過濾模擬器 -->
            <!-- href="filter.html" 對應你剛剛改名的檔案 -->
            <a href="filter.html" class="card bg-white rounded-2xl p-6 border border-slate-200 block text-slate-800 hover:border-blue-400 cursor-pointer no-underline group">
                <div class="flex items-center justify-between mb-4">
                    <span class="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-1 rounded">環境科學</span>
                    <span class="text-slate-300 group-hover:text-blue-500">↗</span>
                </div>
                <h3 class="text-lg font-bold mb-2 group-hover:text-blue-600">雙間隔過濾模擬器</h3>
                <p class="text-slate-500 text-sm mb-4">模擬不同濾材（石、沙、棉）對水流速度與過濾成本的影響。</p>
                <div class="w-full bg-slate-100 h-32 rounded-lg flex items-center justify-center text-slate-300 text-4xl">
                    💧
                </div>
            </a>

            <!-- 實驗 2：範例 (你可以複製這個區塊來增加更多實驗) -->
            <a href="#" class="card bg-white rounded-2xl p-6 border border-slate-200 block text-slate-800 opacity-60 cursor-not-allowed">
                <div class="flex items-center justify-between mb-4">
                    <span class="bg-purple-100 text-purple-800 text-xs font-bold px-2 py-1 rounded">光學</span>
                    <span class="text-slate-300">🔒</span>
                </div>
                <h3 class="text-lg font-bold mb-2">凸透鏡成像 (開發中)</h3>
                <p class="text-slate-500 text-sm mb-4">拖動蠟燭位置，觀察實像與虛像的變化。</p>
                <div class="w-full bg-slate-100 h-32 rounded-lg flex items-center justify-center text-slate-300 text-4xl">
                    🕯️
                </div>
            </a>

            <!-- 實驗 3：範例 -->
            <a href="#" class="card bg-white rounded-2xl p-6 border border-slate-200 block text-slate-800 opacity-60 cursor-not-allowed">
                <div class="flex items-center justify-between mb-4">
                    <span class="bg-green-100 text-green-800 text-xs font-bold px-2 py-1 rounded">力學</span>
                    <span class="text-slate-300">🔒</span>
                </div>
                <h3 class="text-lg font-bold mb-2">拋體運動 (開發中)</h3>
                <p class="text-slate-500 text-sm mb-4">調整角度與初速，模擬砲彈飛行軌跡。</p>
                <div class="w-full bg-slate-100 h-32 rounded-lg flex items-center justify-center text-slate-300 text-4xl">
                    🚀
                </div>
            </a>

        </div>

    </main>

    <!-- 頁尾 -->
    <footer class="bg-slate-800 text-slate-400 py-6 text-center text-sm">
        <p>&copy; 2024 物理虛擬實驗室. All rights reserved.</p>
    </footer>

</body>
</html>
