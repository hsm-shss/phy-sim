<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔋 電池內阻 | SHSS物理虛擬實驗室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { background-color: #f0f9ff; font-family: 'Noto Sans TC', sans-serif; }
        
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">
    <header class="bg-slate-900 text-white p-4 md:p-5 shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <a href="index.html" class="bg-blue-600 p-2 rounded-xl shadow-blue-500/40 shadow-lg shrink-0 hover:bg-blue-500 transition" title="返回主頁">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                    </svg>
                </a>
                <div class="min-w-0">
                    <h1 class="text-lg md:text-xl font-black tracking-wide truncate">🔋 電池內阻</h1>
                    <p class="text-slate-400 text-xs font-medium tracking-wider">SHSS Physics Lab</p>
                </div>
            </div>
            <a href="index.html" class="text-sm font-bold text-blue-300 hover:text-white whitespace-nowrap">← 返回主頁</a>
        </div>
    </header>
    <main class="flex-grow p-4 md:p-8 max-w-6xl mx-auto w-full">
        <div class="bg-blue-50 border border-blue-100 rounded-2xl p-4 mb-6">
            <p class="text-sm font-bold text-blue-800 mb-1">🎯 學習目標</p>
            <p class="text-sm text-slate-600">終端電壓 V = ε − Ir；調節負載 R 與內阻 r，觀察 V 與電流關係。</p>
        </div>

        <div class="grid lg:grid-cols-5 gap-6">
            <div class="lg:col-span-2 space-y-4">
                <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
                    <h2 class="font-bold text-slate-700">參數</h2>
                    <label class="block text-sm"><span class="font-medium text-slate-600">電動勢 ε：<b id="ev">12.0</b> V</span>
                        <input id="e" type="range" min="1" max="24" step="0.5" value="12" class="w-full accent-yellow-600 mt-1"></label>
                    <label class="block text-sm"><span class="font-medium text-slate-600">內阻 r：<b id="rv">2.0</b> Ω</span>
                        <input id="r" type="range" min="0.1" max="10" step="0.1" value="2" class="w-full accent-yellow-600 mt-1"></label>
                    <label class="block text-sm"><span class="font-medium text-slate-600">外電阻 R：<b id="Rv">10</b> Ω</span>
                        <input id="R" type="range" min="0.5" max="50" step="0.5" value="10" class="w-full accent-yellow-600 mt-1"></label>
                    <div class="rounded-xl bg-yellow-50 border border-yellow-100 p-3 text-sm space-y-1">
                        <p>I = ε/(R+r) = <b id="Iout">—</b> A</p>
                        <p>終端電壓 V = <b id="Vout">—</b> V</p>
                        <p class="text-xs text-slate-500">開路時 V→ε；短路時 V→0、I→ε/r</p>
                    </div>
                </div>
            </div>
            <div class="lg:col-span-3 bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
                <canvas id="cv" width="560" height="360" class="w-full h-auto rounded-xl bg-slate-50"></canvas>
            </div>
        </div>

    </main>
    <footer class="bg-slate-900 text-slate-400 py-6 mt-10 border-t border-slate-800">
        <div class="max-w-6xl mx-auto px-6 text-center text-sm">
            &copy; 2026 SHSS物理虛擬實驗室 · 原創課堂互動教材
        </div>
    </footer>
<script>

(function(){
  const eEl=document.getElementById('e'),rEl=document.getElementById('r'),REl=document.getElementById('R');
  const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  function draw(){
    const eps=+eEl.value,r=+rEl.value,R=+REl.value;
    document.getElementById('ev').textContent=eps.toFixed(1);
    document.getElementById('rv').textContent=r.toFixed(1);
    document.getElementById('Rv').textContent=R;
    const I=eps/(R+r), V=eps-I*r;
    document.getElementById('Iout').textContent=I.toFixed(3);
    document.getElementById('Vout').textContent=V.toFixed(2);
    ctx.clearRect(0,0,560,360);ctx.fillStyle='#f8fafc';ctx.fillRect(0,0,560,360);
    // V vs I line: V = eps - I r
    const L=60,RR=520,T=30,B=300;
    ctx.strokeStyle='#94a3b8';ctx.beginPath();ctx.moveTo(L,B);ctx.lineTo(RR,B);ctx.moveTo(L,T);ctx.lineTo(L,B);ctx.stroke();
    ctx.fillStyle='#64748b';ctx.font='12px sans-serif';ctx.fillText('I',RR-10,B+18);ctx.fillText('V',L-20,T+8);
    const Imax=eps/Math.max(r,0.1)*1.1;
    function px(i){return L+(RR-L)*(i/Imax);} function py(v){return B-(B-T)*(v/eps);}
    ctx.strokeStyle='#eab308';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px(0),py(eps));ctx.lineTo(px(eps/r),py(0));ctx.stroke();ctx.lineWidth=1;
    ctx.fillStyle='#dc2626';ctx.beginPath();ctx.arc(px(I),py(V),6,0,6.28);ctx.fill();
    ctx.fillStyle='#334155';ctx.fillText('工作點 (I,V)', px(I)+8, py(V)-8);
    ctx.fillText('截距 ε', L+8, py(eps)-6); ctx.fillText('短路電流 ε/r', px(eps/r)-40, B-8);
  }
  [eEl,rEl,REl].forEach(e=>e.addEventListener('input',draw)); draw();
})();

</script>
</body>
</html>
