<body class="min-h-screen flex flex-col text-slate-800">

<header class="bg-slate-900 text-white p-3 shadow-md sticky top-0 z-50">

    <div class="flex items-center gap-3 min-w-0">

      <button onclick="startRaid({minutes:5})" class="p-4 rounded-xl border-2 border-slate-200 hover:border-fuchsia-400 hover:bg-fuchsia-50 font-bold">5 分鐘</button>

<script>

/* ===== Shared multi-type drill engine (HKDSE Physics) ===== */
const C = {
  g: 9.81, c: 3e8, G: 6.67e-11, R: 8.31, NA: 6.02e23,
  epsilon0: 8.85e-12, mu0: 4e-7 * Math.PI,
  ice_lf: 3.34e5, water_lv: 2.26e6, I0: 1e-12
};

const TOPIC_META = {
  heat:     { zh: '熱學', en: 'Heat' },
  mechanics:{ zh: '力學', en: 'Mech' },
  waves:    { zh: '波動', en: 'Waves' },
  em:       { zh: '電磁', en: 'E&M' },
  atomic:   { zh: '原子', en: 'Atomic' },
  medical:  { zh: '醫學', en: 'Med' },
  energy:   { zh: '能源', en: 'Energy' }
};

const TYPE_META = {
  pick_formula: { zh: '選公式', en: 'Pick formula', color: 'violet' },
  solve_variable: { zh: '解未知數', en: 'Solve unknown', color: 'sky' },
  unit_check: { zh: '單位', en: 'Units', color: 'amber' },
  concept: { zh: '概念', en: 'Concept', color: 'emerald' },
  calc: { zh: '計算', en: 'Calc', color: 'blue' }
};

function rand(min, max, dec) {
  return parseFloat((Math.random() * (max - min) + min).toFixed(dec));
}
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function fmt(n) {
  if (n === 0) return '0';
  const abs = Math.abs(n);
  if (abs >= 1e4 || abs < 1e-2) {
    const exp = Math.floor(Math.log10(abs));
    const mant = n / Math.pow(10, exp);
    return mant.toPrecision(3).replace(/\.?0+$/, '') + '×10<sup>' + exp + '</sup>';
  }
  if (Number.isInteger(n)) return String(n);
  return parseFloat(n.toPrecision(4)).toString();
}
function nearlyEqual(a, b, tol) {
  tol = tol == null ? 0.015 : tol;
  if (!isFinite(a) || !isFinite(b)) return false;
  if (Math.abs(b) < 1e-12) return Math.abs(a) < 1e-9;
  if (Number.isInteger(b) && Math.abs(b) < 1e6) return Math.abs(a - b) < 0.5;
  return Math.abs(a - b) / Math.abs(b) <= tol;
}
function parseCalcInput(s) {
  if (!s || !String(s).trim()) return NaN;
  let t = String(s).trim().replace(/×/g, '*').replace(/\s+/g, '');
  // scientific: 3.2EXP-5 or 3.2e-5
  t = t.replace(/EXP/gi, 'e');
  if (!/^-?\d*\.?\d+(e[+-]?\d+)?$/i.test(t) && !/^-?\d+(\.\d+)?$/.test(t)) {
    // allow simple 1.5e-3 style only
    if (!/^-?\d*\.?\d+e[+-]?\d+$/i.test(t)) return NaN;
  }
  return parseFloat(t);
}

/** Formula catalog: declarative + generators for solve/calc */
const FORMULAS = [
  // ---- HEAT ----
  {
    id:'h1', topic:'heat', label:'比熱容量', html:'Q = mc&Delta;T',
    symbols:{ 'Q':'熱量 (J)', 'm':'質量 (kg)', 'c':'比熱容量 (J kg⁻¹ °C⁻¹)', '&Delta;T':'溫差 (°C)' },
    situation:'加熱質量為 m 的物體，比熱容量為 c，溫度上升 &Delta;T，求所需熱量 Q。',
    distractors:['Q = C&Delta;T','Q = ml<sub>f</sub>','P = mc&Delta;T','Q = Pt'],
    concepts:[
      { q:'同一質量水，溫升加倍，所需熱量如何變？', options:['加倍','減半','不變','變四倍'], answer:0, explain:'Q = mcΔT，ΔT 加倍則 Q 加倍。' },
      { q:'比熱容量 c 較大的物質，加熱同樣溫升時需要的能量？', options:['較多','較少','相同','與質量無關'], answer:0, explain:'c 大表示升溫需更多能量。' }
    ],
    unitQs:[
      { q:'Q = mcΔT 中，Q 的 SI 單位是？', options:['J','W','N','Pa'], answer:0, explain:'熱量／能量單位是焦耳 J。' },
      { q:'比熱容量 c 的單位是？', options:['J kg⁻¹ °C⁻¹','J °C⁻¹','W kg⁻¹','J s⁻¹'], answer:0, explain:'c = Q/(mΔT)，單位 J kg⁻¹ °C⁻¹。' }
    ],
    gen(){
      const m=rand(0.5,5,1), dt=rand(10,40,0), c=4200, Q=m*c*dt;
      return {
        values:{ Q, m, c, 'ΔT':dt },
        units:{ Q:'J', m:'kg', c:'J kg⁻¹ °C⁻¹', 'ΔT':'°C' },
        names:{ Q:'熱量', m:'質量', c:'比熱容量', 'ΔT':'溫差' },
        askable:['Q','m','ΔT'],
        hint:'c = 4200 J kg⁻¹ °C⁻¹（水）',
        explainAsk(k){
          if(k==='Q') return '用 Q = mcΔT 直接代入。';
          if(k==='m') return '由 Q = mcΔT 得 m = Q/(cΔT)。';
          return '由 Q = mcΔT 得 ΔT = Q/(mc)。';
        }
      };
    }
  },
  {
    id:'h2', topic:'heat', label:'熱容量', html:'Q = C&Delta;T',
    symbols:{ 'Q':'熱量 (J)', 'C':'熱容量 (J °C⁻¹)', '&Delta;T':'溫差 (°C)' },
    situation:'某物體熱容量為 C，溫度改變 &Delta;T，求吸熱／放熱量 Q。',
    distractors:['Q = mc&Delta;T','Q = ml<sub>v</sub>','C = Q/m','P = IV'],
    concepts:[
      { q:'熱容量 C 與比熱容量 c 的關係是？', options:['C = mc','C = c/m','C = Q/m','無關'], answer:0, explain:'熱容量 C = mc。' }
    ],
    unitQs:[
      { q:'熱容量 C 的單位是？', options:['J °C⁻¹','J kg⁻¹ °C⁻¹','W','J'], answer:0, explain:'C = Q/ΔT，單位 J °C⁻¹。' }
    ],
    gen(){
      const Cap=rand(200,800,0), dt=rand(5,20,0), Q=Cap*dt;
      return {
        values:{ Q, C:Cap, 'ΔT':dt },
        units:{ Q:'J', C:'J °C⁻¹', 'ΔT':'°C' },
        names:{ Q:'熱量', C:'熱容量', 'ΔT':'溫差' },
        askable:['Q','C','ΔT'],
        explainAsk(k){ return k==='Q'?'Q = CΔT。':(k==='C'?'C = Q/ΔT。':'ΔT = Q/C。'); }
      };
    }
  },
  {
    id:'h3', topic:'heat', label:'熔解潛熱', html:'Q = ml<sub>f</sub>',
    symbols:{ 'Q':'熱量 (J)', 'm':'質量 (kg)', 'l<sub>f</sub>':'熔解比潛熱 (J kg⁻¹)' },
    situation:'質量 m 的冰在 0°C 完全熔成水，求所需潛熱。',
    distractors:['Q = mc&Delta;T','Q = ml<sub>v</sub>','Q = C&Delta;T','P = Fv'],
    concepts:[
      { q:'冰熔解時溫度如何變化？', options:['保持 0°C','上升','下降','先升後降'], answer:0, explain:'相變時溫度不變，能量用於破壞鍵。' }
    ],
    unitQs:[
      { q:'比潛熱 l<sub>f</sub> 的單位是？', options:['J kg⁻¹','J','J °C⁻¹','W kg⁻¹'], answer:0, explain:'l = Q/m，單位 J kg⁻¹。' }
    ],
    gen(){
      const m=rand(0.1,1,2), lf=C.ice_lf, Q=m*lf;
      return {
        values:{ Q, m, 'l_f':lf },
        units:{ Q:'J', m:'kg', 'l_f':'J kg⁻¹' },
        names:{ Q:'熱量', m:'質量', 'l_f':'熔解比潛熱' },
        askable:['Q','m'],
        hint:'l<sub>f</sub>（冰）= 3.34×10<sup>5</sup> J kg⁻¹',
        explainAsk(k){ return k==='Q'?'Q = ml<sub>f</sub>。':'m = Q/l<sub>f</sub>。'; }
      };
    }
  },
  {
    id:'h5', topic:'heat', label:'理想氣體定律', html:'pV = nRT',
    symbols:{ 'p':'壓強 (Pa)', 'V':'體積 (m³)', 'n':'摩爾數 (mol)', 'T':'溫度 (K)', 'R':'氣體常數' },
    situation:'一定量理想氣體，已知壓強、體積、摩爾數，求絕對溫度。',
    distractors:['pV = ⅓Nmc̄²','PV<sup>γ</sup> = const','Q = nCΔT','F = pa'],
    concepts:[
      { q:'理想氣體絕對溫度加倍、體積不變，壓強如何？', options:['加倍','減半','不變','變四倍'], answer:0, explain:'p ∝ T（V、n 固定）。' }
    ],
    unitQs:[
      { q:'pV = nRT 中，p 的 SI 單位是？', options:['Pa','atm','N','J'], answer:0, explain:'壓強 SI 單位是帕斯卡 Pa = N m⁻²。' }
    ],
    gen(){
      const n=rand(1,3,1), T=rand(300,400,0), V=rand(0.02,0.05,3), p=(n*C.R*T)/V;
      return {
        values:{ p, V, n, T },
        units:{ p:'Pa', V:'m³', n:'mol', T:'K' },
        names:{ p:'壓強', V:'體積', n:'摩爾數', T:'溫度' },
        askable:['p','V','n','T'],
        explainAsk(){ return '用 pV = nRT 解出目標未知數。'; }
      };
    }
  },
  // ---- MECHANICS ----
  {
    id:'m1', topic:'mechanics', label:'勻加速 v=u+at', html:'v = u + at',
    symbols:{ 'v':'末速 (m s⁻¹)', 'u':'初速 (m s⁻¹)', 'a':'加速度 (m s⁻²)', 't':'時間 (s)' },
    situation:'物體以初速 u、恆定加速度 a 運動時間 t，求末速 v。',
    distractors:['v² = u² + 2as','s = ut + ½at²','F = ma','p = mv'],
    concepts:[
      { q:'加速度方向與速度相反時，速率通常會？', options:['減小','增大','不變','無法判斷'], answer:0, explain:'減速運動：a 與 v 反向。' }
    ],
    unitQs:[
      { q:'加速度 a 的 SI 單位是？', options:['m s⁻²','m s⁻¹','N','J'], answer:0, explain:'a = Δv/Δt → m s⁻²。' }
    ],
    gen(){
      const u=rand(0,10,0), a=rand(2,5,0), t=rand(2,6,0), v=u+a*t;
      return {
        values:{ v, u, a, t },
        units:{ v:'m s⁻¹', u:'m s⁻¹', a:'m s⁻²', t:'s' },
        names:{ v:'末速', u:'初速', a:'加速度', t:'時間' },
        askable:['v','u','a','t'],
        explainAsk(k){
          const map={v:'v = u + at',u:'u = v − at',a:'a = (v−u)/t',t:'t = (v−u)/a'};
          return map[k];
        }
      };
    }
  },
  {
    id:'m5', topic:'mechanics', label:'牛頓第二定律', html:'F = ma',
    symbols:{ 'F':'淨力 (N)', 'm':'質量 (kg)', 'a':'加速度 (m s⁻²)' },
    situation:'質量 m 的物體受淨力 F，求加速度。',
    distractors:['F = mv','F = Δp/Δt','W = Fs','P = Fv'],
    concepts:[
      { q:'同一淨力作用下，質量加倍，加速度？', options:['減半','加倍','不變','變四倍'], answer:0, explain:'a = F/m，m 加倍則 a 減半。' },
      { q:'牛頓第二定律中的 F 是指？', options:['淨力／合力','任何單一力','摩擦力','重力'], answer:0, explain:'F 代表作用於物體的淨力。' }
    ],
    unitQs:[
      { q:'力的 SI 單位牛頓 (N) 等於？', options:['kg m s⁻²','kg m s⁻¹','J s','W'], answer:0, explain:'1 N = 1 kg m s⁻²。' }
    ],
    gen(){
      const m=rand(2,20,0), a=rand(1,5,1), F=m*a;
      return {
        values:{ F, m, a },
        units:{ F:'N', m:'kg', a:'m s⁻²' },
        names:{ F:'淨力', m:'質量', a:'加速度' },
        askable:['F','m','a'],
        explainAsk(k){ return k==='F'?'F = ma':(k==='m'?'m = F/a':'a = F/m'); }
      };
    }
  },
  {
    id:'m6', topic:'mechanics', label:'動量', html:'p = mv',
    symbols:{ 'p':'動量 (kg m s⁻¹)', 'm':'質量 (kg)', 'v':'速度 (m s⁻¹)' },
    situation:'質量 m、速率 v 的物體，求動量大小。',
    distractors:['p = ½mv²','F = ma','I = FΔt','E<sub>k</sub> = p²/2m'],
    concepts:[
      { q:'動量是矢量還是標量？', options:['矢量','標量','兩者皆可','無意義'], answer:0, explain:'動量 p = mv，方向與速度相同。' }
    ],
    unitQs:[
      { q:'動量單位 kg m s⁻¹ 亦等同？', options:['N s','N','J','W'], answer:0, explain:'衝量 = 動量變，單位 N s = kg m s⁻¹。' }
    ],
    gen(){
      const m=rand(1,10,0), v=rand(2,20,0), p=m*v;
      return {
        values:{ p, m, v },
        units:{ p:'kg m s⁻¹', m:'kg', v:'m s⁻¹' },
        names:{ p:'動量', m:'質量', v:'速度' },
        askable:['p','m','v'],
        explainAsk(k){ return k==='p'?'p = mv':(k==='m'?'m = p/v':'v = p/m'); }
      };
    }
  },
  {
    id:'m10', topic:'mechanics', label:'動能', html:'E<sub>k</sub> = ½mv<sup>2</sup>',
    symbols:{ 'E<sub>k</sub>':'動能 (J)', 'm':'質量 (kg)', 'v':'速率 (m s⁻¹)' },
    situation:'質量 m 以速率 v 運動，求動能。',
    distractors:['E<sub>p</sub> = mgh','p = mv','W = Fs','P = Fv'],
    concepts:[
      { q:'速率加倍，動能變成？', options:['4 倍','2 倍','½','不變'], answer:0, explain:'E<sub>k</sub> ∝ v²。' }
    ],
    unitQs:[
      { q:'動能的 SI 單位是？', options:['J','N','W','kg m s⁻¹'], answer:0, explain:'能量單位是焦耳 J。' }
    ],
    gen(){
      const m=rand(1,5,0), v=rand(4,20,0), Ek=0.5*m*v*v;
      return {
        values:{ 'E_k':Ek, m, v },
        units:{ 'E_k':'J', m:'kg', v:'m s⁻¹' },
        names:{ 'E_k':'動能', m:'質量', v:'速率' },
        askable:['E_k','m','v'],
        explainAsk(k){

function formulasByTopic(topic) {
  return FORMULAS.filter(f => f.topic === topic);
}
function allTopics() { return Object.keys(TOPIC_META); }

function buildPickFormula(f) {
  const correct = f.html;
  const opts = shuffle([correct, ...shuffle(f.distractors).slice(0, 3)]);
  return {
    type: 'pick_formula',
    topic: f.topic,
    formulaId: f.id,
    prompt: '下列情境應選哪一條公式？',
    situation: f.situation,
    options: opts,
    answerIndex: opts.indexOf(correct),
    explain: '正確公式：' + f.label + ' → ' + f.html.replace(/<[^>]+>/g, '') + '。'
  };
}

function buildSolveOrCalc(f, asCalc) {
  const g = f.gen();
  const ask = pick(g.askable);
  const givenKeys = Object.keys(g.values).filter(k => k !== ask);
  let qHtml = givenKeys.map(k => {
    const nm = g.names[k] || k;
    const un = g.units[k] ? ' ' + g.units[k] : '';
    return nm + ' <i>' + k + '</i> = ' + fmt(g.values[k]) + un;
  }).join('，') + '。<br>求 <b>' + (g.names[ask] || ask) + '</b> <i>' + ask + '</i>。';
  if (g.hint) qHtml += '<br><span class="text-sm text-slate-500">(' + g.hint + ')</span>';
  const explain = (g.explainAsk && g.explainAsk(ask)) || ('代入 ' + f.html);
  return {
    type: asCalc ? 'calc' : 'solve_variable',
    topic: f.topic,
    formulaId: f.id,
    formulaHtml: f.html,
    formulaLabel: f.label,
    prompt: asCalc ? '計算題：求數值（注意單位）' : '解未知數：同一公式，未知數會改變',
    qHtml,
    numericAnswer: g.values[ask],
    unit: g.units[ask] || '',
    explain: explain + '　答案約 ' + fmt(g.values[ask]) + (g.units[ask] ? ' ' + g.units[ask] : '') + '。'
  };
}

function buildUnitCheck(f) {
  if (f.unitQs && f.unitQs.length) {
    const u = pick(f.unitQs);
    // 30% chance: compute then pick unit (numeric+unit)
    if (Math.random() < 0.35) {
      const g = f.gen();
      const ask = pick(g.askable);
      const correctUnit = g.units[ask] || '（無單位）';
      const pool = ['J','N','W','Pa','V','A','Ω','m s⁻¹','kg','s','Hz','T','Bq','m','°C','K','（無單位）','kg m s⁻¹','V m⁻¹','W m⁻² K⁻¹'];
      const wrongs = shuffle(pool.filter(x => x !== correctUnit)).slice(0, 3);
      const opts = shuffle([correctUnit, ...wrongs]);
      const givenKeys = Object.keys(g.values).filter(k => k !== ask);
      const qHtml = givenKeys.map(k => (g.names[k]||k) + ' = ' + fmt(g.values[k]) + (g.units[k]?' '+g.units[k]:'')).join('，')
        + '。求 <i>' + ask + '</i> 的<strong>正確 SI 單位</strong>。';
      return {
        type: 'unit_check',
        topic: f.topic,
        formulaId: f.id,
        prompt: '單位檢查',
        qHtml,
        options: opts,
        answerIndex: opts.indexOf(correctUnit),
        explain: '由 ' + f.label + '，' + (g.names[ask]||ask) + ' 單位為 ' + correctUnit + '。數值約 ' + fmt(g.values[ask]) + '。'
      };
    }
    const opts = u.options.slice();
    return {
      type: 'unit_check',
      topic: f.topic,
      formulaId: f.id,
      prompt: '單位／換算',
      qHtml: u.q,
      options: opts,
      answerIndex: u.answer,
      explain: u.explain
    };
  }
  // fallback
  return buildPickFormula(f);
}

function buildConcept(f) {
  if (f.concepts && f.concepts.length) {
    const c = pick(f.concepts);
    if (c.options) {
      return {
        type: 'concept',
        topic: f.topic,
        formulaId: f.id,
        prompt: '概念題',
        qHtml: c.q,
        options: c.options.slice(),
        answerIndex: c.answer,
        explain: c.explain
      };
    }
  }
  // generic T/F from situation
  const tfCorrect = Math.random() < 0.5;
  const statements = [
    { s: f.label + ' 可用於：' + f.situation.replace(/求.+$/, '相關計算。'), ok: true },
    { s: '使用 ' + f.label + ' 時，不必理會單位是否一致。', ok: false },
    { s: f.html.replace(/<[^>]+>/g,'') + ' 是 HKDSE 常見關係式之一。', ok: true }
  ];
  const st = pick(statements);
  const options = ['正確 True', '錯誤 False'];
  const answerIndex = st.ok ? 0 : 1;
  return {
    type: 'concept',
    topic: f.topic,
    formulaId: f.id,
    prompt: '判斷對錯',
    qHtml: st.s,
    options,
    answerIndex,
    explain: st.ok ? '敍述符合該公式的課堂用法。' : '物理公式必須配合正確單位與適用條件。'
  };
}

/** Weighted type pick for mixed raid: calc ~35% */
function pickType(allowed) {
  const types = allowed && allowed.length ? allowed.slice() : ['pick_formula','solve_variable','unit_check','concept','calc'];
  if (types.length === 1) return types[0];
  // weight map
  const weights = { pick_formula: 1, solve_variable: 1.2, unit_check: 1, concept: 1, calc: 0.9 };
  // In mixed, nudge calc to ~35% when all enabled
  if (types.includes('calc') && types.length >= 4) {
    weights.calc = 2.4;
    weights.solve_variable = 1.15;
    weights.pick_formula = 1.05;
  }
  let total = 0;
  const bag = types.map(t => { const w = weights[t] || 1; total += w; return { t, w }; });
  let r = Math.random() * total;
  for (const b of bag) { r -= b.w; if (r <= 0) return b.t; }
  return types[0];
}

function generateQuestion(opts) {
  opts = opts || {};
  const topics = opts.topics || allTopics();
  const types = opts.types || Object.keys(TYPE_META);
  const topic = pick(topics);
  let pool = formulasByTopic(topic);
  if (!pool.length) pool = FORMULAS;
  const f = pick(pool);
  const type = pickType(types);
  if (type === 'pick_formula') return buildPickFormula(f);
  if (type === 'solve_variable') return buildSolveOrCalc(f, false);
  if (type === 'unit_check') return buildUnitCheck(f);
  if (type === 'concept') return buildConcept(f);
  return buildSolveOrCalc(f, true);
}


let raid = null;
let currentQ = null;
let answered = false;
let calcBuffer = '';
let timerId = null;
let lastMode = { minutes: 5 };

function show(id) {
  ['startScreen','playScreen','endScreen'].forEach(x => {
    document.getElementById(x).classList.toggle('hidden', x !== id);
  });
  document.getElementById('hud').classList.toggle('hidden', id !== 'playScreen');
}

function startRaid(mode) {
  lastMode = mode;
  const types = ['pick_formula','solve_variable','unit_check','concept','calc'];
  raid = {
    mode,
    score: 0,
    combo: 0,
    asked: 0,
    correct: 0,
    stats: Object.fromEntries(types.map(t => [t, {ok:0,n:0}])),
    endsAt: mode.minutes ? Date.now() + mode.minutes * 60 * 1000 : null,
    sprintLeft: mode.sprint || null,
    alive: true
  };
  show('playScreen');
  updateHud();
  if (timerId) clearInterval(timerId);
  if (raid.endsAt) {
    timerId = setInterval(() => {
      if (Date.now() >= raid.endsAt) { endRaid(); return; }
      updateHud();
    }, 200);
  }
  nextRaidQuestion();
}

function updateHud() {
  if (!raid) return;
  document.getElementById('scoreVal').textContent = raid.score;
  document.getElementById('comboVal').textContent = raid.combo;
  if (raid.endsAt) {
    const s = Math.max(0, Math.ceil((raid.endsAt - Date.now())/1000));
    const m = Math.floor(s/60), r = s%60;
    document.getElementById('timeLeft').textContent = m + ':' + String(r).padStart(2,'0');
  } else {
    document.getElementById('timeLeft').textContent = 'Q ' + raid.asked + '/' + lastMode.sprint;
  }
  document.getElementById('accByType').innerHTML = Object.keys(TYPE_META).map(t => {
    const s = raid.stats[t];
    const pct = s.n ? Math.round(100*s.ok/s.n) : '—';
    return '<span class="bg-white border border-slate-200 px-2 py-1 rounded">'+TYPE_META[t].zh+' '+pct+(s.n?'%':'')+'</span>';
  }).join('');
}

function nextRaidQuestion() {
  if (!raid || !raid.alive) return;
  if (raid.sprintLeft != null && raid.asked >= lastMode.sprint) { endRaid(); return; }
  answered = false;
  calcBuffer = '';
  document.getElementById('nextBtn').classList.add('hidden');
  document.getElementById('feedback').className = 'rounded-lg border border-slate-100 bg-slate-50 p-3 text-sm min-h-[3rem] text-slate-500';
  document.getElementById('feedback').textContent = '';
  currentQ = generateQuestion({ types: ['pick_formula','solve_variable','unit_check','concept','calc'] });
  // lightly enforce calc ratio ~35%: if too many calc in recent — engine weights already handle
  raid.asked++;
  document.getElementById('qProgress').textContent = raid.sprintLeft != null
    ? ('第 ' + raid.asked + ' / ' + lastMode.sprint + ' 題')
    : ('第 ' + raid.asked + ' 題');
  renderRaidQ();
  updateHud();
}

function calcInput(ch) {
  if (answered) return;
  if (ch==='EXP') calcBuffer += 'e';
  else if (ch==='-' && (calcBuffer===''||/e$/i.test(calcBuffer))) calcBuffer += '-';
  else calcBuffer += ch;
  const el = document.getElementById('calcDisplay');
  if (el) el.value = calcBuffer;
}
function calcAction(a) {
  if (answered) return;
  if (a==='AC') calcBuffer='';
  if (a==='DEL') calcBuffer=calcBuffer.slice(0,-1);
  const el = document.getElementById('calcDisplay');
  if (el) el.value = calcBuffer;
}

function applyScore(ok) {
  raid.stats[currentQ.type].n++;
  if (ok) {
    raid.stats[currentQ.type].ok++;
    raid.correct++;
    raid.combo++;
    const bonus = Math.min(5, raid.combo);
    raid.score += 10 + bonus * 2 + (currentQ.type === 'calc' ? 2 : 0);
  } else {
    raid.combo = 0;
  }
  updateHud();
}

function showFb(ok) {
  answered = true;
  const fb = document.getElementById('feedback');
  fb.className = 'rounded-lg border p-3 text-sm min-h-[3rem] ' + (ok
    ? 'border-emerald-200 bg-emerald-50 text-emerald-800'
    : 'border-rose-200 bg-rose-50 text-rose-800');
  let extra = '';
  if (!ok && currentQ.numericAnswer != null) {
    extra = '<br>正確約 <b>' + fmt(currentQ.numericAnswer) + '</b>' + (currentQ.unit?' '+currentQ.unit:'');
  }
  if (!ok && currentQ.options) {
    extra = '<br>正確選項：<b>' + String.fromCharCode(65+currentQ.answerIndex) + '. ' + currentQ.options[currentQ.answerIndex] + '</b>';
  }
  fb.innerHTML = (ok?'✓ 正確！':'✗ 唔啱。') + ' ' + (currentQ.explain||'') + extra;
  document.getElementById('nextBtn').classList.remove('hidden');
}

function submitMC(i) {
  if (answered || !raid.alive) return;
  const ok = i === currentQ.answerIndex;
  document.querySelectorAll('.mc-btn').forEach((b,idx) => {
    b.disabled = true;
    if (idx === currentQ.answerIndex) b.classList.add('border-emerald-500','bg-emerald-50');
    else if (idx===i && !ok) b.classList.add('border-rose-400','bg-rose-50');
  });
  applyScore(ok);
  showFb(ok);
}

function submitCalc() {
  if (answered || !raid.alive) return;
  const ok = nearlyEqual(parseCalcInput(calcBuffer), currentQ.numericAnswer);
  applyScore(ok);
  showFb(ok);
}

function skipQuestion() {
  if (!raid.alive) return;
  if (!answered) {
    raid.stats[currentQ.type].n++;
    raid.combo = 0;
  }
  afterFeedbackNext();
}

function afterFeedbackNext() {
  if (!raid.alive) return;
  if (raid.endsAt && Date.now() >= raid.endsAt) { endRaid(); return; }
  if (raid.sprintLeft != null && raid.asked >= lastMode.sprint) { endRaid(); return; }
  nextRaidQuestion();
}

function endRaid() {
  if (!raid) return;
  raid.alive = false;
  if (timerId) { clearInterval(timerId); timerId = null; }
  document.getElementById('finalScore').textContent = raid.score;
  let weak = null, weakRate = 2;
  Object.keys(TYPE_META).forEach(t => {
    const s = raid.stats[t];
    if (s.n >= 1) {
      const r = s.ok / s.n;
      if (r < weakRate) { weakRate = r; weak = t; }
    }
  });
  document.getElementById('weakType').textContent = weak
    ? ('最弱題型：' + TYPE_META[weak].zh + '（正確率 ' + Math.round(weakRate*100) + '%）——建議返課題操練專練呢類。')
    : '題目太少，未能判斷弱項。';
  document.getElementById('endBreakdown').innerHTML = Object.keys(TYPE_META).map(t => {
    const s = raid.stats[t];
    return '<span class="bg-slate-100 px-3 py-1 rounded-full">'+TYPE_META[t].zh+': '+s.ok+'/'+s.n+'</span>';
  }).join('');
  show('endScreen');
}

function retrySame() { startRaid(lastMode); }
function backToStart() {
  if (timerId) clearInterval(timerId);
  raid = null;
  show('startScreen');
}

show('startScreen');


</script>
