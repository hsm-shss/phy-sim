<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKDSE 物理終極混合挑戰 (Mixed Challenge)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .blur-reveal { filter: blur(10px); user-select: none; transition: all 0.3s ease; transform: scale(0.95); opacity: 0.6; }
        .blur-reveal.revealed { filter: blur(0); user-select: auto; transform: scale(1); opacity: 1; }
        
        /* HTML Superscript Styling */
        sup { font-size: 0.75em; vertical-align: super; line-height: 0; }

        /* MC Button Styles */
        .mc-btn {
            width: 100%; padding: 1rem; border-radius: 0.5rem; font-weight: bold; text-align: left;
            background-color: #1e293b; border: 1px solid #334155; color: #e2e8f0; transition: all 0.2s;
        }
        .mc-btn:hover:not(:disabled) { background-color: #334155; border-color: #6366f1; }
        .mc-btn:disabled { cursor: not-allowed; opacity: 0.7; }
        .mc-btn.correct { background-color: #059669 !important; border-color: #10b981 !important; color: white; }
        .mc-btn.wrong { background-color: #dc2626 !important; border-color: #ef4444 !important; color: white; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Start Screen Modal -->
    <div id="startScreen" class="fixed inset-0 bg-slate-900 z-[60] flex flex-col items-center justify-center p-4 transition-opacity duration-300">
        <div class="max-w-md w-full bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-2xl text-center">
            <div class="mb-6">
                <div class="bg-indigo-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-500/30">
                    <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                </div>
                <h1 class="text-3xl font-bold text-white mb-2">HKDSE 物理挑戰</h1>
                <p class="text-slate-400 text-sm">Physics Mixed Challenge</p>
            </div>

            <div class="space-y-4">
                <div class="text-left">
                    <label class="block text-slate-500 text-xs font-bold uppercase mb-2 ml-1">玩家名稱 Player Name</label>
                    <input type="text" id="playerNameInput" class="w-full p-4 bg-slate-900 border border-slate-600 rounded-xl text-white font-bold focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition placeholder-slate-600" placeholder="輸入你的名字..." onkeydown="if(event.key==='Enter') startGameSession()">
                </div>
                <button onclick="startGameSession()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-xl transition shadow-lg shadow-indigo-500/20 active:scale-95 transform">
                    開始挑戰 Start Game
                </button>
            </div>
            
            <div id="startError" class="text-red-400 text-sm mt-4 hidden font-bold">請輸入名稱！</div>
        </div>
    </div>

    <!-- Game Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 shadow-2xl">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3 w-full md:w-auto">
                <div class="bg-indigo-600 p-2 rounded-lg">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white tracking-wide">混合挑戰 <span class="text-indigo-400">Mixed Mode</span></h1>
                    <p class="text-xs text-slate-400" id="currentPlayerDisplay">Player: --</p>
                </div>
            </div>
            
            <!-- Stats & Upload Button Area -->
            <div class="flex items-center gap-4 w-full md:w-auto justify-between md:justify-end">
                <!-- 上傳按鈕 -->
                <button onclick="window.uploadData()" class="bg-green-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-green-700 transition text-sm flex items-center gap-2 shadow-lg shadow-green-900/20">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                    上傳數據
                </button>

                <div class="flex gap-4">
                    <div class="text-center"><span class="text-xs text-slate-400 uppercase font-bold">Score</span><div id="scoreDisplay" class="text-2xl font-bold text-green-400 font-mono">0</div></div>
                    <div class="text-center"><span class="text-xs text-slate-400 uppercase font-bold">Lives</span><div id="livesDisplay" class="text-2xl font-bold text-red-500 tracking-widest">❤️❤️❤️</div></div>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow p-4 md:p-6 max-w-5xl mx-auto w-full flex flex-col gap-6">
        <!-- Topic & Formula Section -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-slate-800 rounded-xl p-6 border border-slate-700 flex flex-col justify-center items-center shadow-lg">
                <span class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Current Topic</span>
                <span id="topicBadge" class="bg-blue-900/50 text-blue-300 border border-blue-500/30 px-4 py-2 rounded-full font-bold text-sm md:text-base animate-pulse">LOADING...</span>
            </div>
            <div class="md:col-span-2 bg-slate-800 rounded-xl p-6 border border-slate-700 relative overflow-hidden group cursor-pointer shadow-lg hover:border-indigo-500/50 transition-colors" onclick="toggleFormula()">
                <div class="absolute top-2 right-2 z-10"><span class="bg-slate-700 text-slate-300 text-[10px] px-2 py-1 rounded font-bold uppercase tracking-wider">Tap to Reveal Formula</span></div>
                <div class="flex flex-col items-center justify-center min-h-[80px]">
                    <div id="latexContainer" class="blur-reveal transition-all duration-500"><div id="latexFormula" class="text-2xl md:text-3xl text-indigo-300 font-serif">$$ F = ma $$</div></div>
                    <div id="revealOverlay" class="absolute inset-0 flex items-center justify-center bg-slate-800/60 backdrop-blur-sm transition-opacity duration-300">
                        <div class="bg-indigo-600 rounded-full p-3 shadow-lg transform group-hover:scale-110 transition-transform"><svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 5 8.268 7.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Question & Interaction Section -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 flex-grow">
            <!-- Visuals -->
            <div class="bg-black/40 rounded-xl border border-slate-700 relative overflow-hidden min-h-[300px] flex items-center justify-center backdrop-blur-sm">
                <div id="visualContainer" class="w-full h-full absolute inset-0"></div>
                <div class="absolute bottom-4 left-4"><div id="simStatus" class="text-xs font-mono text-emerald-400 bg-emerald-900/30 px-2 py-1 rounded border border-emerald-500/20">System Ready</div></div>
            </div>
            
            <!-- Question Panel -->
            <div class="bg-slate-800 rounded-xl border border-slate-700 p-6 flex flex-col shadow-lg">
                <div class="flex-grow">
                    <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2"><span class="text-indigo-400">Q.</span> 題目 Challenge</h2>
                    <div id="qText" class="text-slate-300 text-lg mb-8 leading-relaxed min-h-[80px]">Initializing...</div>
                    
                    <!-- Numerical Input Mode -->
                    <div id="inputMode" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-400 mb-1.5 uppercase">答案 Input Answer (3 sig fig)</label>
                            <div class="flex shadow-sm">
                                <input type="number" id="userAns" class="flex-grow p-3 border border-slate-300 rounded-l-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono text-lg bg-slate-50 text-slate-900" placeholder="0.00" step="any" onkeydown="if(event.key==='Enter') checkAnswer()">
                                <span id="unitLabel" class="bg-slate-200 border border-l-0 border-slate-300 px-4 flex items-center justify-center rounded-r-lg text-slate-600 font-bold min-w-[3.5rem] text-sm">--</span>
                            </div>
                        </div>
                        <button onclick="checkAnswer()" id="checkBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-lg shadow-lg mt-6 transition">提交驗證 Submit</button>
                    </div>

                    <!-- Multiple Choice Mode -->
                    <div id="mcMode" class="hidden space-y-3 mt-2">
                        <label class="block text-xs font-bold text-slate-400 mb-1.5 uppercase">選擇正確單位 Select Unit</label>
                        <div id="mcContainer" class="grid grid-cols-1 gap-2">
                            <!-- Buttons generated by JS -->
                        </div>
                    </div>

                </div>
                <div class="mt-4">
                    <div id="feedback" class="text-center font-bold text-sm min-h-[20px] transition-all"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Game Over Modal -->
    <div id="gameOverModal" class="fixed inset-0 bg-black/90 z-[100] hidden flex flex-col items-center justify-center p-4 backdrop-blur-md">
        <div class="bg-slate-800 p-8 rounded-2xl border border-slate-600 max-w-md w-full text-center shadow-2xl overflow-y-auto max-h-[90vh]">
            <div class="text-6xl mb-4">💀</div>
            <h2 class="text-3xl font-bold text-white mb-2">Game Over</h2>
            <p class="text-slate-400 mb-2">本次得分 Score</p>
            <div id="finalScore" class="text-5xl font-bold text-indigo-400 font-mono mb-8">0</div>
            
            <button onclick="showStartScreen()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition shadow-lg">
                返回首頁 Play Again
            </button>
        </div>
    </div>

    <!-- Firebase Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  
        const firebaseConfig = {
           apiKey: "AIzaSyBEH9UZ7dfCb93kPxuncjWCTG3Qq6mJPFg",
           authDomain: "phy-sim.firebaseapp.com",
           projectId: "phy-sim",
           storageBucket: "phy-sim.firebasestorage.app",
           messagingSenderId: "802969131704",
           appId: "1:802969131704:web:97e8c6a3f0af0776d1b24d",
           measurementId: "G-RCWNRGR1CS"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
  
        // Expose upload function to window
        window.uploadData = async function() {
          const scoreEl = document.getElementById('scoreDisplay');
          const score = scoreEl ? scoreEl.innerText : "0";
          const livesEl = document.getElementById('livesDisplay');
          const flow = livesEl ? (livesEl.innerText.length / 2) : 0; 
          const playerNameInput = document.getElementById('playerNameInput');
          const playerName = playerNameInput ? playerNameInput.value : "Unknown";
  
          try {
            const docRef = await addDoc(collection(db, "experiments"), {
              score: Number(score),
              flowRate: Number(flow), 
              cost: 0,
              layers: 1,
              playerName: playerName, // 順便紀錄玩家名字
              timestamp: serverTimestamp()
            });
            alert("數據上傳成功！\nRecord ID: " + docRef.id);
          } catch (e) {
            console.error("Error adding document: ", e);
            alert("上傳失敗，請檢查網路或 Console (按 F12 查看)");
          }
        }
    </script>

    <!-- Game Logic -->
    <script>
        const CONSTANTS = { g: 9.81, c: 3.00e8, R: 8.31, NA: 6.02e23, k: 1.38e-23, G: 6.67e-11, me: 9.11e-31, e: 1.60e-19, epsilon0: 8.85e-12 };
        
        // Game State
        let gameState = {
            score: 0,
            lives: 3,
            playerName: "Player",
            isPlaying: false
        };

        const topicNames = {
            mechanics: "力學 Mechanics",
            waves: "波動 Waves",
            heat: "熱學 Heat",
            em: "電磁學 E&M",
            nuclear: "核物理 Nuclear",
            med: "醫學物理 Medical",
            eng: "能量工程 Energy"
        };

        function startGameSession() {
            const input = document.getElementById('playerNameInput');
            const name = input.value.trim();
            if(!name) { document.getElementById('startError').classList.remove('hidden'); return; }
            
            gameState.playerName = name;
            gameState.score = 0;
            gameState.lives = 3;
            gameState.isPlaying = true;

            document.getElementById('currentPlayerDisplay').innerText = `Player: ${gameState.playerName}`;
            document.getElementById('startScreen').classList.add('hidden');
            
            updateHUD();
            nextRound();
        }

        function showStartScreen() {
            document.getElementById('gameOverModal').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
        }

        function updateHUD() {
            document.getElementById('scoreDisplay').innerText = gameState.score;
            let hearts = "";
            for(let i=0; i<gameState.lives; i++) hearts += "❤️";
            document.getElementById('livesDisplay').innerText = hearts;
        }

        function gameOver() {
            gameState.isPlaying = false;
            document.getElementById('finalScore').innerText = gameState.score;
            document.getElementById('gameOverModal').classList.remove('hidden');
        }

        function rand(min, max, dec) { return parseFloat((Math.random()*(max-min)+min).toFixed(dec)); }
        
        // HTML-based Scientific Notation (No MathJax images in text)
        function fmt(n) { 
            let abs = Math.abs(n);
            if (abs === 0) return "0";
            if(abs < 0.01 || abs >= 1000) { 
                let [m, e] = n.toExponential(2).split('e'); 
                // Return HTML string with superscript
                return `${m} × 10<sup>${parseInt(e)}</sup>`; 
            } 
            return parseFloat(n.toFixed(3)).toString(); 
        }

        const unitDB = {
            mechanics: [
                {q: "位移 (Displacement)", a: "m"}, {q: "速度 (Velocity)", a: "m s⁻¹"}, {q: "加速度 (Acceleration)", a: "m s⁻²"},
                {q: "力 (Force)", a: "N"}, {q: "動量 (Momentum)", a: "kg m s⁻¹"}, {q: "動量變化 (Change in Momentum)", a: "N s"},
                {q: "功 (Work) / 能量 (Energy)", a: "J"}, {q: "功率 (Power)", a: "W"}, {q: "勁度常數 (Spring Constant)", a: "N m⁻¹"},
                {q: "重力場強度 (g)", a: "N kg⁻¹"}, {q: "力矩 (Moment)", a: "N m"}
            ],
            waves: [
                {q: "頻率 (Frequency)", a: "Hz"}, {q: "週期 (Period)", a: "s"}, {q: "波長 (Wavelength)", a: "m"},
                {q: "波速率 (Wave Speed)", a: "m s⁻¹"}, {q: "折射率 (Refractive Index)", a: "無單位 (No Unit)"},
                {q: "透鏡焦強 (Power of Lens)", a: "D"}
            ],
            heat: [
                {q: "溫度 (Temperature)", a: "K"}, {q: "熱容量 (Heat Capacity)", a: "J K⁻¹"},
                {q: "比熱容量 (Specific Heat Capacity)", a: "J kg⁻¹ K⁻¹"}, {q: "比潛熱 (Specific Latent Heat)", a: "J kg⁻¹"},
                {q: "氣體常數 (Gas Constant)", a: "J mol⁻¹ K⁻¹"}, {q: "壓強 (Pressure)", a: "Pa"}
            ],
            em: [
                {q: "電荷 (Charge)", a: "C"}, {q: "電流 (Current)", a: "A"}, {q: "電壓 / 電勢差 (Voltage)", a: "V"},
                {q: "電阻 (Resistance)", a: "Ω"}, {q: "電阻率 (Resistivity)", a: "Ω m"}, {q: "電功率 (Electric Power)", a: "W"},
                {q: "電場強度 (Electric Field)", a: "N C⁻¹"}, {q: "磁通量密度 (B-Field)", a: "T"},
                {q: "磁通量 (Magnetic Flux)", a: "Wb"}
            ],
            nuclear: [
                {q: "質量虧損 (Mass Defect)", a: "kg"}, {q: "結合能 (Binding Energy)", a: "J"},
                {q: "放射強度 (Activity)", a: "Bq"}, {q: "衰變常數 (Decay Constant)", a: "s⁻¹"},
                {q: "半衰期 (Half-life)", a: "s"}
            ],
            med: [
                {q: "聲強級 (Sound Intensity Level)", a: "dB"}, {q: "聲阻抗 (Acoustic Impedance)", a: "kg m⁻² s⁻¹"},
                {q: "線衰減係數 (Linear Attenuation)", a: "m⁻¹"}, {q: "等效劑量 (Equivalent Dose)", a: "Sv"}
            ],
            eng: [
                {q: "光通量 (Luminous Flux)", a: "lm"}, {q: "照明度 (Illuminance)", a: "lx"},
                {q: "熱傳導係數 U-值 (U-value)", a: "W m⁻² K⁻¹"}, {q: "太陽常數 (Solar Constant)", a: "W m⁻²"}
            ]
        };

        function getUnitQuiz(topic) {
            const list = unitDB[topic];
            if(!list || list.length === 0) return null;
            const target = list[Math.floor(Math.random() * list.length)];
            const others = list.filter(i => i.a !== target.a).map(i => i.a);
            const fallback = ["J", "W", "N", "Pa", "T", "m s⁻¹", "kg"];
            while (others.length < 3) {
                const f = fallback[Math.floor(Math.random() * fallback.length)];
                if (f !== target.a && !others.includes(f)) others.push(f);
            }
            const options = others.sort(() => 0.5 - Math.random()).slice(0, 3);
            options.push(target.a);
            options.sort(() => 0.5 - Math.random());
            return {
                q: `請選擇以下物理量的正確單位：<br><br><strong class="text-xl text-indigo-400">${target.q}</strong>`,
                options: options,
                answer: target.a
            };
        }

        const formulaDB = {
            mechanics: [
                {id:'unit_quiz', label:'🛡️ 單位挑戰 (Unit Challenge)', latex:'\\text{Unit Check}', visual:'unit_scale', type:'mc'},
                {id:'suvat_v', latex:'v = u + a t', visual:'mech_linear', gen:()=>{ 
                    const u=rand(0,10,0), a=rand(1,5,1), t=rand(2,10,0); const v = u + a*t;
                    const mode = Math.floor(Math.random()*3); 
                    if(mode===0) return {unit:'m s⁻¹', q:`一物體以初速度 ${fmt(u)} m s⁻¹ 及勻加速度 ${fmt(a)} m s⁻² 沿直線運動，歷時 ${fmt(t)} s。求末速度。`, a:v};
                    if(mode===1) return {unit:'m s⁻¹', q:`一物體以勻加速度 ${fmt(a)} m s⁻² 運動 ${fmt(t)} s 後，速度變為 ${fmt(v)} m s⁻¹。求其初速度。`, a:u};
                    if(mode===2) return {unit:'s', q:`一物體由初速度 ${fmt(u)} m s⁻¹ 以勻加速度 ${fmt(a)} m s⁻² 加速至 ${fmt(v)} m s⁻¹。求所需時間。`, a:t};
                }},
                {id:'newton2', latex:'F = m a', visual:'mech_linear', gen:()=>{ 
                    const m=rand(5,50,0), a=rand(2,10,1); const F = m*a;
                    const mode = Math.floor(Math.random()*3); 
                    if(mode===0) return {unit:'N', q:`一個質量為 ${fmt(m)} kg 的物體正以加速度 ${fmt(a)} m s⁻² 運動。求作用在物體上的淨力。`, a:F};
                    if(mode===1) return {unit:'kg', q:`一物體在 ${fmt(F)} N 的淨力作用下，產生 ${fmt(a)} m s⁻² 的加速度。求該物體的質量。`, a:m};
                    if(mode===2) return {unit:'m s⁻²', q:`一恆力 ${fmt(F)} N 作用於質量為 ${fmt(m)} kg 的物體上。求物體產生的加速度。`, a:a};
                }},
                {id:'momentum', latex:'p = m v', visual:'mech_linear', gen:()=>{ 
                    const m=rand(2,20,0), v=rand(5,20,0); const p = m*v;
                    const mode = Math.floor(Math.random()*2);
                    if(mode===0) return {unit:'kg m s⁻¹', q:`一物體質量為 ${fmt(m)} kg，速度為 ${fmt(v)} m s⁻¹。求該物體的動量。`, a:p};
                    if(mode===1) return {unit:'m s⁻¹', q:`一質量為 ${fmt(m)} kg 的物體擁有 ${fmt(p)} kg m s⁻¹ 的動量。求其速度。`, a:v};
                }},
                {id:'impulse', latex:'F \\Delta t = \\Delta p', unit:'N s', visual:'mech_linear', gen:()=>{ 
                    const f=rand(10,100,0), t=rand(0.2,2,1); const dp = f*t;
                    const mode = Math.floor(Math.random()*2);
                    if(mode===0) return {unit:'kg m s⁻¹', q:`一恆力 ${fmt(f)} N 作用於某物體 ${fmt(t)} s。求物體的動量變化。`, a:dp};
                    if(mode===1) return {unit:'N', q:`某物體在 ${fmt(t)} s 內的動量變化為 ${fmt(dp)} kg m s⁻¹。求作用在物體上的平均力。`, a:f};
                }},
                {id:'moment', latex:'M = F d \\sin\\theta', unit:'N m', visual:'mech_linear', gen:()=>{ 
                    const F=rand(10,50,0), d=rand(1,5,1); const M = F*d*0.5;

                    const mode = Math.floor(Math.random()*2);
                    if(mode===0) return {unit:'lx', q:`光通量 ${fmt(P)} lm，面積 ${fmt(A)} m²。求照明度。`, a:E};
                    if(mode===1) return {unit:'lm', q:`面積 ${fmt(A)} m²，照明度 ${fmt(E)} lx。求光通量。`, a:P};
                }},
                {id:'wind', label:'風力功率 (Wind Power)', latex:'P = \\frac{1}{2} \\rho A v^3', unit:'W', visual:'mech_linear', gen:()=>{ 
                    const rho=1.2, A=rand(10,50,0), v=rand(5,15,0); const P = 0.5*1.2*A*Math.pow(v,3);
                    const mode = Math.floor(Math.random()*2);
                    if(mode===0) return {unit:'W', q:`風速 ${fmt(v)} m s⁻¹，空氣密度 1.2 kg m⁻³，扇葉掃過面積 ${fmt(A)} m²。求最大風力功率。`, a:P};
                    if(mode===1) return {unit:'m²', q:`風速 ${fmt(v)} m s⁻¹，空氣密度 1.2 kg m⁻³，最大功率 ${fmt(P)} W。求扇葉掃過面積。`, a:A};
                }}
            ]
        };

        let curTopic='mechanics'; let curId=null; let curData={}; let isRevealed=false;

        function toggleFormula(force){ 
            const c=document.getElementById('latexContainer'), o=document.getElementById('revealOverlay'); 
            if(force!==undefined) isRevealed=force; else isRevealed=!isRevealed; 
            if(isRevealed){c.classList.add('revealed'); o.classList.add('opacity-0','pointer-events-none');}
            else{c.classList.remove('revealed'); o.classList.remove('opacity-0','pointer-events-none');} 
        }
        
        function nextRound() {
            // 1. Randomly select a topic
            const topics = Object.keys(formulaDB);
            curTopic = topics[Math.floor(Math.random() * topics.length)];
            
            // 2. Randomly select a question from that topic
            const questions = formulaDB[curTopic];
            const item = questions[Math.floor(Math.random() * questions.length)];
            curId = item.id;

            // 3. Reset UI
            isRevealed = false;
            toggleFormula(false);
            document.getElementById('feedback').innerHTML = '';
            document.getElementById('checkBtn').disabled = false;
            document.getElementById('topicBadge').innerText = topicNames[curTopic] || curTopic;

            // 4. Render Formula
            const l = document.getElementById('latexFormula'); 
            l.innerHTML = `$$ ${item.latex} $$`; 
            if(window.MathJax) MathJax.typesetPromise([l]); 

            // 5. Generate Question Data
            generateQuestion(item);
        }

        function generateQuestion(item){ 
            const inputMode = document.getElementById('inputMode');
            const mcMode = document.getElementById('mcMode');
            
            // Handle MC Type
            if (item.type === 'mc') {
                curData = getUnitQuiz(curTopic);
                inputMode.classList.add('hidden');
                mcMode.classList.remove('hidden');
                
                const mcContainer = document.getElementById('mcContainer');
                mcContainer.innerHTML = '';
                curData.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'mc-btn';
                    btn.innerHTML = opt;
                    btn.onclick = () => checkMCAnswer(opt, btn);
                    mcContainer.appendChild(btn);
                });
            } else {
                // Normal Numerical Type
                curData = item.gen();
                inputMode.classList.remove('hidden');
                mcMode.classList.add('hidden');
                
                // Dynamic Unit Update (using innerHTML for superscripts)
                document.getElementById('unitLabel').innerHTML = curData.unit || "--"; 
                document.getElementById('userAns').value = ''; 
            }

            const q=document.getElementById('qText'); 
            q.style.opacity=0; 
            setTimeout(()=>{ 
                q.innerHTML=curData.q; 
                if(window.MathJax) MathJax.typesetPromise([q]); 
                q.style.opacity=1; 
            },100); 
            
            renderVisual(item.visual);
        }

        function checkMCAnswer(selected, btnElement) {
            const correct = selected === curData.answer;
            const feedback = document.getElementById('feedback');
            const buttons = document.querySelectorAll('.mc-btn');
            
            buttons.forEach(b => {
                b.disabled = true;
                if(b.innerHTML === curData.answer) b.classList.add('correct');
            });

            if (correct) {
                feedback.innerHTML='<span class="text-green-600">✅ 正確！ Correct! (+10)</span>';
                gameState.score += 10;
                updateHUD();
                setTimeout(nextRound, 1500);
            } else {
                btnElement.classList.add('wrong');
                feedback.innerHTML=`<span class="text-red-500">❌ 錯誤。正確答案：${curData.answer}</span>`;
                gameState.lives--;
                updateHUD();
                if(gameState.lives <= 0) setTimeout(gameOver, 2000);
                else setTimeout(nextRound, 2500);
            }
        }

        function checkAnswer(){ 
            const v=parseFloat(document.getElementById('userAns').value); 
            if(isNaN(v)) return; 
            
            const tol=Math.abs(curData.a*0.01); 
            const correct=Math.abs(v-curData.a)<=tol || (Math.abs(curData.a)<1e-9 && Math.abs(v)<1e-9); 
            const fb=document.getElementById('feedback'); 
            
            document.getElementById('checkBtn').disabled=true;

            if(correct){ 
                gameState.score += 10;
                fb.innerHTML='<span class="text-green-600">✅ 正確！ Correct! (+10)</span>'; 
                updateHUD();
                setTimeout(nextRound, 1500);
            } else { 
                gameState.lives--;
                let ans=curData.a; 
                // Use fmt function for answer display too
                ans = fmt(ans);
                fb.innerHTML=`<span class="text-red-500">❌ 錯誤。答案 Answer: ${ans}</span>`; 
                updateHUD();
                if(gameState.lives <= 0) setTimeout(gameOver, 2000);
                else setTimeout(nextRound, 2500);
            } 
        }
        
        function renderVisual(t){ 
            if(t === 'unit_scale') {
                document.getElementById('visualContainer').innerHTML = `<svg class="w-full h-full" viewBox="0 0 400 300"><path d="M200,250 L200,50 M100,50 L300,50 M100,50 L100,150 M300,50 L300,150" stroke="#64748b" stroke-width="4" fill="none"/><rect x="70" y="150" width="60" height="40" fill="#6366f1"/><rect x="270" y="150" width="60" height="40" fill="#6366f1"/><text x="200" y="280" text-anchor="middle" fill="#64748b" font-weight="bold">Unit Balance</text></svg>`;
                return;
            }
            document.getElementById('visualContainer').innerHTML=`<svg class="w-full h-full"><text x="50%" y="50%" text-anchor="middle" fill="#aaa">Visual: ${t}</text></svg>`; 
        }
    </script>
</body>
</html>
