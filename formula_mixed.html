<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HKDSE Physics Ultimate Mixed Challenge (Calc Mode)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Roboto+Mono:wght@500&display=swap');
        
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0f172a; color: #f1f5f9; touch-action: manipulation; }
        
        /* Physics Font Styles */
        .paper-font { font-family: 'Times New Roman', Times, serif; }
        .var { font-style: italic; }
        .sci-exp { font-size: 0.7em; vertical-align: super; line-height: 0; }

        /* Animations */
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .blur-reveal { filter: blur(8px); user-select: none; transition: all 0.4s ease; transform: scale(0.98); opacity: 0.5; }
        .blur-reveal.revealed { filter: blur(0); user-select: auto; transform: scale(1); opacity: 1; }

        /* Calculator Button Styles */
        .calc-btn {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: white;
            font-size: 1.25rem;
            font-weight: bold;
            border-radius: 0.75rem;
            padding: 1rem 0;
            transition: all 0.1s;
            box-shadow: 0 4px 0 #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
        .calc-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #0f172a;
        }
        .calc-btn-primary { background-color: #334155; }
        .calc-btn-action { background-color: #4f46e5; border-color: #4338ca; box-shadow: 0 4px 0 #312e81; }
        .calc-btn-action:active { box-shadow: 0 0 0 #312e81; }
        .calc-btn-danger { background-color: #991b1b; border-color: #7f1d1d; box-shadow: 0 4px 0 #450a0a; }
        .calc-btn-danger:active { box-shadow: 0 0 0 #450a0a; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden">

    <!-- Start Screen Modal -->
    <div id="startScreen" class="fixed inset-0 bg-slate-900 z-[60] flex flex-col items-center justify-center p-4 transition-opacity duration-300">
        <div class="max-w-md w-full bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-2xl text-center">
            <div class="mb-6">
                <div class="bg-indigo-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-500/30">
                    <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                </div>
                <h1 class="text-3xl font-bold text-white mb-2">HKDSE 物理計算機</h1>
                <p class="text-slate-400 text-sm">Calculator Mode</p>
            </div>

            <div class="space-y-4">
                <div class="text-left">
                    <label class="block text-slate-500 text-xs font-bold uppercase mb-2 ml-1">玩家名稱 Player Name</label>
                    <input type="text" id="playerNameInput" class="w-full p-4 bg-slate-900 border border-slate-600 rounded-xl text-white font-bold focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition placeholder-slate-600" placeholder="輸入你的名字..." onkeydown="if(event.key==='Enter') startGameSession()">
                </div>
                <button onclick="startGameSession()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-xl transition shadow-lg shadow-indigo-500/20 active:scale-95 transform">
                    開始挑戰 Start Game
                </button>
            </div>
            <div id="startError" class="text-red-400 text-sm mt-4 hidden font-bold">請輸入名稱！</div>
        </div>
    </div>

    <!-- Game Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-3 sticky top-0 z-50 shadow-lg">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-3 w-full md:w-auto">
                <div class="bg-indigo-600 p-1.5 rounded-lg">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-white tracking-wide">Physics Arena <span class="text-indigo-400 text-xs align-top">CALC</span></h1>
                    <p class="text-[10px] text-slate-400" id="currentPlayerDisplay">Player: --</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4 w-full md:w-auto justify-between md:justify-end">
                <button onclick="window.uploadData()" class="bg-emerald-600/20 text-emerald-400 border border-emerald-500/50 px-3 py-1.5 rounded-lg font-bold hover:bg-emerald-600 hover:text-white transition text-xs flex items-center gap-2">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                    Upload

                <div class="flex gap-4">
                    <div class="text-center"><span class="text-[10px] text-slate-500 uppercase font-bold">Score</span><div id="scoreDisplay" class="text-xl font-bold text-indigo-400 font-mono leading-none">0</div></div>
                    <div class="text-center"><span class="text-[10px] text-slate-500 uppercase font-bold">Lives</span><div id="livesDisplay" class="text-xl font-bold text-red-500 leading-none tracking-widest">❤️❤️❤️</div></div>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow p-2 md:p-6 max-w-5xl mx-auto w-full flex flex-col gap-4">
        
        <!-- Formula & Topic Display -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-slate-800 rounded-xl p-3 border border-slate-700 flex flex-col justify-center items-center shadow-lg relative overflow-hidden">
                <div class="absolute top-0 left-0 w-1 h-full bg-indigo-500"></div>
                <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">Current Topic</span>
                <span id="topicBadge" class="text-indigo-300 font-bold text-lg md:text-xl">LOADING...</span>
            </div>
            
            <div class="md:col-span-2 bg-slate-800 rounded-xl p-3 border border-slate-700 relative overflow-hidden group cursor-pointer shadow-lg hover:border-indigo-500/50 transition-colors" onclick="toggleFormula()">
                <div class="absolute top-2 right-2 z-10"><span class="bg-slate-700/80 text-slate-400 text-[10px] px-2 py-0.5 rounded uppercase tracking-wider">Tap to Reveal</span></div>
                <div class="flex flex-col items-center justify-center min-h-[60px]">
                    <div id="latexContainer" class="blur-reveal transition-all duration-500">
                        <div id="formulaDisplay" class="text-xl md:text-2xl text-slate-200 paper-font italic text-center"></div>
                    </div>
                    <div id="revealOverlay" class="absolute inset-0 flex items-center justify-center bg-slate-900/40 backdrop-blur-[2px] transition-opacity duration-300">

                            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 5 8.268 7.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Question Panel -->
        <div class="bg-slate-800 rounded-xl border border-slate-700 p-4 flex flex-col shadow-lg flex-grow relative overflow-hidden">
            
            <div class="flex-grow z-10 mb-4">
                <div class="flex items-center justify-center min-h-[100px] mb-4">
                    <div id="qText" class="text-lg md:text-xl leading-relaxed paper-font text-slate-200 text-center w-full fade-in">
                        Initializing...
                    </div>
                </div>

                <!-- Calculator Interface -->
                <div class="max-w-md mx-auto">
                    <!-- Display Screen -->
                    <div class="bg-slate-900 p-4 rounded-xl border border-slate-600 mb-4 shadow-inner relative">
                        <div class="text-xs text-slate-500 absolute top-2 left-3 font-bold uppercase">Input</div>
                        <div class="text-xs text-slate-500 absolute top-2 right-3 font-bold paper-font" id="unitLabel">--</div>
                        <div id="calcDisplay" class="text-right text-3xl font-mono text-emerald-400 mt-2 min-h-[2.5rem] overflow-x-auto whitespace-nowrap tracking-wider"></div>
                        <div class="h-0.5 w-full bg-slate-800 mt-1"></div>
                    </div>

                    <!-- Keypad -->
                    <div class="grid grid-cols-4 gap-2 md:gap-3">
                        <button onclick="calcInput('7')" class="calc-btn calc-btn-primary">7</button>
                        <button onclick="calcInput('8')" class="calc-btn calc-btn-primary">8</button>
                        <button onclick="calcInput('9')" class="calc-btn calc-btn-primary">9</button>
                        <button onclick="calcAction('DEL')" class="calc-btn calc-btn-danger text-base">⌫</button>

                        <button onclick="calcInput('4')" class="calc-btn calc-btn-primary">4</button>
                        <button onclick="calcInput('5')" class="calc-btn calc-btn-primary">5</button>
                        <button onclick="calcInput('6')" class="calc-btn calc-btn-primary">6</button>
                        <button onclick="calcAction('AC')" class="calc-btn calc-btn-danger text-base">AC</button>

                        <button onclick="calcInput('1')" class="calc-btn calc-btn-primary">1</button>
                        <button onclick="calcInput('2')" class="calc-btn calc-btn-primary">2</button>
                        <button onclick="calcInput('3')" class="calc-btn calc-btn-primary">3</button>
                        <button onclick="calcInput('e')" class="calc-btn font-mono text-indigo-300">EXP</button>

                        <button onclick="calcInput('-')" class="calc-btn font-mono">-</button>
                        <button onclick="calcInput('0')" class="calc-btn calc-btn-primary">0</button>
                        <button onclick="calcInput('.')" class="calc-btn font-mono">.</button>
                        <button onclick="checkAnswer()" id="checkBtn" class="calc-btn calc-btn-action bg-indigo-600 border-indigo-500">GO</button>
                    </div>
                </div>
            </div>

            <div class="z-10">
                <div id="feedback" class="text-center font-bold text-sm min-h-[20px] transition-all rounded-lg p-2"></div>
            </div>
        </div>
    </main>

    <!-- Game Over Modal -->
    <div id="gameOverModal" class="fixed inset-0 bg-black/90 z-[100] hidden flex flex-col items-center justify-center p-4 backdrop-blur-md">
        <div class="bg-slate-800 p-8 rounded-2xl border border-slate-600 max-w-md w-full text-center shadow-2xl">
            <div class="text-6xl mb-4 animate-bounce">💀</div>
            <h2 class="text-3xl font-bold text-white mb-2">Game Over</h2>
            <p class="text-slate-400 mb-6">本次得分 Final Score</p>
            <div id="finalScore" class="text-6xl font-bold text-indigo-400 font-mono mb-8 text-shadow">0</div>
            
            <button onclick="showStartScreen()" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl transition border border-slate-600">
                返回主頁 Main Menu
            </button>
        </div>
    </div>

    <!-- Firebase Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  
        const firebaseConfig = {
           apiKey: "AIzaSyBEH9UZ7dfCb93kPxuncjWCTG3Qq6mJPFg",
           authDomain: "phy-sim.firebaseapp.com",
           projectId: "phy-sim",
           storageBucket: "phy-sim.firebasestorage.app",
           messagingSenderId: "802969131704",
           appId: "1:802969131704:web:97e8c6a3f0af0776d1b24d",
           measurementId: "G-RCWNRGR1CS"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
  
        window.uploadData = async function() {
          const scoreEl = document.getElementById('scoreDisplay');
          const score = scoreEl ? scoreEl.innerText : "0";
          const playerNameInput = document.getElementById('playerNameInput');
          const playerName = (playerNameInput && playerNameInput.value) ? playerNameInput.value : "Unknown";
  
          try {
            const docRef = await addDoc(collection(db, "experiments"), {
              score: Number(score),
              gameMode: "mixed_calc_mode",
              playerName: playerName,
              timestamp: serverTimestamp()
            });
            alert("數據上傳成功！\nRecord ID: " + docRef.id);
          } catch (e) {
            console.error("Error adding document: ", e);
            alert("上傳失敗，請檢查網路。");
          }
        }
    </script>

    <script>
        // --- Constants & Helpers ---
        const C = { 
            g: 9.81, c: 3.00e8, R: 8.31, NA: 6.02e23, k: 1.38e-23, 
            G: 6.67e-11, me: 9.11e-31, e: 1.60e-19, epsilon0: 8.85e-12,
            mu0: 4 * Math.PI * 1e-7, water_c: 4200, ice_lf: 3.34e5, water_lv: 2.26e6,
            I0: 1e-12, solar: 1360
        };

        function unitSup(str) {
            const map = { '0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻','+':'⁺' };
            return str.replace(/[-+0-9]/g, char => map[char] || char);
        }

        function toSci(num, precision = 2) {
            if (num === 0) return "0";
            let str = num.toExponential(precision); 
            let [mantissa, exponent] = str.split('e');
            let expInt = parseInt(exponent);
            if (expInt === 0) return parseFloat(mantissa).toFixed(precision);
            return `${mantissa} × 10<sup class="sci-exp">${expInt}</sup>`;
        }

        function fmt(n) {
            let abs = Math.abs(n);
            if (abs === 0) return "0";
            if (abs >= 0.001 && abs <= 9999) return parseFloat(n.toPrecision(4)).toString(); 
            return toSci(n);
        }

        function rand(min, max, dec) { 
            return parseFloat((Math.random()*(max-min)+min).toFixed(dec)); 
        }

        // --- The Formula Database with CHINESE DESCRIPTIONS ---
        const formulaDB = {
            heat: [
                { id:'h1', label:'比熱容量', html:'Q = mc&Delta;T', gen:()=>{ 
                    const m=rand(0.5, 5, 1); const dt=rand(10, 40, 0); const c=4200; const Q = m * c * dt;
                    const vars = { 'Q':Q, 'm':m, '&Delta;T':dt };
                    const names = { 'Q':'能量', 'm':'質量', '&Delta;T':'溫差' };
                    const units = { 'Q':'J', 'm':'kg', '&Delta;T':'°C' };
                    
                    const keys = Object.keys(vars);
                    const choice = keys[Math.floor(Math.random()*keys.length)];
                    
                    let qStr = "";
                    keys.forEach(k => { if(k !== choice) qStr += `${names[k]} <i>${k}</i> = ${fmt(vars[k])} ${units[k]}，`; });
                    return { unit: units[choice], q: qStr.slice(0,-1) + `。<br>求 ${names[choice]} <i>${choice}</i>。<br><span class="text-sm text-slate-400">(<i>c</i> = 4200 J kg${unitSup('-1')} °C${unitSup('-1')})</span>`, a: vars[choice] };
                }},
                { id:'h5', label:'氣體定律', html:'pV = nRT', gen:()=>{ 
                    const n=rand(1, 3, 1); const T=rand(300, 400, 0); const V=rand(0.02, 0.05, 3);
                    const p = (n * C.R * T) / V;
                    const vars = { 'p':p, 'V':V, 'n':n, 'T':T };
                    const names = { 'p':'壓強', 'V':'體積', 'n':'摩爾數', 'T':'溫度' };
                    const units = { 'p':'Pa', 'V':'m³', 'n':'mol', 'T':'K' };
                    
                    const keys = Object.keys(vars);
                    const choice = keys[Math.floor(Math.random()*keys.length)];
                    
                    let qStr = "";
                    keys.forEach(k => { if(k !== choice) qStr += `${names[k]} <i>${k}</i> = ${fmt(vars[k])} ${units[k]}，`; });
                    return { unit: units[choice], q: qStr.slice(0,-1) + `。<br>求 ${names[choice]} <i>${choice}</i>。`, a: vars[choice] };
                }}
            ],
            mechanics: [
                { id:'m1', label:'運動方程', html:'v = u + at', gen:()=>{ 
                    const u=rand(0, 10, 0); const a=rand(2, 5, 0); const t=rand(2, 6, 0); const v = u+a*t;
                    const vars = { 'v':v, 'u':u, 'a':a, 't':t };
                    const names = { 'v':'末速度', 'u':'初速度', 'a':'加速度', 't':'時間' };
                    const units = { 'v':'m s⁻¹', 'u':'m s⁻¹', 'a':'m s⁻²', 't':'s' };
                    
                    const keys = Object.keys(vars);
                    const choice = keys[Math.floor(Math.random()*keys.length)];
                    
                    let qStr = "";
                    keys.forEach(k => { if(k !== choice) qStr += `${names[k]} <i>${k}</i> = ${fmt(vars[k])} ${units[k]}，`; });
                    return { unit: units[choice], q: qStr.slice(0,-1) + `。<br>求 ${names[choice]} <i>${choice}</i>。`, a: vars[choice] };
                }},
                { id:'m5', label:'牛頓第二定律', html:'F = ma', gen:()=>{ 
                    const m=50; const a=2; const F=m*a;
                    const vars = { 'F':F, 'm':m, 'a':a };
                    const names = { 'F':'淨力', 'm':'質量', 'a':'加速度' };
                    const units = { 'F':'N', 'm':'kg', 'a':'m s⁻²' };
                    
                    const keys = Object.keys(vars);
                    const choice = keys[Math.floor(Math.random()*keys.length)];
                    
                    let qStr = "";
                    keys.forEach(k => { if(k !== choice) qStr += `${names[k]} <i>${k}</i> = ${fmt(vars[k])} ${units[k]}，`; });
                    return { unit: units[choice], q: qStr.slice(0,-1) + `。<br>求 ${names[choice]} <i>${choice}</i>。`, a: vars[choice] };
                }},
                { id:'m6', label:'動量', html:'p = mv', gen:()=>{ 
                    const m=2; const v=10; const p=m*v;
                    const vars = { 'p':p, 'm':m, 'v':v };
                    const names = { 'p':'動量', 'm':'質量', 'v':'速度' };
                    const units = { 'p':'kg m s⁻¹', 'm':'kg', 'v':'m s⁻¹' };
                    
                    const keys = Object.keys(vars);
                    const choice = keys[Math.floor(Math.random()*keys.length)];
                    
                    let qStr = "";
                    keys.forEach(k => { if(k !== choice) qStr += `${names[k]} <i>${k}</i> = ${fmt(vars[k])} ${units[k]}，`; });
                    return { unit: units[choice], q: qStr.slice(0,-1) + `。<br>求 ${names[choice]} <i>${choice}</i>。`, a: vars[choice] };
                }},
                { id:'m11', label:'重力勢能', html:'E<sub>p</sub> = mgh', gen:()=>{ 
                    const m=10; const h=50; const Ep = m*C.g*h;
                    const vars = { 'E<sub>p</sub>':Ep, 'm':m, 'h':h };
                    const names = { 'E<sub>p</sub>':'重力勢能', 'm':'質量', 'h':'高度' };
                    const units = { 'E<sub>p</sub>':'J', 'm':'kg', 'h':'m' };
                    
                    const keys = Object.keys(vars);
                    const choice = keys[Math.floor(Math.random()*keys.length)];
                    
                    let qStr = "";
                    keys.forEach(k => { if(k !== choice) qStr += `${names[k]} <i>${k}</i> = ${fmt(vars[k])} ${units[k]}，`; });
                    return { unit: units[choice], q: qStr.slice(0,-1) + `。<br>求 ${names[choice]} <i>${choice}</i>。`, a: vars[choice] };
                }},
                { id:'m15', label:'萬有引力', html:'F = GMm/r²', gen:()=>{ 
                    const M=6e24; const m=1000; const r=7e6; const F=(C.G*M*m)/(r*r);
                    const vars = { 'F':F, 'm':m, 'r':r };
                    const names = { 'F':'引力', 'm':'衛星質量', 'r':'軌道半徑' };
                    const units = { 'F':'N', 'm':'kg', 'r':'m' };
                    
                    const keys = Object.keys(vars);
                    const choice = keys[Math.floor(Math.random()*keys.length)];
                    
                    let qStr = `行星質量 <i>M</i> = ${fmt(M)} kg，`;
                    keys.forEach(k => { if(k !== choice) qStr += `${names[k]} <i>${k}</i> = ${fmt(vars[k])} ${units[k]}，`; });
                    return { unit: units[choice], q: qStr.slice(0,-1) + `。<br>求 ${names[choice]} <i>${choice}</i>。`, a: vars[choice] };
                }}
            ],
            waves: [
                { id:'w1', label:'波速方程', html:'v = f&lambda;', gen:()=>{ 
                    const f=200; const l=1.5; const v=f*l;
                    const vars = { 'v':v, 'f':f, '&lambda;':l };
                    const names = { 'v':'波速', 'f':'頻率', '&lambda;':'波長' };
                    const units = { 'v':'m s⁻¹', 'f':'Hz', '&lambda;':'m' };
                    
                    const keys = Object.keys(vars);
                    const choice = keys[Math.floor(Math.random()*keys.length)];
                    
                    let qStr = "";
                    keys.forEach(k => { if(k !== choice) qStr += `${names[k]} ${k==='&lambda;'?'':'<i>'}${k}${k==='&lambda;'?'':'</i>'} = ${fmt(vars[k])} ${units[k]}，`; });
                    return { unit: units[choice], q: qStr.slice(0,-1) + `。<br>求 ${names[choice]} ${choice==='&lambda;'?'':'<i>'}${choice}${choice==='&lambda;'?'':'</i>'}。`, a: vars[choice] };
                }},
                { id:'w5', label:'透鏡公式', html:'1/f = 1/u + 1/v', gen:()=>{ 
                    const u=0.2; const f=0.1; const v = 1/(1/f - 1/u);
                    const vars = { 'f':f, 'u':u, 'v':v };
                    const names = { 'f':'焦距', 'u':'物距', 'v':'像距' };
                    const units = { 'f':'m', 'u':'m', 'v':'m' };

                    return { unit: units[choice], q: qStr.slice(0,-1) + `。<br>求 ${names[choice]} <i>${choice}</i>。`, a: vars[choice] };
                }},
                { id:'a4', label:'質能關係', html:'&Delta;E = &Delta;mc<sup>2</sup>', gen:()=>{ 
                    const dm=1.66e-27; const E=dm*C.c*C.c;
                    const choice = Math.random()<0.5 ? '&Delta;E':'&Delta;m';
                    if(choice==='&Delta;E') return { unit:'J', q:`質量虧損 &Delta;<i>m</i> = ${fmt(dm)} kg。<br>求釋放能量 &Delta;<i>E</i>。`, a:E };
                    return { unit:'kg', q:`釋放能量 &Delta;<i>E</i> = ${fmt(E)} J。<br>求質量虧損 &Delta;<i>m</i>。`, a:dm };

            ],
            medical: [
                { id:'med1', label:'瑞利判據', html:'&theta; &approx; 1.22&lambda; / d', gen:()=>{ 
                    const l=5e-7; const d=0.002; const theta=1.22*l/d;
                    const vars = { '&theta;':theta, '&lambda;':l, 'd':d };
                    const names = { '&theta;':'分辨角', '&lambda;':'波長', 'd':'孔徑' };
                    const units = { '&theta;':'rad', '&lambda;':'m', 'd':'m' };
                    
                    const keys = Object.keys(vars);
                    const choice = keys[Math.floor(Math.random()*keys.length)];
                    
                    let qStr = "";
                    keys.forEach(k => { if(k !== choice) qStr += `${names[k]} ${k==='&lambda;'?'':'<i>'}${k}${k==='&lambda;'?'':'</i>'} = ${fmt(vars[k])} ${units[k]}，`; });
                    return { unit: units[choice], q: qStr.slice(0,-1) + `。<br>求 ${names[choice]} ${choice==='&lambda;'?'':'<i>'}${choice}${choice==='&lambda;'?'':'</i>'}。`, a: vars[choice] };
                }},
                { id:'med2', label:'聲強級', html:'L = 10 log(I/I<sub>0</sub>)', gen:()=>{ 
                    const I=1e-6; const L=10*Math.log10(I/C.I0);
                    const choice = Math.random()<0.5 ? 'L':'I';
                    if(choice==='L') return { unit:'dB', q:`聲強 <i>I</i> = ${fmt(I)} W m${unitSup('-2')}。<br>求聲強級 <i>L</i>。`, a:L };
                    return { unit:'W m⁻²', q:`聲強級 <i>L</i> = ${fmt(L)} dB。<br>求聲強 <i>I</i>。`, a:I };

            ],
            energy: [
                { id:'en1', label:'風力功率', html:'P = &frac{1}{2}&eta;&rho;Av<sup>3</sup>', gen:()=>{ 
                    const eta=0.4; const A=100; const v=10; const rho=1.2; const P=0.5*eta*rho*A*Math.pow(v,3);
                    const vars = { 'P':P, '&eta;':eta, 'A':A, 'v':v, '&rho;':rho };
                    const names = { 'P':'功率', '&eta;':'效率', 'A':'面積', 'v':'風速', '&rho;':'空氣密度' };
                    const units = { 'P':'W', '&eta;':'', 'A':'m²', 'v':'m s⁻¹', '&rho;':'kg m⁻³' };
                    
                    const keys = Object.keys(vars);
                    const choice = keys[Math.floor(Math.random()*keys.length)];
                    
                    let qStr = "";
                    keys.forEach(k => { if(k !== choice) qStr += `${names[k]} ${k.includes('&')?'':'<i>'}${k}${k.includes('&')?'':'</i>'} = ${fmt(vars[k])} ${units[k]}，`; });
                    return { unit: units[choice], q: qStr.slice(0,-1) + `。<br>求 ${names[choice]} ${choice.includes('&')?'':'<i>'}${choice}${choice.includes('&')?'':'</i>'}。`, a: vars[choice] };

                { id:'en6', label:'能源效益', html:'Eff = E<sub>out</sub> / E<sub>in</sub>', gen:()=>{ 
                    const out=800; const inp=1000; const eff=(out/inp)*100;
                    const vars = { 'Eff':eff, 'E<sub>out</sub>':out, 'E<sub>in</sub>':inp };
                    const names = { 'Eff':'效率', 'E<sub>out</sub>':'輸出能量', 'E<sub>in</sub>':'輸入能量' };
                    const units = { 'Eff':'%', 'E<sub>out</sub>':'J', 'E<sub>in</sub>':'J' };
                    
                    const keys = Object.keys(vars);
                    const choice = keys[Math.floor(Math.random()*keys.length)];

                    keys.forEach(k => { if(k !== choice) qStr += `${names[k]} <i>${k}</i> = ${fmt(vars[k])} ${units[k]}，`; });

        // --- Game Logic ---
        let gameState = { score: 0, lives: 3, playerName: "Player", isPlaying: false };
        let curTopic = 'mechanics';
        let curData = {};
        let isRevealed = false;
        let calcString = ""; // Stores the calculator input string

        const topicNames = {
            heat: "熱學 Heat",
            mechanics: "力學 Mechanics",
            waves: "波動 Waves",
            em: "電磁 E&M",
            atomic: "原子 Atomic",
            medical: "醫學 Medical",
            energy: "能源 Energy"
        };

        function startGameSession() {
            const input = document.getElementById('playerNameInput');
            const name = input.value.trim();
            if(!name) { document.getElementById('startError').classList.remove('hidden'); return; }
            
            gameState.playerName = name;
            gameState.score = 0;
            gameState.lives = 3;
            gameState.isPlaying = true;

            document.getElementById('currentPlayerDisplay').innerText = `Player: ${gameState.playerName}`;
            document.getElementById('startScreen').classList.add('hidden');
            
            updateHUD();
            nextRound();
        }

        function showStartScreen() {
            document.getElementById('gameOverModal').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
        }

        function updateHUD() {
            document.getElementById('scoreDisplay').innerText = gameState.score;
            let hearts = "";
            for(let i=0; i<gameState.lives; i++) hearts += "❤️";
            document.getElementById('livesDisplay').innerText = hearts;
        }

        function gameOver() {
            gameState.isPlaying = false;
            document.getElementById('finalScore').innerText = gameState.score;
            document.getElementById('gameOverModal').classList.remove('hidden');
        }

        function toggleFormula(force) {
            const c = document.getElementById('latexContainer');
            const o = document.getElementById('revealOverlay');
            if (force !== undefined) isRevealed = force; else isRevealed = !isRevealed;
            
            if (isRevealed) {
                c.classList.add('revealed');
                o.classList.add('opacity-0', 'pointer-events-none');
            } else {
                c.classList.remove('revealed');
                o.classList.remove('opacity-0', 'pointer-events-none');
            }
        }

        // --- Calculator Logic ---
        function updateCalcDisplay() {
            const disp = document.getElementById('calcDisplay');
            if (calcString === "") {
                disp.innerText = "";
                disp.classList.add("min-h-[2.5rem]"); // Keep height
            } else {
                disp.innerText = calcString;
            }
        }

        function calcInput(char) {
            if (!document.getElementById('checkBtn').disabled) {
                calcString += char;
                updateCalcDisplay();
            }
        }

        function calcAction(action) {
            if (document.getElementById('checkBtn').disabled) return;
            
            if (action === 'AC') {
                calcString = "";
            } else if (action === 'DEL') {
                calcString = calcString.slice(0, -1);
            }
            updateCalcDisplay();
        }

        function nextRound() {
            // 1. Pick Random Topic
            const topics = Object.keys(formulaDB);
            curTopic = topics[Math.floor(Math.random() * topics.length)];
            
            // 2. Pick Random Question
            const questions = formulaDB[curTopic];
            const item = questions[Math.floor(Math.random() * questions.length)];

            // 3. Reset UI
            isRevealed = false;
            toggleFormula(false);
            document.getElementById('feedback').innerHTML = '';
            document.getElementById('feedback').className = "text-center font-bold text-sm min-h-[20px] transition-all rounded-lg p-2";
            document.getElementById('checkBtn').disabled = false;
            document.getElementById('checkBtn').classList.remove('opacity-50', 'cursor-not-allowed');
            document.getElementById('topicBadge').innerText = topicNames[curTopic];
            
            // Reset Calculator
            calcString = "";
            updateCalcDisplay();

            // 4. Render Formula
            document.getElementById('formulaDisplay').innerHTML = item.html;

            // 5. Generate Data
            curData = item.gen();
            document.getElementById('unitLabel').innerHTML = curData.unit || "--";

            const q = document.getElementById('qText');
            q.style.opacity = 0;
            setTimeout(() => {
                q.innerHTML = curData.q;
                q.style.opacity = 1;
            }, 100);
        }

        function checkAnswer() {
            if (!document.getElementById('checkBtn').disabled) {
                // Parse calcString
                let val = parseFloat(calcString);
                
                // Handle empty or invalid input
                if (calcString === "" || isNaN(val)) {
                    // Flash the display to indicate error
                    const disp = document.getElementById('calcDisplay');
                    disp.classList.add('text-red-500');
                    setTimeout(() => disp.classList.remove('text-red-500'), 200);
                    return;
                }

                const correct = curData.a;
                // Tolerance: 1.5% or absolute small value
                const tol = Math.abs(correct) < 1e-15 ? 1e-15 : Math.abs(correct * 0.015);
                const isCorrect = Math.abs(val - correct) <= tol;
                
                const fb = document.getElementById('feedback');
                document.getElementById('checkBtn').disabled = true;
                document.getElementById('checkBtn').classList.add('opacity-50', 'cursor-not-allowed');

                if (isCorrect) {
                    gameState.score += 10;
                    fb.innerHTML = "✅ 正確！ Correct! (+10)";
                    fb.className = "text-center font-bold text-sm min-h-[20px] transition-all rounded-lg p-2 bg-emerald-500/20 text-emerald-300 border border-emerald-500/50";
                    updateHUD();
                    setTimeout(nextRound, 1500);
                } else {
                    gameState.lives--;
                    fb.innerHTML = `❌ 錯誤。答案 Answer: ${fmt(correct)}`;
                    fb.className = "text-center font-bold text-sm min-h-[20px] transition-all rounded-lg p-2 bg-red-500/20 text-red-300 border border-red-500/50";
                    updateHUD();
                    if (gameState.lives <= 0) setTimeout(gameOver, 2500);
                    else setTimeout(nextRound, 3000);
                }
            }
        }
    </script>
