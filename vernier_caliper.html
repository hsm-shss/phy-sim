<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📏 游標卡尺讀數練習 | SHSS物理虛擬實驗室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>

        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { background-color: #f0f9ff; font-family: 'Noto Sans TC', sans-serif; }


    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">
    <header class="bg-slate-900 text-white p-4 md:p-5 shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <a href="index.html" class="bg-blue-600 p-2 rounded-xl shadow-blue-500/40 shadow-lg shrink-0 hover:bg-blue-500 transition" title="返回主頁">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                    </svg>
                </a>
                <div class="min-w-0">
                    <h1 class="text-lg md:text-xl font-black tracking-wide truncate">📏 游標卡尺讀數練習</h1>
                    <p class="text-slate-400 text-xs font-medium tracking-wider">SHSS Physics Lab</p>
                </div>
            </div>
            <a href="index.html" class="text-sm font-bold text-blue-300 hover:text-white whitespace-nowrap">← 返回主頁</a>
        </div>
    </header>
    <main class="flex-grow p-4 md:p-8 max-w-6xl mx-auto w-full">
        <div class="bg-blue-50 border border-blue-100 rounded-2xl p-4 mb-6">
            <p class="text-sm font-bold text-blue-800 mb-1">🎯 學習目標</p>
            <p class="text-sm text-slate-600">練習讀取游標卡尺：主尺整數毫米＋游標重合格 × 0.1 mm，並即時獲得回饋。</p>
        </div>

        <div class="grid lg:grid-cols-5 gap-6">
            <div class="lg:col-span-3 bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
                <svg id="vernSvg" viewBox="0 0 640 220" class="w-full h-auto" xmlns="http://www.w3.org/2000/svg"></svg>
                <p class="text-xs text-slate-500 mt-2">主尺單位：mm；游標 10 格對應主尺 9 mm（精度 0.1 mm）。</p>
            </div>
            <div class="lg:col-span-2 space-y-4">
                <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-3">
                    <h2 class="font-bold text-slate-700">讀數練習</h2>
                    <p class="text-sm text-slate-600">請讀出游標卡尺顯示的長度（mm），準確至 0.1 mm。</p>
                    <div class="flex gap-2 items-center">
                        <input id="ans" type="number" step="0.1" class="flex-1 border border-slate-200 rounded-xl px-3 py-2 text-lg font-mono" placeholder="例如 12.3">
                        <span class="text-slate-500 font-medium">mm</span>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <button id="btnCheck" class="px-4 py-2 rounded-xl bg-slate-900 text-white text-sm font-bold">檢查答案</button>
                        <button id="btnNext" class="px-4 py-2 rounded-xl bg-blue-600 text-white text-sm font-bold">下一題</button>
                    </div>
                    <div id="feedback" class="text-sm rounded-xl p-3 bg-slate-50 border border-slate-100 min-h-[3rem]"></div>
                    <p class="text-xs text-slate-500">得分：<b id="score">0</b> / <b id="tried">0</b></p>
                </div>
            </div>
        </div>

    </main>
    <footer class="bg-slate-900 text-slate-400 py-6 mt-10 border-t border-slate-800">
        <div class="max-w-6xl mx-auto px-6 text-center text-sm">
            &copy; 2026 SHSS物理虛擬實驗室 · 原創課堂互動教材
        </div>
    </footer>

<script>
(function(){
  let trueVal=0, score=0, tried=0;
  const svg=document.getElementById('vernSvg');
  const PX_PER_MM=8; // main scale
  const ORIGIN=40;

  function draw(val){
    // val in mm, e.g. 12.3
    const main=Math.floor(val);
    const frac=Math.round((val-main)*10)/10;
    // vernier zero offset from main zero = val mm
    const vernZero = ORIGIN + val * PX_PER_MM;
    let marks='';
    // main scale 0..50 mm
    for(let i=0;i<=50;i++){
      const x=ORIGIN+i*PX_PER_MM;
      const h=i%10===0?36:(i%5===0?26:16);
      marks+=`<line x1="${x}" y1="70" x2="${x}" y2="${70+h}" stroke="#0f172a" stroke-width="1.5"/>`;
      if(i%10===0) marks+=`<text x="${x}" y="65" text-anchor="middle" font-size="11" fill="#334155">${i}</text>`;
    }
    // vernier 0..10 (each vernier division = 0.9 mm on main)
    let vmarks='';
    for(let i=0;i<=10;i++){
      const x=vernZero + i*0.9*PX_PER_MM;
      const h=i===0||i===5||i===10?28:16;
      vmarks+=`<line x1="${x}" y1="130" x2="${x}" y2="${130+h}" stroke="#1d4ed8" stroke-width="1.5"/>`;
      if(i===0||i===5||i===10) vmarks+=`<text x="${x}" y="172" text-anchor="middle" font-size="10" fill="#1d4ed8">${i}</text>`;
    }
    // highlight coinciding mark
    const coincideX = vernZero + Math.round(frac*10)*0.9*PX_PER_MM;
    svg.innerHTML=`
      <rect width="640" height="220" fill="#f8fafc"/>
      <text x="40" y="28" fill="#475569" font-size="13" font-weight="700">主尺 Main scale (mm)</text>
      <rect x="20" y="70" width="600" height="50" fill="#fef3c7" stroke="#d97706" stroke-width="2" rx="4"/>
      ${marks}
      <text x="40" y="120" fill="#1d4ed8" font-size="13" font-weight="700">游標 Vernier</text>
      <rect x="${vernZero-8}" y="128" width="${10*0.9*PX_PER_MM+16}" height="50" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="4"/>
      ${vmarks}
      <line x1="${coincideX}" y1="70" x2="${coincideX}" y2="178" stroke="#16a34a" stroke-width="2" stroke-dasharray="4 3" opacity="0.7"/>
      <text x="400" y="210" fill="#64748b" font-size="12">綠虛線：最接近重合的刻度（提示用）</text>
    `;
  }

  function newQ(){
    // random 5.0 to 40.0 step 0.1
    trueVal = Math.round((5 + Math.random()*35)*10)/10;
    draw(trueVal);
    document.getElementById('ans').value='';
    document.getElementById('feedback').innerHTML='讀出主尺整數＋游標重合格 × 0.1 mm。';
    document.getElementById('feedback').className='text-sm rounded-xl p-3 bg-slate-50 border border-slate-100 min-h-[3rem]';
  }

  document.getElementById('btnCheck').onclick=()=>{
    const a=parseFloat(document.getElementById('ans').value);
    tried++; document.getElementById('tried').textContent=tried;
    const fb=document.getElementById('feedback');
    if(isNaN(a)){ fb.textContent='請輸入數字。'; return; }
    if(Math.abs(a-trueVal)<0.05){
      score++; document.getElementById('score').textContent=score;
      fb.innerHTML=`✅ 正確！讀數為 <b>${trueVal.toFixed(1)} mm</b>。`;
      fb.className='text-sm rounded-xl p-3 bg-emerald-50 border border-emerald-100 text-emerald-800 min-h-[3rem]';
    } else {
      fb.innerHTML=`❌ 未正確。正確讀數是 <b>${trueVal.toFixed(1)} mm</b>（主尺 ${Math.floor(trueVal)}＋游標 ${(Math.round((trueVal%1)*10))}×0.1）。`;
      fb.className='text-sm rounded-xl p-3 bg-rose-50 border border-rose-100 text-rose-800 min-h-[3rem]';
    }
  };
  document.getElementById('btnNext').onclick=newQ;
  newQ();
})();
</script>

</body>
</html>
