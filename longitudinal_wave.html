<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔊 縱波：疏密部 | SHSS物理虛擬實驗室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { background-color: #f0f9ff; font-family: 'Noto Sans TC', sans-serif; }
        
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">
    <header class="bg-slate-900 text-white p-4 md:p-5 shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <a href="index.html" class="bg-blue-600 p-2 rounded-xl shadow-blue-500/40 shadow-lg shrink-0 hover:bg-blue-500 transition" title="返回主頁">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                    </svg>
                </a>
                <div class="min-w-0">
                    <h1 class="text-lg md:text-xl font-black tracking-wide truncate">🔊 縱波：疏密部</h1>
                    <p class="text-slate-400 text-xs font-medium tracking-wider">SHSS Physics Lab</p>
                </div>
            </div>
            <a href="index.html" class="text-sm font-bold text-blue-300 hover:text-white whitespace-nowrap">← 返回主頁</a>
        </div>
    </header>
    <main class="flex-grow p-4 md:p-8 max-w-6xl mx-auto w-full">
        <div class="bg-blue-50 border border-blue-100 rounded-2xl p-4 mb-6">
            <p class="text-sm font-bold text-blue-800 mb-1">🎯 學習目標</p>
            <p class="text-sm text-slate-600">觀察縱波中質點沿傳播方向振動，形成密部（compression）與疏部（rarefaction）。</p>
        </div>

        <div class="grid lg:grid-cols-5 gap-6">
            <div class="lg:col-span-2 space-y-4">
                <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
                    <h2 class="font-bold text-slate-700">參數</h2>
                    <label class="block text-sm"><span class="font-medium text-slate-600">振幅：<b id="Av">18</b></span>
                        <input id="A" type="range" min="5" max="30" step="1" value="18" class="w-full accent-sky-600 mt-1"></label>
                    <label class="block text-sm"><span class="font-medium text-slate-600">波長：<b id="Lv">100</b></span>
                        <input id="L" type="range" min="60" max="180" step="5" value="100" class="w-full accent-sky-600 mt-1"></label>
                    <label class="block text-sm"><span class="font-medium text-slate-600">頻率：<b id="fv">0.6</b> Hz</span>
                        <input id="f" type="range" min="0.2" max="1.5" step="0.05" value="0.6" class="w-full accent-sky-600 mt-1"></label>
                    <div class="rounded-xl bg-sky-50 border border-sky-100 p-3 text-sm text-xs text-slate-600">
                        密部：粒子間距較小；疏部：間距較大。傳播方向與振動方向平行。
                    </div>
                </div>
            </div>
            <div class="lg:col-span-3 bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
                <canvas id="cv" width="640" height="280" class="w-full h-auto rounded-xl bg-slate-50"></canvas>
            </div>
        </div>

    </main>
    <footer class="bg-slate-900 text-slate-400 py-6 mt-10 border-t border-slate-800">
        <div class="max-w-6xl mx-auto px-6 text-center text-sm">
            &copy; 2026 SHSS物理虛擬實驗室 · 原創課堂互動教材
        </div>
    </footer>
<script>

(function(){
  const A=document.getElementById('A'),L=document.getElementById('L'),f=document.getElementById('f');
  const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  let t0=performance.now(); const N=40;
  function frame(ts){
    const a=+A.value,lam=+L.value,freq=+f.value,t=(ts-t0)/1000;
    document.getElementById('Av').textContent=a;document.getElementById('Lv').textContent=lam;document.getElementById('fv').textContent=freq.toFixed(2);
    ctx.clearRect(0,0,640,280);ctx.fillStyle='#f8fafc';ctx.fillRect(0,0,640,280);
    const k=2*Math.PI/lam,w=2*Math.PI*freq, base=40, gap=(560)/N;
    ctx.fillStyle='#64748b';ctx.font='12px sans-serif';ctx.fillText('← 傳播方向', 260, 40);
    for(let i=0;i<N;i++){
      const x0=base+i*gap;
      const x=x0 + a*Math.sin(k*x0 - w*t);
      ctx.beginPath();ctx.arc(x,140,7,0,6.28);ctx.fillStyle='#0ea5e9';ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

</script>
</body>
</html>
