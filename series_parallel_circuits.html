<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔌 串聯／並聯電阻 | SHSS物理虛擬實驗室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { background-color: #f0f9ff; font-family: 'Noto Sans TC', sans-serif; }
        
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">
    <header class="bg-slate-900 text-white p-4 md:p-5 shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <a href="index.html" class="bg-blue-600 p-2 rounded-xl shadow-blue-500/40 shadow-lg shrink-0 hover:bg-blue-500 transition" title="返回主頁">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                    </svg>
                </a>
                <div class="min-w-0">
                    <h1 class="text-lg md:text-xl font-black tracking-wide truncate">🔌 串聯／並聯電阻</h1>
                    <p class="text-slate-400 text-xs font-medium tracking-wider">SHSS Physics Lab</p>
                </div>
            </div>
            <a href="index.html" class="text-sm font-bold text-blue-300 hover:text-white whitespace-nowrap">← 返回主頁</a>
        </div>
    </header>
    <main class="flex-grow p-4 md:p-8 max-w-6xl mx-auto w-full">
        <div class="bg-blue-50 border border-blue-100 rounded-2xl p-4 mb-6">
            <p class="text-sm font-bold text-blue-800 mb-1">🎯 學習目標</p>
            <p class="text-sm text-slate-600">計算串聯 R_eq = ΣR 與並聯 1/R_eq = Σ(1/R)；對照簡易電路示意圖。</p>
        </div>

        <div class="grid lg:grid-cols-5 gap-6">
            <div class="lg:col-span-2 space-y-4">
                <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
                    <h2 class="font-bold text-slate-700">電阻</h2>
                    <label class="block text-sm"><span class="font-medium text-slate-600">R₁：<b id="r1v">10</b> Ω</span>
                        <input id="r1" type="range" min="1" max="100" step="1" value="10" class="w-full accent-yellow-600 mt-1"></label>
                    <label class="block text-sm"><span class="font-medium text-slate-600">R₂：<b id="r2v">20</b> Ω</span>
                        <input id="r2" type="range" min="1" max="100" step="1" value="20" class="w-full accent-yellow-600 mt-1"></label>
                    <label class="block text-sm"><span class="font-medium text-slate-600">R₃：<b id="r3v">30</b> Ω</span>
                        <input id="r3" type="range" min="1" max="100" step="1" value="30" class="w-full accent-yellow-600 mt-1"></label>
                    <label class="block text-sm"><span class="font-medium text-slate-600">電源 V：<b id="Vv">12</b> V</span>
                        <input id="V" type="range" min="1" max="24" step="1" value="12" class="w-full accent-yellow-600 mt-1"></label>
                    <div class="rounded-xl bg-yellow-50 border border-yellow-100 p-3 text-sm space-y-1">
                        <p>串聯 R_eq = <b id="rs">—</b> Ω　I = <b id="is">—</b> A</p>
                        <p>並聯 R_eq = <b id="rp">—</b> Ω　I_total = <b id="ip">—</b> A</p>
                    </div>
                </div>
            </div>
            <div class="lg:col-span-3 bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
                <canvas id="cv" width="600" height="380" class="w-full h-auto rounded-xl bg-slate-50"></canvas>
            </div>
        </div>

    </main>
    <footer class="bg-slate-900 text-slate-400 py-6 mt-10 border-t border-slate-800">
        <div class="max-w-6xl mx-auto px-6 text-center text-sm">
            &copy; 2026 SHSS物理虛擬實驗室 · 原創課堂互動教材
        </div>
    </footer>
<script>

(function(){
  const els=['r1','r2','r3','V'].map(id=>document.getElementById(id));
  const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  function draw(){
    const R1=+els[0].value,R2=+els[1].value,R3=+els[2].value,V=+els[3].value;
    ['r1v','r2v','r3v','Vv'].forEach((id,i)=>document.getElementById(id).textContent=[R1,R2,R3,V][i]);
    const Rs=R1+R2+R3, Rp=1/(1/R1+1/R2+1/R3);
    document.getElementById('rs').textContent=Rs.toFixed(1);
    document.getElementById('is').textContent=(V/Rs).toFixed(3);
    document.getElementById('rp').textContent=Rp.toFixed(2);
    document.getElementById('ip').textContent=(V/Rp).toFixed(3);
    ctx.clearRect(0,0,600,380);ctx.fillStyle='#f8fafc';ctx.fillRect(0,0,600,380);
    ctx.strokeStyle='#334155';ctx.lineWidth=2;ctx.font='12px sans-serif';ctx.fillStyle='#334155';
    // series
    ctx.fillText('串聯',40,30);
    ctx.strokeRect(40,50,40,24); ctx.fillText('V',52,67);
    ctx.beginPath();ctx.moveTo(80,62);ctx.lineTo(120,62);ctx.stroke();
    function res(x,y,lab){ctx.strokeRect(x,y-12,50,24);ctx.fillText(lab,x+8,y+5);}
    res(120,62,'R1');ctx.beginPath();ctx.moveTo(170,62);ctx.lineTo(200,62);ctx.stroke();
    res(200,62,'R2');ctx.beginPath();ctx.moveTo(250,62);ctx.lineTo(280,62);ctx.stroke();
    res(280,62,'R3');ctx.beginPath();ctx.moveTo(330,62);ctx.lineTo(360,62);ctx.lineTo(360,100);ctx.lineTo(60,100);ctx.lineTo(60,62);ctx.lineTo(40,62);ctx.stroke();
    // parallel
    ctx.fillText('並聯',40,160);
    ctx.strokeRect(40,200,40,24);ctx.fillText('V',52,217);
    ctx.beginPath();ctx.moveTo(80,212);ctx.lineTo(140,212);ctx.moveTo(140,160);ctx.lineTo(140,280);ctx.stroke();
    res(160,160,'R1');res(160,212,'R2');res(160,264,'R3');
    ctx.beginPath();ctx.moveTo(210,160);ctx.lineTo(260,160);ctx.lineTo(260,280);ctx.lineTo(210,280);
    ctx.moveTo(210,212);ctx.lineTo(260,212);ctx.moveTo(260,212);ctx.lineTo(280,212);ctx.lineTo(280,212);ctx.lineTo(60,212);ctx.lineTo(60,212);ctx.stroke();
    ctx.beginPath();ctx.moveTo(80,212);ctx.lineTo(60,212);ctx.lineTo(60,200);ctx.stroke();
    ctx.lineWidth=1;
  }
  els.forEach(e=>e.addEventListener('input',draw)); draw();
})();

</script>
</body>
</html>
