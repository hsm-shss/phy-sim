<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ 靜電：吸引與排斥 | SHSS物理虛擬實驗室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { background-color: #f0f9ff; font-family: 'Noto Sans TC', sans-serif; }
        
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">
    <header class="bg-slate-900 text-white p-4 md:p-5 shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <a href="index.html" class="bg-blue-600 p-2 rounded-xl shadow-blue-500/40 shadow-lg shrink-0 hover:bg-blue-500 transition" title="返回主頁">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                    </svg>
                </a>
                <div class="min-w-0">
                    <h1 class="text-lg md:text-xl font-black tracking-wide truncate">⚡ 靜電：吸引與排斥</h1>
                    <p class="text-slate-400 text-xs font-medium tracking-wider">SHSS Physics Lab</p>
                </div>
            </div>
            <a href="index.html" class="text-sm font-bold text-blue-300 hover:text-white whitespace-nowrap">← 返回主頁</a>
        </div>
    </header>
    <main class="flex-grow p-4 md:p-8 max-w-6xl mx-auto w-full">
        <div class="bg-blue-50 border border-blue-100 rounded-2xl p-4 mb-6">
            <p class="text-sm font-bold text-blue-800 mb-1">🎯 學習目標</p>
            <p class="text-sm text-slate-600">同號電荷互相排斥、異號互相吸引；庫侖力定性 F ∝ |q₁q₂|/r²。</p>
        </div>

        <div class="grid lg:grid-cols-5 gap-6">
            <div class="lg:col-span-2 space-y-4">
                <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
                    <h2 class="font-bold text-slate-700">電荷</h2>
                    <label class="block text-sm"><span class="font-medium text-slate-600">q₁：<b id="q1v">+2</b></span>
                        <input id="q1" type="range" min="-5" max="5" step="1" value="2" class="w-full accent-yellow-600 mt-1"></label>
                    <label class="block text-sm"><span class="font-medium text-slate-600">q₂：<b id="q2v">-3</b></span>
                        <input id="q2" type="range" min="-5" max="5" step="1" value="-3" class="w-full accent-yellow-600 mt-1"></label>
                    <label class="block text-sm"><span class="font-medium text-slate-600">距離 r：<b id="rv">120</b> px</span>
                        <input id="r" type="range" min="60" max="260" step="5" value="120" class="w-full accent-yellow-600 mt-1"></label>
                    <div class="rounded-xl bg-yellow-50 border border-yellow-100 p-3 text-sm">
                        <p id="rel">—</p>
                        <p>相對 |F|：<b id="Ff">—</b></p>
                    </div>
                </div>
            </div>
            <div class="lg:col-span-3 bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
                <canvas id="cv" width="560" height="320" class="w-full h-auto rounded-xl bg-slate-50"></canvas>
            </div>
        </div>

    </main>
    <footer class="bg-slate-900 text-slate-400 py-6 mt-10 border-t border-slate-800">
        <div class="max-w-6xl mx-auto px-6 text-center text-sm">
            &copy; 2026 SHSS物理虛擬實驗室 · 原創課堂互動教材
        </div>
    </footer>
<script>

(function(){
  const q1=document.getElementById('q1'),q2=document.getElementById('q2'),rEl=document.getElementById('r');
  const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  function draw(){
    const a=+q1.value,b=+q2.value,r=+rEl.value;
    document.getElementById('q1v').textContent=(a>=0?'+':'')+a;
    document.getElementById('q2v').textContent=(b>=0?'+':'')+b;
    document.getElementById('rv').textContent=r;
    const prod=a*b; const attract=prod<0;
    document.getElementById('rel').textContent=prod===0?'有電荷為 0：無力':(attract?'異號 → 互相吸引':'同號 → 互相排斥');
    const F=Math.abs(prod)/(r*r)*50000;
    document.getElementById('Ff').textContent=F.toFixed(2);
    ctx.clearRect(0,0,560,320);ctx.fillStyle='#f8fafc';ctx.fillRect(0,0,560,320);
    const cx=280,cy=160, x1=cx-r/2,x2=cx+r/2;
    function ball(x,q){ctx.beginPath();ctx.arc(x,cy,22,0,6.28);ctx.fillStyle=q>0?'#ef4444':q<0?'#3b82f6':'#94a3b8';ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';ctx.fillText((q>0?'+':'')+q,x-8,cy+5);}
    ball(x1,a); ball(x2,b);
    if(prod!==0){
      const dir=attract?1:-1; // arrow on each toward/away
      ctx.strokeStyle='#f59e0b';ctx.lineWidth=3;
      const len=Math.min(80,20+F*8);
      // force on q1
      ctx.beginPath();ctx.moveTo(x1,cy-40);ctx.lineTo(x1+dir*len*(attract?1:-1),cy-40);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x2,cy-40);ctx.lineTo(x2-dir*len*(attract?1:-1),cy-40);ctx.stroke();
      ctx.lineWidth=1;
    }
  }
  [q1,q2,rEl].forEach(e=>e.addEventListener('input',draw)); draw();
})();

</script>
</body>
</html>
