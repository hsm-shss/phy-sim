<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌈 衍射光柵 | SHSS物理虛擬實驗室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { background-color: #f0f9ff; font-family: 'Noto Sans TC', sans-serif; }
        
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">
    <header class="bg-slate-900 text-white p-4 md:p-5 shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <a href="index.html" class="bg-blue-600 p-2 rounded-xl shadow-blue-500/40 shadow-lg shrink-0 hover:bg-blue-500 transition" title="返回主頁">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                    </svg>
                </a>
                <div class="min-w-0">
                    <h1 class="text-lg md:text-xl font-black tracking-wide truncate">🌈 衍射光柵</h1>
                    <p class="text-slate-400 text-xs font-medium tracking-wider">SHSS Physics Lab</p>
                </div>
            </div>
            <a href="index.html" class="text-sm font-bold text-blue-300 hover:text-white whitespace-nowrap">← 返回主頁</a>
        </div>
    </header>
    <main class="flex-grow p-4 md:p-8 max-w-6xl mx-auto w-full">
        <div class="bg-blue-50 border border-blue-100 rounded-2xl p-4 mb-6">
            <p class="text-sm font-bold text-blue-800 mb-1">🎯 學習目標</p>
            <p class="text-sm text-slate-600">使用 d sinθ = nλ 計算各級亮紋角度；調節光栅常數與波長觀察譜線位置。</p>
        </div>

        <div class="grid lg:grid-cols-5 gap-6">
            <div class="lg:col-span-2 space-y-4">
                <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
                    <h2 class="font-bold text-slate-700">參數</h2>
                    <label class="block text-sm"><span class="font-medium text-slate-600">線密度 N：<b id="Nv">500</b> 線/mm</span>
                        <input id="N" type="range" min="100" max="1200" step="50" value="500" class="w-full accent-sky-600 mt-1"></label>
                    <label class="block text-sm"><span class="font-medium text-slate-600">波長 λ：<b id="lv">550</b> nm</span>
                        <input id="lam" type="range" min="400" max="700" step="5" value="550" class="w-full accent-sky-600 mt-1"></label>
                    <div class="rounded-xl bg-sky-50 border border-sky-100 p-3 text-sm space-y-1" id="orders"></div>
                </div>
            </div>
            <div class="lg:col-span-3 bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
                <canvas id="cv" width="640" height="360" class="w-full h-auto rounded-xl bg-slate-900"></canvas>
            </div>
        </div>

    </main>
    <footer class="bg-slate-900 text-slate-400 py-6 mt-10 border-t border-slate-800">
        <div class="max-w-6xl mx-auto px-6 text-center text-sm">
            &copy; 2026 SHSS物理虛擬實驗室 · 原創課堂互動教材
        </div>
    </footer>
<script>

(function(){
  const N=document.getElementById('N'),lam=document.getElementById('lam');
  const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  function wlColor(nm){
    if(nm<440)return '#7c3aed'; if(nm<490)return '#2563eb'; if(nm<510)return '#06b6d4';
    if(nm<580)return '#22c55e'; if(nm<650)return '#eab308'; return '#ef4444';
  }
  function draw(){
    const lines=+N.value, Lnm=+lam.value;
    document.getElementById('Nv').textContent=lines; document.getElementById('lv').textContent=Lnm;
    const d=1e-3/lines; // m
    const lambda=Lnm*1e-9;
    let html='<p class="font-bold">d = '+(d*1e6).toFixed(3)+' μm</p>';
    const angs=[];
    for(let n=0;n<=5;n++){
      const s=n*lambda/d; if(s>1){html+='<p>n='+n+'：無解（sinθ>1）</p>';break;}
      const th=Math.asin(s)*180/Math.PI; angs.push({n,th});
      html+='<p>n='+n+'：θ = '+th.toFixed(2)+'°</p>';
    }
    document.getElementById('orders').innerHTML=html;
    ctx.fillStyle='#0f172a';ctx.fillRect(0,0,640,360);
    // screen
    ctx.fillStyle='#1e293b';ctx.fillRect(500,40,20,280);
    ctx.fillStyle='#94a3b8';ctx.font='12px sans-serif';ctx.fillText('光屏', 490, 30);
    ctx.fillStyle='#e2e8f0';ctx.fillText('光栅', 80, 30);
    ctx.strokeStyle='#64748b';ctx.strokeRect(100,100,20,160);
    const gx=110, gy=180, sx=510;
    angs.forEach(o=>{
      const rad=o.th*Math.PI/180;
      const y=gy + Math.tan(rad)* (sx-gx) * (o.n===0?0:1) * (o.n>0?1:1);
      // draw both + and -
      [1,-1].forEach(sign=>{
        if(o.n===0 && sign<0)return;
        const yy= gy + sign*Math.tan(rad)*(sx-gx);
        ctx.strokeStyle=wlColor(Lnm);ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(sx, Math.max(50,Math.min(310,yy)));ctx.stroke();
        ctx.fillStyle=wlColor(Lnm);ctx.beginPath();ctx.arc(sx+10, Math.max(50,Math.min(310,yy)),4,0,6.28);ctx.fill();
        ctx.fillStyle='#e2e8f0';ctx.fillText('n='+o.n, sx+20, Math.max(50,Math.min(310,yy))+4);
      });
    });
    ctx.lineWidth=1;
  }
  [N,lam].forEach(e=>e.addEventListener('input',draw)); draw();
})();

</script>
</body>
</html>
