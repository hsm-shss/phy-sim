<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 薄透鏡光線圖 | SHSS物理虛擬實驗室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { background-color: #f0f9ff; font-family: 'Noto Sans TC', sans-serif; }
        
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">
    <header class="bg-slate-900 text-white p-4 md:p-5 shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <a href="index.html" class="bg-blue-600 p-2 rounded-xl shadow-blue-500/40 shadow-lg shrink-0 hover:bg-blue-500 transition" title="返回主頁">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                    </svg>
                </a>
                <div class="min-w-0">
                    <h1 class="text-lg md:text-xl font-black tracking-wide truncate">🔍 薄透鏡光線圖</h1>
                    <p class="text-slate-400 text-xs font-medium tracking-wider">SHSS Physics Lab</p>
                </div>
            </div>
            <a href="index.html" class="text-sm font-bold text-blue-300 hover:text-white whitespace-nowrap">← 返回主頁</a>
        </div>
    </header>
    <main class="flex-grow p-4 md:p-8 max-w-6xl mx-auto w-full">
        <div class="bg-blue-50 border border-blue-100 rounded-2xl p-4 mb-6">
            <p class="text-sm font-bold text-blue-800 mb-1">🎯 學習目標</p>
            <p class="text-sm text-slate-600">凸透鏡三條主光線：平行→焦點、過光心直行、過焦點→平行；調節物距觀察實像／虛像。</p>
        </div>

        <div class="grid lg:grid-cols-5 gap-6">
            <div class="lg:col-span-2 space-y-4">
                <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
                    <h2 class="font-bold text-slate-700">參數</h2>
                    <label class="block text-sm"><span class="font-medium text-slate-600">焦距 f：<b id="fv">80</b> px</span>
                        <input id="f" type="range" min="40" max="120" step="5" value="80" class="w-full accent-violet-600 mt-1"></label>
                    <label class="block text-sm"><span class="font-medium text-slate-600">物距 u：<b id="uv">180</b> px</span>
                        <input id="u" type="range" min="50" max="280" step="5" value="180" class="w-full accent-violet-600 mt-1"></label>
                    <label class="block text-sm"><span class="font-medium text-slate-600">物高 h：<b id="hv">60</b> px</span>
                        <input id="h" type="range" min="20" max="100" step="5" value="60" class="w-full accent-violet-600 mt-1"></label>
                    <div class="rounded-xl bg-violet-50 border border-violet-100 p-3 text-sm space-y-1">
                        <p>像距 v：<b id="vout">—</b></p>
                        <p>放大率 m：<b id="mout">—</b></p>
                        <p class="text-xs text-slate-500">1/f = 1/v − 1/u（笛卡兒符號：物距 u 取負）課堂以圖示為主</p>
                    </div>
                </div>
            </div>
            <div class="lg:col-span-3 bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
                <canvas id="cv" width="640" height="400" class="w-full h-auto rounded-xl bg-slate-50"></canvas>
            </div>
        </div>

    </main>
    <footer class="bg-slate-900 text-slate-400 py-6 mt-10 border-t border-slate-800">
        <div class="max-w-6xl mx-auto px-6 text-center text-sm">
            &copy; 2026 SHSS物理虛擬實驗室 · 原創課堂互動教材
        </div>
    </footer>
<script>

(function(){
  const fEl=document.getElementById('f'),uEl=document.getElementById('u'),hEl=document.getElementById('h');
  const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  function draw(){
    const f=+fEl.value, u=+uEl.value, h=+hEl.value;
    document.getElementById('fv').textContent=f; document.getElementById('uv').textContent=u; document.getElementById('hv').textContent=h;
    // thin lens formula with unsigned classroom style: 1/v = 1/f - 1/u  if u>f real
    let vImg=null, m=null, real=true;
    if(Math.abs(u-f)>1e-6){
      vImg = 1/(1/f - 1/u);
      m = -vImg/u;
      real = vImg>0;
    }
    document.getElementById('vout').textContent = vImg==null?'∞':(vImg.toFixed(0)+' px '+(real?'實像':'虛像'));
    document.getElementById('mout').textContent = m==null?'—':m.toFixed(2);
    ctx.clearRect(0,0,640,400);ctx.fillStyle='#f8fafc';ctx.fillRect(0,0,640,400);
    const cx=320, cy=200;
    // axis
    ctx.strokeStyle='#94a3b8';ctx.beginPath();ctx.moveTo(20,cy);ctx.lineTo(620,cy);ctx.stroke();
    // lens
    ctx.strokeStyle='#7c3aed';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx,60);ctx.lineTo(cx,340);ctx.stroke();ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(cx,60);ctx.lineTo(cx-8,75);ctx.moveTo(cx,60);ctx.lineTo(cx+8,75);
    ctx.moveTo(cx,340);ctx.lineTo(cx-8,325);ctx.moveTo(cx,340);ctx.lineTo(cx+8,325);ctx.stroke();
    // foci
    ctx.fillStyle='#a78bfa';ctx.beginPath();ctx.arc(cx-f,cy,4,0,6.28);ctx.fill();ctx.beginPath();ctx.arc(cx+f,cy,4,0,6.28);ctx.fill();
    ctx.fillStyle='#64748b';ctx.font='12px sans-serif';ctx.fillText('F',cx-f-4,cy+18);ctx.fillText("F'",cx+f-4,cy+18);
    // object
    const ox=cx-u, oy=cy-h;
    ctx.strokeStyle='#ea580c';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(ox,cy);ctx.lineTo(ox,oy);ctx.stroke();
    ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ox-6,oy+10);ctx.moveTo(ox,oy);ctx.lineTo(ox+6,oy+10);ctx.stroke();ctx.lineWidth=1;
    // rays
    ctx.strokeStyle='#0ea5e9';ctx.setLineDash([]);
    // 1 parallel then through F'
    ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(cx,oy);
    if(real && vImg!=null){ ctx.lineTo(cx+vImg, cy - h*(vImg/u)*Math.sign(vImg)*(-Math.sign(m)||1)); }
    else { ctx.lineTo(cx+200, oy + (200)*(oy-cy?0:0)); /* continue toward F' */ ctx.lineTo(620, cy + (oy-cy)/f*(620-cx-f) ); }
    // simpler ray drawing:
    ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(cx,oy);ctx.lineTo(cx+f*3, cy+(oy-cy)/f*(f*3-f));ctx.stroke();
    // 2 through optical center
    ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(cx+(cx-ox), cy+(cy-oy)*-1 + 2*cy - (2*cy - oy)); // through center
    // redo center ray: from object through (cx,cy)
    const dx=cx-ox, dy=cy-oy;
    ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(cx+dx*2,cy+dy*2);ctx.stroke();
    // 3 through F then parallel
    ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(cx-f,cy);ctx.lineTo(cx, cy); // not accurate
    // Better: through near F: line from object to left F, then from lens height parallel
    // Ray through F (object side): goes to lens at height such that passes F then after lens parallel
    // For teaching: ray from tip through F lands on lens then parallel to axis
    // Intersection of object-to-F with lens plane x=cx
    // F at (cx-f,cy). Line param
    const t = (cx-ox)/((cx-f)-ox || 1e-6);
    // Actually use: height at lens for ray aiming at F: 
    // skip complex; draw image if real
    if(vImg!=null){
      const ih = -h * (vImg/u);
      const ix=cx+vImg, iy=cy+ih;
      if(real){
        ctx.strokeStyle='#16a34a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(ix,cy);ctx.lineTo(ix,iy);ctx.stroke();ctx.lineWidth=1;
        ctx.fillStyle='#16a34a';ctx.font='13px sans-serif';ctx.fillText('實像', ix+6, (iy+cy)/2);
      } else {
        ctx.setLineDash([4,4]);ctx.strokeStyle='#16a34a';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(ix,cy);ctx.lineTo(ix,iy);ctx.stroke();ctx.setLineDash([]);ctx.lineWidth=1;
        ctx.fillStyle='#16a34a';ctx.fillText('虛像', ix-30, iy-8);
      }
    }
    ctx.fillStyle='#ea580c';ctx.fillText('物', ox-10, oy-8);
  }
  [fEl,uEl,hEl].forEach(e=>e.addEventListener('input',draw)); draw();
})();

</script>
</body>
</html>
