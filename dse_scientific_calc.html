<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>fx-3650P 課堂模擬器（非官方）</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Share+Tech+Mono&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:'Noto Sans TC',system-ui,sans-serif;
  background:#c8ccd0;
  background-image:
    linear-gradient(#b8bcc0 1px,transparent 1px),
    linear-gradient(90deg,#b8bcc0 1px,transparent 1px);
  background-size:18px 18px;
  color:#1e293b;
  -webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;
}
a.home{
  position:fixed;top:10px;left:12px;z-index:40;
  font-size:13px;font-weight:700;color:#1e3a5f;
  text-decoration:none;background:rgba(255,255,255,.9);
  border:1px solid #cbd5e1;border-radius:999px;padding:6px 12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}
a.home:hover{background:#fff}
.page{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:56px 12px 28px;gap:14px;
}
.pill{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px 18px;
  background:#fff;border-radius:999px;padding:10px 22px;
  box-shadow:0 4px 16px rgba(0,0,0,.12),0 1px 0 #fff inset;
  border:1px solid #e5e7eb;font-size:14px;font-weight:600;color:#111827;
}
.pill label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.pill input{width:15px;height:15px;accent-color:#2563eb}
.device-wrap{width:min(100%,360px);filter:drop-shadow(0 22px 28px rgba(15,23,42,.35))}
.device{
  position:relative;border-radius:28px;padding:10px 9px 14px;
  background:linear-gradient(160deg,#3a3f45 0%,#1c1f24 40%,#0f1114 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.25),
    inset 0 -2px 4px rgba(0,0,0,.5),
    0 0 0 1px #0a0c0f;
}
.face{
  border-radius:22px;padding:12px 10px 14px;
  background:linear-gradient(145deg,#f7f8fa 0%,#e4e6ea 18%,#cfd3d8 55%,#b8bdc4 100%);
  box-shadow:
    inset 0 2px 3px #fff,
    inset 0 -3px 6px rgba(80,90,100,.25),
    0 1px 0 rgba(255,255,255,.15);
}
.brand{
  display:flex;justify-content:space-between;align-items:flex-end;
  padding:0 4px 6px;color:#2a3038;
}
.brand .casio{font-weight:900;font-size:15px;letter-spacing:-.5px;line-height:1}
.brand .casio em{display:block;font:italic 600 10px/1.2 Georgia,serif;margin-top:2px;opacity:.85}
.brand .right{text-align:right;font-size:9px;font-weight:700;letter-spacing:.4px;opacity:.8}
.lcd-bezel{
  margin:2px 2px 12px;padding:6px;border-radius:8px;
  background:linear-gradient(160deg,#6d747a,#aeb4b8 45%,#8a9096);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.5);
}
.lcd{
  position:relative;min-height:78px;border-radius:4px;
  background:linear-gradient(180deg,#d5dcd4,#c4cec6);
  box-shadow:inset 0 3px 8px rgba(40,55,45,.35);
  padding:8px 10px 6px;color:#1a2a20;
  font-family:'Share Tech Mono','Courier New',monospace;
}
.lcd-top{display:flex;justify-content:space-between;align-items:flex-start;min-height:16px;font-size:11px;font-weight:800;letter-spacing:.5px}
.lcd-flags{display:flex;gap:8px;opacity:.9}
.lcd-flags span{opacity:.18}
.lcd-flags span.on{opacity:1}
.lcd-d{
  font-size:11px;font-weight:900;border:1.5px solid #1a2a20;padding:0 4px;line-height:1.15;
  opacity:0;border-radius:2px;
}
.lcd-d.on{opacity:1}
.lcd-expr{font-size:12px;min-height:14px;opacity:.7;word-break:break-all;margin-top:2px}
.lcd-main{
  text-align:right;font-size:34px;font-weight:700;letter-spacing:1px;
  line-height:1.05;margin-top:4px;word-break:break-all;
  text-shadow:0 0 0 #1a2a20;
}
.topctrl{
  display:grid;grid-template-columns:1fr 1fr 1.7fr 1fr 1fr;gap:5px;align-items:end;margin-bottom:8px;
}
.slot{min-width:0;display:flex;flex-direction:column;justify-content:flex-end}
.leg{
  height:13px;display:flex;align-items:flex-end;justify-content:space-between;
  font:700 7.5px/1 Arial,Helvetica,sans-serif;padding:0 1px 1px;pointer-events:none;color:#b8860b;
}
.leg .r{color:#c0392b}
.leg .g{color:#2e7d5b}
.leg .b{color:#4a6fa5}
.key{
  display:flex;align-items:center;justify-content:center;width:100%;
  border:0;cursor:pointer;touch-action:manipulation;
  font-family:Arial,Helvetica,sans-serif;font-weight:700;
  transition:transform .04s,filter .04s;
}
.key:active,.key.is-down{transform:translateY(1px);filter:brightness(1.15)}
.key.oval{
  height:28px;border-radius:999px;font-size:8.5px;letter-spacing:.2px;
  color:#1c2228;border:1px solid #6a727a;
  background:linear-gradient(180deg,#c5cad0 0%,#9aa1a8 55%,#7e868e 100%);
  box-shadow:inset 0 1px 0 #eef0f2,0 2px 0 #3a4148,0 3px 3px rgba(0,0,0,.25);
}
.key.oval .yl{color:#d4a017}
.key.oval .rd{color:#c0392b}
.replay{
  position:relative;height:72px;border-radius:50%;
  border:1px solid #6f787f;
  background:radial-gradient(circle at 35% 25%,#c5c9cd,#8d959c 70%,#6f777e);
  box-shadow:inset 0 2px 3px #fff,0 2px 2px rgba(0,0,0,.3);
}
.replay>i{
  position:absolute;inset:0;display:grid;place-items:center;
  font:800 7px/1 Arial,sans-serif;font-style:normal;color:#4f5860;pointer-events:none;letter-spacing:.5px;
}
.replay .rk{
  position:absolute;width:26px;height:26px;border:0;background:transparent;
  color:#e8ebed;font-size:10px;cursor:pointer;text-shadow:0 1px 1px #333;
}
.replay .rk.u{top:2px;left:calc(50% - 13px)}
.replay .rk.d{bottom:2px;left:calc(50% - 13px)}
.replay .rk.l{top:23px;left:3px}
.replay .rk.r{top:23px;right:3px}
.row2{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr 1fr;gap:5px;margin-bottom:5px}
.key.orange{
  height:30px;border-radius:999px;font-size:12px;color:#fff;
  background:linear-gradient(180deg,#f2a34c,#c45e18);
  border:1px solid #9a4a18;
  box-shadow:inset 0 1px 0 rgba(255,220,160,.5),0 2px 0 #6e3410,0 3px 3px rgba(0,0,0,.25);
}
.key.blk{
  height:30px;border-radius:8px;font-size:11px;color:#f4f5f7;
  background:linear-gradient(180deg,#4a5058 0%,#2a2f36 55%,#1b1f25 100%);
  border:1px solid #12151a;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 2px 0 #0a0c0f,0 3px 3px rgba(0,0,0,.28);
}
.key.blk.sm{font-size:10px}
.numpad{
  margin-top:8px;padding:8px 4px 4px;border-radius:14px;
  background:linear-gradient(180deg,#3d434a 0%,#23272d 100%);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.12);
}
.row5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-bottom:5px}
.key.num{
  height:40px;border-radius:10px;font-size:18px;font-weight:600;color:#f5f6f8;
  background:linear-gradient(180deg,#4a515a 0%,#2c333c 60%,#1a2028 100%);
  border:1px solid #0d1014;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 2px 0 #05070a,0 3px 4px rgba(0,0,0,.3);
}
.key.num.warn{color:#f0a0a0;font-size:13px;font-weight:800}
.key.num.op{font-size:17px}
.key.num.exe{font-size:13px;font-weight:800;letter-spacing:.5px}
.key.num.sm{font-size:12px;font-weight:700}
.device.locked .face{filter:grayscale(.35) brightness(.92)}
.device.locked::after{
  content:'鎖定畫面';position:absolute;inset:40% 12% auto;z-index:5;
  text-align:center;font-weight:800;font-size:14px;color:#fff;
  background:rgba(15,23,42,.72);border-radius:10px;padding:10px 8px;
  pointer-events:none;
}
.teach{
  width:min(100%,360px);background:rgba(255,255,255,.92);border:1px solid #d1d5db;
  border-radius:14px;padding:10px 12px;box-shadow:0 4px 12px rgba(0,0,0,.08);
}
.teach h3{font-size:13px;margin-bottom:6px;color:#1e3a5f}
.teach-keys{display:flex;flex-wrap:wrap;gap:4px;max-height:72px;overflow:auto}
.tk{
  display:inline-flex;align-items:center;min-height:22px;padding:2px 7px;
  border:1px solid #c5d6e8;border-radius:6px;background:#fff;color:#23466b;font:12px/1.2 Arial,sans-serif;
}
.tk.latest{background:#1d62b4;border-color:#1d62b4;color:#fff;font-weight:700}
.hint{width:min(100%,360px);text-align:center;font-size:11px;color:#475569;line-height:1.6}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
  background:#0f172a;color:#fff;font-size:13px;font-weight:600;
  padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:50;max-width:90vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.disc{width:min(100%,360px);font-size:11px;color:#64748b;line-height:1.6;text-align:center}
@media(max-width:380px){
  .lcd-main{font-size:28px}
  .key.num{height:36px;font-size:16px}
  .device-wrap{width:min(100%,340px)}
}
</style>
</head>
<body>
<a class="home" href="index.html">← 主頁</a>
<div class="page">
  <div class="pill" role="group" aria-label="課堂選項">
    <label><input type="checkbox" id="optTeach"> 教學模式</label>
    <label><input type="checkbox" id="optLock"> 鎖定畫面</label>
    <label><input type="checkbox" id="optSound"> 音效</label>
  </div>

  <div id="teachBox" class="teach" hidden>
    <h3>教學按鍵紀錄 <button type="button" id="clrLog" style="float:right;font-size:11px;border:1px solid #cbd5e1;background:#fff;border-radius:6px;padding:2px 8px;cursor:pointer">清除</button></h3>
    <div id="log" class="teach-keys" aria-live="polite"></div>
  </div>

  <div class="device-wrap">
    <div class="device" id="device" aria-label="fx-3650P 課堂模擬器">
      <div class="face" id="shell">
        <div class="brand">
          <div class="casio">CASIO<em>fx-3650P</em></div>
          <div class="right">S-V.P.A.M.<br>CLASSROOM</div>
        </div>

        <div class="lcd-bezel">
          <div class="lcd">
            <div class="lcd-top">
              <div class="lcd-flags">
                <span id="indShift">S</span>
                <span id="indAlpha">A</span>
              </div>
              <span class="lcd-d on" id="indD">D</span>
            </div>
            <div class="lcd-expr" id="expr">&nbsp;</div>
            <div class="lcd-main" id="disp">0.</div>
          </div>
        </div>

        <!-- SHIFT ALPHA REPLAY MODE ON -->
        <div class="topctrl">
          <div class="slot">
            <div class="leg"><span style="color:#d4a017">SHIFT</span></div>
            <button type="button" class="key oval" data-k="SHIFT"><span class="yl">SHIFT</span></button>
          </div>
          <div class="slot">
            <div class="leg"><span class="r">ALPHA</span></div>
            <button type="button" class="key oval" data-k="ALPHA"><span class="rd">ALPHA</span></button>
          </div>
          <div class="replay" aria-label="REPLAY">
            <i>REPLAY</i>
            <button type="button" class="rk u" data-k="UP" title="上">▲</button>
            <button type="button" class="rk d" data-k="DOWN" title="下">▼</button>
            <button type="button" class="rk l" data-k="LEFT" title="左">◀</button>
            <button type="button" class="rk r" data-k="RIGHT" title="右">▶</button>
          </div>
          <div class="slot">
            <div class="leg"><span>SETUP</span></div>
            <button type="button" class="key oval" data-k="MODE">MODE</button>
          </div>
          <div class="slot">
            <div class="leg"><span></span></div>
            <button type="button" class="key oval" data-k="ON">ON</button>
          </div>
        </div>

        <!-- Prog FMLA -->
        <div class="row2" style="grid-template-columns:1.2fr 1.2fr 1fr 1fr 1fr 1fr;margin-bottom:7px">
          <div class="slot"><div class="leg"><span class="b">EXIT</span></div><button type="button" class="key orange" data-k="Prog">Prog</button></div>
          <div class="slot"><div class="leg"><span></span></div><button type="button" class="key orange" data-k="FMLA">FMLA</button></div>
          <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
        </div>

        <!-- Function rows: CalcX / fx-3650P classroom look -->
        <div class="row2">
          <div class="slot"><div class="leg"><span>x⁻¹</span><span>d/c</span></div><button type="button" class="key blk sm" data-k="Frac">a b/c</button></div>
          <div class="slot"><div class="leg"><span>∛</span><span>x³</span></div><button type="button" class="key blk sm" data-k="sqrt">√</button></div>
          <div class="slot"><div class="leg"><span class="g">DEC</span></div><button type="button" class="key blk sm" data-k="x^2">x²</button></div>
          <div class="slot"><div class="leg"><span class="g">HEX</span></div><button type="button" class="key blk sm" data-k="^">^</button></div>
          <div class="slot"><div class="leg"><span>10ˣ</span><span class="g">BIN</span></div><button type="button" class="key blk sm" data-k="log">log</button></div>
          <div class="slot"><div class="leg"><span>eˣ</span><span class="r">e</span></div><button type="button" class="key blk sm" data-k="ln">ln</button></div>
        </div>
        <div class="row2">
          <div class="slot"><div class="leg"><span>∠</span><span class="r">A</span></div><button type="button" class="key blk sm" data-k="(-)">(−)</button></div>
          <div class="slot"><div class="leg"><span>←</span><span class="r">B</span></div><button type="button" class="key blk sm" data-k="dms">°′″</button></div>
          <div class="slot"><div class="leg"><span></span><span class="r">C</span></div><button type="button" class="key blk sm" data-k="hyp">hyp</button></div>
          <div class="slot"><div class="leg"><span>sin⁻¹</span><span class="r">D</span></div><button type="button" class="key blk sm" data-k="sin">sin</button></div>
          <div class="slot"><div class="leg"><span>cos⁻¹</span><span class="r">E</span></div><button type="button" class="key blk sm" data-k="cos">cos</button></div>
          <div class="slot"><div class="leg"><span>tan⁻¹</span><span class="r">F</span></div><button type="button" class="key blk sm" data-k="tan">tan</button></div>
        </div>
        <div class="row2" style="margin-bottom:2px">
          <div class="slot"><div class="leg"><span>STO</span></div><button type="button" class="key blk sm" data-k="RCL">RCL</button></div>
          <div class="slot"><div class="leg"><span>←</span><span class="r">i</span></div><button type="button" class="key blk sm" data-k="ENG">ENG</button></div>
          <div class="slot"><div class="leg"><span>%</span></div><button type="button" class="key blk sm" data-k="(">(</button></div>
          <div class="slot"><div class="leg"><span>Abs</span><span class="r">X</span></div><button type="button" class="key blk sm" data-k=")">)</button></div>
          <div class="slot"><div class="leg"><span>:</span><span class="r">Y</span></div><button type="button" class="key blk sm" data-k=",">,</button></div>
          <div class="slot"><div class="leg"><span>M−</span><span class="r">M</span></div><button type="button" class="key blk sm" data-k="M+">M+</button></div>
        </div>

        <!-- Number pad on darker lower section -->
        <div class="numpad">
          <div class="row5">
            <div class="slot"><div class="leg"><span></span></div><button type="button" class="key num" data-k="7">7</button></div>
            <div class="slot"><div class="leg"><span></span></div><button type="button" class="key num" data-k="8">8</button></div>
            <div class="slot"><div class="leg"><span></span></div><button type="button" class="key num" data-k="9">9</button></div>
            <div class="slot"><div class="leg"><span></span></div><button type="button" class="key num warn" data-k="DEL">DEL</button></div>
            <div class="slot"><div class="leg"><span></span></div><button type="button" class="key num warn" data-k="AC">AC</button></div>
          </div>
          <div class="row5">
            <div class="slot"><div class="leg"><span></span></div><button type="button" class="key num" data-k="4">4</button></div>
            <div class="slot"><div class="leg"><span></span></div><button type="button" class="key num" data-k="5">5</button></div>
            <div class="slot"><div class="leg"><span></span></div><button type="button" class="key num" data-k="6">6</button></div>
            <div class="slot"><div class="leg"><span></span></div><button type="button" class="key num op" data-k="×">×</button></div>
            <div class="slot"><div class="leg"><span></span></div><button type="button" class="key num op" data-k="÷">÷</button></div>
          </div>
          <div class="row5">
            <div class="slot"><div class="leg"><span></span></div><button type="button" class="key num" data-k="1">1</button></div>
            <div class="slot"><div class="leg"><span></span></div><button type="button" class="key num" data-k="2">2</button></div>
            <div class="slot"><div class="leg"><span></span></div><button type="button" class="key num" data-k="3">3</button></div>
            <div class="slot"><div class="leg"><span></span></div><button type="button" class="key num op" data-k="+">+</button></div>
            <div class="slot"><div class="leg"><span></span></div><button type="button" class="key num op" data-k="−">−</button></div>
          </div>
          <div class="row5" style="margin-bottom:0">
            <div class="slot"><div class="leg"><span></span></div><button type="button" class="key num" data-k="0">0</button></div>
            <div class="slot"><div class="leg"><span>Ran#</span></div><button type="button" class="key num" data-k=".">.</button></div>
            <div class="slot"><div class="leg"><span>π</span></div><button type="button" class="key num sm" data-k="EXP">EXP</button></div>
            <div class="slot"><div class="leg"><span>DRG▸</span></div><button type="button" class="key num sm" data-k="Ans">Ans</button></div>
            <div class="slot"><div class="leg"><span>Re⇔Im</span></div><button type="button" class="key num exe" data-k="EXE">EXE</button></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <p class="hint">黃色＝SHIFT　紅色＝ALPHA　MODE＝DEG/RAD　Enter＝EXE</p>
  <p class="disc">⚠ fx-3650P 課堂模擬器（非官方）。外觀教學用；運算引擎為校本原創，非原廠韌體。</p>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  const disp=document.getElementById('disp');
  const expr=document.getElementById('expr');
  const logEl=document.getElementById('log');
  const teachBox=document.getElementById('teachBox');
  const device=document.getElementById('device');
  const toastEl=document.getElementById('toast');
  const optTeach=document.getElementById('optTeach');
  const optLock=document.getElementById('optLock');
  const optSound=document.getElementById('optSound');

  let cur='0', pending='', op=null, acc=null, ans=0, mem=0;
  let keys=[], shift=false, alpha=false, ang='deg', fresh=true;
  let toastTimer=null;

  function fmtDisp(s){
    if(s==='Math ERROR') return s;
    if(s===''||s==null) return '0.';
    if(/[eE]/.test(s) || /[^\d.\-]/.test(s) && s!=='0.') return s;
    if(s.indexOf('.')>=0) return s;
    return s+'.';
  }
  function setInd(){
    document.getElementById('indShift').classList.toggle('on', shift);
    document.getElementById('indAlpha').classList.toggle('on', alpha);
    document.getElementById('indD').classList.toggle('on', ang==='deg');
    document.getElementById('indD').textContent = ang==='deg' ? 'D' : 'R';
  }
  function update(){
    disp.textContent=fmtDisp(cur);
    expr.innerHTML=pending||'&nbsp;';
    setInd();
  }
  function toast(msg){
    toastEl.textContent=msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2200);
  }
  function beep(){
    if(!optSound.checked) return;
    try{
      const ctx=new (window.AudioContext||window.webkitAudioContext)();
      const o=ctx.createOscillator(); const g=ctx.createGain();
      o.type='square'; o.frequency.value=880;
      g.gain.value=0.03;
      o.connect(g); g.connect(ctx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.05);
      o.stop(ctx.currentTime+0.06);
      setTimeout(()=>ctx.close(),120);
    }catch(e){}
  }
  function logKey(k){
    if(!optTeach.checked) return;
    keys.push(k);
    logEl.innerHTML=keys.slice(-40).map((x,i,a)=>'<span class="tk'+(i===a.length-1?' latest':'')+'">'+x+'</span>').join('');
    logEl.scrollTop=logEl.scrollHeight;
  }
  function toRad(x){return ang==='deg'?x*Math.PI/180:x;}
  function fromRad(x){return ang==='deg'?x*180/Math.PI:x;}
  function applyOp(a,b,o){
    if(o==='+')return a+b; if(o==='−')return a-b; if(o==='×')return a*b; if(o==='÷')return a/b; if(o==='^')return Math.pow(a,b); return b;
  }
  function num(v){const n=Number(v); return Number.isFinite(n)?n:NaN;}
  function setCur(v){
    if(!Number.isFinite(v)){cur='Math ERROR';fresh=true;return;}
    let s=String(+parseFloat(v.toPrecision(12)));
    cur=s; fresh=true;
  }

  function press(lab){
    if(optLock.checked && lab!=='ON'){ beep(); return; }
    beep();
    logKey(lab);

    if(lab==='SHIFT'){shift=!shift; alpha=false; update(); return;}
    if(lab==='ALPHA'){alpha=!alpha; shift=false; update(); return;}
    if(lab==='ON'||lab==='AC'){
      cur='0';pending='';op=null;acc=null;shift=false;alpha=false;fresh=true;update();return;
    }
    if(lab==='DEL'){
      if(fresh||cur==='Math ERROR'){cur='0';fresh=true;}
      else if(cur.length<=1){cur='0';fresh=true;}
      else cur=cur.slice(0,-1);
      update();return;
    }
    if(lab==='MODE'){
      if(shift){ang='deg';shift=false;}
      else {ang=(ang==='deg'?'rad':'deg');}
      update();return;
    }
    if(lab==='Prog'||lab==='FMLA'){
      shift=false; alpha=false;
      toast('課堂版：程式編輯稍後開放');
      update(); return;
    }
    if(lab==='Frac'){
      if(shift){ shift=false; setCur(1/num(cur)); update(); return; } // x⁻¹
      alpha=false; update(); return;
    }
    if(['UP','DOWN','LEFT','RIGHT','hyp','RCL','ENG','dms'].includes(lab)){
      if(lab==='RCL' && shift){ shift=false; toast('STO：課堂版稍後開放'); update(); return; }
      shift=false; alpha=false; update(); return;
    }
    if(lab==='M+'){
      if(shift){ mem-=num(cur); }
      else { mem+=num(cur); }
      shift=false; alpha=false; fresh=true; update(); return;
    }
    if(lab===','){ shift=false; alpha=false; update(); return; }

    // ALPHA constants / vars
    if(alpha){
      alpha=false;
      if(lab==='EXP' || lab==='π'){ cur=String(Math.PI); fresh=true; update(); return; }
      if(lab==='ln'){ cur=String(Math.E); fresh=true; update(); return; }
      if(lab==='Ans'){ /* DRG stub via Ans+ALPHA */ ang = ang==='deg'?'rad':(ang==='rad'?'grad':'deg'); if(ang==='grad') ang='deg'; update(); return; }
      update(); return;
    }

    // SHIFT secondary
    if(shift){
      shift=false;
      if(lab==='sin'){setCur(fromRad(Math.asin(num(cur))));update();return;}
      if(lab==='cos'){setCur(fromRad(Math.acos(num(cur))));update();return;}
      if(lab==='tan'){setCur(fromRad(Math.atan(num(cur))));update();return;}
      if(lab==='sqrt'){setCur(Math.cbrt?Math.cbrt(num(cur)):Math.pow(num(cur),1/3));update();return;} // ∛ / x³
      if(lab==='x^2'){setCur(Math.pow(num(cur),3));update();return;} // classroom: SHIFT x² → x³
      if(lab==='Frac'){setCur(1/num(cur));update();return;}
      if(lab==='log'){setCur(Math.pow(10,num(cur)));update();return;}
      if(lab==='ln'){setCur(Math.exp(num(cur)));update();return;}
      if(lab==='EXP'){setCur(Math.PI);update();return;}
      if(lab===')'){setCur(Math.abs(num(cur)));update();return;}
      if(lab==='.'){ setCur(Math.random()); update(); return; }
      if(lab==='x^-1'){setCur(1/num(cur));update();return;}
    }

    if(lab==='x^-1'){setCur(1/num(cur));update();return;}
    if(lab==='Ans'){cur=String(ans);fresh=true;update();return;}
    if(lab==='sqrt'){setCur(Math.sqrt(num(cur)));update();return;}
    if(lab==='x^2'){setCur(Math.pow(num(cur),2));update();return;}
    if(lab==='x^3'){setCur(Math.pow(num(cur),3));update();return;}
    if(lab==='log'){setCur(Math.log10?Math.log10(num(cur)):Math.log(num(cur))/Math.LN10);update();return;}
    if(lab==='ln'){setCur(Math.log(num(cur)));update();return;}
    if(lab==='sin'){setCur(Math.sin(toRad(num(cur))));update();return;}
    if(lab==='cos'){setCur(Math.cos(toRad(num(cur))));update();return;}
    if(lab==='tan'){setCur(Math.tan(toRad(num(cur))));update();return;}
    if(lab==='(-)'){
      if(fresh||cur==='0'){cur='-';fresh=false;}
      else if(cur.charAt(0)==='-') cur=cur.slice(1)||'0';
      else cur='-'+cur;
      update();return;
    }

    if(['+','−','×','÷','^'].includes(lab)){
      if(op!=null && acc!=null && !fresh){acc=applyOp(acc,num(cur),op);}
      else if(acc==null){acc=num(cur);}
      op=lab; pending=String(acc)+' '+lab+' '; cur='0'; fresh=true; update(); return;
    }
    if(lab==='EXE'||lab==='='){
      let r=num(cur);
      if(op!=null && acc!=null){r=applyOp(acc,num(cur),op);}
      ans=r; setCur(r); pending=''; op=null; acc=null; update(); return;
    }
    if(lab==='EXP'){
      if(fresh||cur==='0'){cur='1e';fresh=false;}
      else if(!/[eE]/.test(cur)) cur+='e';
      update();return;
    }
    if(lab==='.'){ if(fresh){cur='0.';fresh=false;} else if(!cur.includes('.')) cur+='.'; update(); return; }
    if(/^[0-9]$/.test(lab)){ cur=(fresh||cur==='0')?lab:cur+lab; fresh=false; update(); return; }
    if(lab===')'){ update(); return; }
    if(lab==='('){update();return;}
  }

  document.getElementById('shell').addEventListener('click',e=>{
    const b=e.target.closest('[data-k]'); if(!b) return;
    press(b.getAttribute('data-k'));
  });
  optTeach.addEventListener('change',()=>{
    teachBox.hidden=!optTeach.checked;
    if(!optTeach.checked){keys=[];logEl.innerHTML='';}
  });
  optLock.addEventListener('change',()=>{
    device.classList.toggle('locked', optLock.checked);
  });
  document.getElementById('clrLog').onclick=()=>{keys=[];logEl.innerHTML='';};
  document.addEventListener('keydown',e=>{
    if(optLock.checked) return;
    if(e.key==='Enter'){e.preventDefault();press('EXE');}
    else if(e.key==='Backspace'){e.preventDefault();press('DEL');}
    else if(e.key==='Escape'){press('AC');}
    else if(e.key===' '){e.preventDefault();press('SHIFT');}
    else if(e.key==='*') press('×');
    else if(e.key==='/') press('÷');
    else if(e.key==='+') press('+');
    else if(e.key==='-') press('−');
    else if(e.key==='^') press('^');
    else if(e.key==='.') press('.');
    else if(/^[0-9]$/.test(e.key)) press(e.key);
  });
  update();
})();
</script>
</body>
</html>
