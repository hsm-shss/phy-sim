<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧯 壓力定律（定體積） | SHSS物理虛擬實驗室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { background-color: #f0f9ff; font-family: 'Noto Sans TC', sans-serif; }
        
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">
    <header class="bg-slate-900 text-white p-4 md:p-5 shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <a href="index.html" class="bg-blue-600 p-2 rounded-xl shadow-blue-500/40 shadow-lg shrink-0 hover:bg-blue-500 transition" title="返回主頁">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                    </svg>
                </a>
                <div class="min-w-0">
                    <h1 class="text-lg md:text-xl font-black tracking-wide truncate">🧯 壓力定律（定體積）</h1>
                    <p class="text-slate-400 text-xs font-medium tracking-wider">SHSS Physics Lab</p>
                </div>
            </div>
            <a href="index.html" class="text-sm font-bold text-blue-300 hover:text-white whitespace-nowrap">← 返回主頁</a>
        </div>
    </header>
    <main class="flex-grow p-4 md:p-8 max-w-6xl mx-auto w-full">
        <div class="bg-blue-50 border border-blue-100 rounded-2xl p-4 mb-6">
            <p class="text-sm font-bold text-blue-800 mb-1">🎯 學習目標</p>
            <p class="text-sm text-slate-600">固定體積下，觀察壓強 P 與絕對溫度 T（K）成正比：P/T = 常數；繪製 P–T 直線。</p>
        </div>

        <div class="grid lg:grid-cols-5 gap-6">
            <div class="lg:col-span-2 space-y-4">
                <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
                    <h2 class="font-bold text-slate-700">參數</h2>
                    <label class="block text-sm"><span class="font-medium text-slate-600">溫度 T：<b id="tv">300</b> K</span>
                        <input id="T" type="range" min="200" max="500" step="5" value="300" class="w-full accent-orange-600 mt-1"></label>
                    <label class="block text-sm"><span class="font-medium text-slate-600">參考壓強 P₀（於 273 K）：<b id="p0v">1.00</b> atm</span>
                        <input id="P0" type="range" min="0.5" max="2" step="0.05" value="1" class="w-full accent-orange-600 mt-1"></label>
                    <div class="rounded-xl bg-orange-50 border border-orange-100 p-3 text-sm">
                        <p>當前壓強 P</p>
                        <p class="text-2xl font-black text-orange-700 mt-1"><span id="Pout">1.10</span> atm</p>
                        <p class="text-xs text-slate-500 mt-2">P = P₀ × (T / 273)</p>
                    </div>
                    <button id="addPt" class="w-full px-4 py-2 rounded-xl bg-slate-900 text-white text-sm font-bold hover:bg-slate-700">記錄數據點</button>
                    <button id="clr" class="w-full px-4 py-2 rounded-xl bg-slate-100 text-slate-700 text-sm font-bold hover:bg-slate-200">清除數據</button>
                </div>
            </div>
            <div class="lg:col-span-3 bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
                <canvas id="cv" width="640" height="400" class="w-full h-auto rounded-xl bg-slate-50"></canvas>
            </div>
        </div>

    </main>
    <footer class="bg-slate-900 text-slate-400 py-6 mt-10 border-t border-slate-800">
        <div class="max-w-6xl mx-auto px-6 text-center text-sm">
            &copy; 2026 SHSS物理虛擬實驗室 · 原創課堂互動教材
        </div>
    </footer>
<script>

(function(){
  const T=document.getElementById('T'),P0=document.getElementById('P0');
  const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  const pts=[];
  function Pof(){return (+P0.value)*(+T.value)/273;}
  function draw(){
    document.getElementById('tv').textContent=T.value;
    document.getElementById('p0v').textContent=(+P0.value).toFixed(2);
    document.getElementById('Pout').textContent=Pof().toFixed(2);
    ctx.clearRect(0,0,640,400); ctx.fillStyle='#f8fafc'; ctx.fillRect(0,0,640,400);
    const L=70,R=600,Top=30,B=340;
    ctx.strokeStyle='#94a3b8'; ctx.beginPath();ctx.moveTo(L,B);ctx.lineTo(R,B);ctx.moveTo(L,Top);ctx.lineTo(L,B);ctx.stroke();
    ctx.fillStyle='#64748b';ctx.font='12px sans-serif';
    ctx.fillText('T (K)',R-40,B+24); ctx.fillText('P (atm)',L-55,Top+8);
    // theoretical line
    function px(t){return L+(R-L)*((t-0)/550);}
    function py(p){return B-(B-Top)*(p/3);}
    ctx.strokeStyle='#f97316';ctx.lineWidth=2;ctx.setLineDash([6,4]);
    ctx.beginPath();ctx.moveTo(px(0),py(0));ctx.lineTo(px(550),py((+P0.value)*550/273));ctx.stroke();ctx.setLineDash([]);
    // current
    const curT=+T.value,curP=Pof();
    ctx.fillStyle='#ea580c';ctx.beginPath();ctx.arc(px(curT),py(curP),8,0,6.28);ctx.fill();
    pts.forEach(p=>{ctx.fillStyle='#0ea5e9';ctx.beginPath();ctx.arc(px(p.t),py(p.p),5,0,6.28);ctx.fill();});
    ctx.fillStyle='#334155';ctx.fillText('虛線：理論 P∝T（外推至 0 K）', L+10, 380);
  }
  document.getElementById('addPt').onclick=()=>{pts.push({t:+T.value,p:Pof()});draw();};
  document.getElementById('clr').onclick=()=>{pts.length=0;draw();};
  [T,P0].forEach(e=>e.addEventListener('input',draw)); draw();
})();

</script>
</body>
</html>
