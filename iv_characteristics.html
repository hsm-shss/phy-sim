<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📉 I–V 特性曲線 | SHSS物理虛擬實驗室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { background-color: #f0f9ff; font-family: 'Noto Sans TC', sans-serif; }
        
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">
    <header class="bg-slate-900 text-white p-4 md:p-5 shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <a href="index.html" class="bg-blue-600 p-2 rounded-xl shadow-blue-500/40 shadow-lg shrink-0 hover:bg-blue-500 transition" title="返回主頁">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                    </svg>
                </a>
                <div class="min-w-0">
                    <h1 class="text-lg md:text-xl font-black tracking-wide truncate">📉 I–V 特性曲線</h1>
                    <p class="text-slate-400 text-xs font-medium tracking-wider">SHSS Physics Lab</p>
                </div>
            </div>
            <a href="index.html" class="text-sm font-bold text-blue-300 hover:text-white whitespace-nowrap">← 返回主頁</a>
        </div>
    </header>
    <main class="flex-grow p-4 md:p-8 max-w-6xl mx-auto w-full">
        <div class="bg-blue-50 border border-blue-100 rounded-2xl p-4 mb-6">
            <p class="text-sm font-bold text-blue-800 mb-1">🎯 學習目標</p>
            <p class="text-sm text-slate-600">比較歐姆導體（直線）與燈絲（非線性：溫度↑電阻↑）的 I–V 關係。</p>
        </div>

        <div class="grid lg:grid-cols-5 gap-6">
            <div class="lg:col-span-2 space-y-4">
                <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
                    <h2 class="font-bold text-slate-700">設定</h2>
                    <label class="block text-sm"><span class="font-medium text-slate-600">歐姆電阻 R：<b id="Rv">10</b> Ω</span>
                        <input id="R" type="range" min="2" max="40" step="1" value="10" class="w-full accent-yellow-600 mt-1"></label>
                    <label class="block text-sm"><span class="font-medium text-slate-600">電壓 V：<b id="Vv">6.0</b> V</span>
                        <input id="V" type="range" min="0" max="12" step="0.1" value="6" class="w-full accent-yellow-600 mt-1"></label>
                    <div class="rounded-xl bg-yellow-50 border border-yellow-100 p-3 text-sm space-y-1">
                        <p>歐姆：I = V/R = <b id="Iohm">—</b> A</p>
                        <p>燈絲（模型）：I ≈ <b id="Ifil">—</b> A</p>
                        <p class="text-xs text-slate-500">燈絲模型：R_eff = R₀(1+kI²) 定性</p>
                    </div>
                </div>
            </div>
            <div class="lg:col-span-3 bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
                <canvas id="cv" width="560" height="360" class="w-full h-auto rounded-xl bg-slate-50"></canvas>
            </div>
        </div>

    </main>
    <footer class="bg-slate-900 text-slate-400 py-6 mt-10 border-t border-slate-800">
        <div class="max-w-6xl mx-auto px-6 text-center text-sm">
            &copy; 2026 SHSS物理虛擬實驗室 · 原創課堂互動教材
        </div>
    </footer>
<script>

(function(){
  const R=document.getElementById('R'),V=document.getElementById('V');
  const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  function Ifil(v,R0){ // solve I = V/(R0(1+0.08*I^2)) iteratively
    let I=v/R0; for(let n=0;n<20;n++){ I=v/(R0*(1+0.08*I*I)); } return I;
  }
  function draw(){
    const r=+R.value,v=+V.value;
    document.getElementById('Rv').textContent=r; document.getElementById('Vv').textContent=v.toFixed(1);
    const Io=v/r, If=Ifil(v,r);
    document.getElementById('Iohm').textContent=Io.toFixed(3);
    document.getElementById('Ifil').textContent=If.toFixed(3);
    ctx.clearRect(0,0,560,360);ctx.fillStyle='#f8fafc';ctx.fillRect(0,0,560,360);
    const L=60,RR=520,T=30,B=320;
    ctx.strokeStyle='#94a3b8';ctx.beginPath();ctx.moveTo(L,B);ctx.lineTo(RR,B);ctx.moveTo(L,T);ctx.lineTo(L,B);ctx.stroke();
    ctx.fillStyle='#64748b';ctx.font='12px sans-serif';ctx.fillText('V',RR-10,B+20);ctx.fillText('I',L-20,T+10);
    function px(vv){return L+(RR-L)*(vv/12);} function py(ii){return B-(B-T)*(ii/2);}
    // ohmic
    ctx.strokeStyle='#2563eb';ctx.lineWidth=2;ctx.beginPath();
    for(let vv=0;vv<=12;vv+=0.2){const ii=vv/r;const X=px(vv),Y=py(ii); if(vv===0)ctx.moveTo(X,Y);else ctx.lineTo(X,Y);} ctx.stroke();
    // filament
    ctx.strokeStyle='#f59e0b';ctx.beginPath();
    for(let vv=0;vv<=12;vv+=0.2){const ii=Ifil(vv,r);const X=px(vv),Y=py(ii); if(vv===0)ctx.moveTo(X,Y);else ctx.lineTo(X,Y);} ctx.stroke();ctx.lineWidth=1;
    ctx.fillStyle='#2563eb';ctx.fillText('歐姆導體',400,50); ctx.fillStyle='#f59e0b';ctx.fillText('燈絲',400,70);
    ctx.fillStyle='#dc2626';ctx.beginPath();ctx.arc(px(v),py(Io),5,0,6.28);ctx.fill();
    ctx.beginPath();ctx.arc(px(v),py(If),5,0,6.28);ctx.fill();
  }
  [R,V].forEach(e=>e.addEventListener('input',draw)); draw();
})();

</script>
</body>
</html>
