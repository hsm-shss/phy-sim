<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌡️ 溫度計校準 | SHSS物理虛擬實驗室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { background-color: #f0f9ff; font-family: 'Noto Sans TC', sans-serif; }
        
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">
    <header class="bg-slate-900 text-white p-4 md:p-5 shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <a href="index.html" class="bg-blue-600 p-2 rounded-xl shadow-blue-500/40 shadow-lg shrink-0 hover:bg-blue-500 transition" title="返回主頁">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                    </svg>
                </a>
                <div class="min-w-0">
                    <h1 class="text-lg md:text-xl font-black tracking-wide truncate">🌡️ 溫度計校準</h1>
                    <p class="text-slate-400 text-xs font-medium tracking-wider">SHSS Physics Lab</p>
                </div>
            </div>
            <a href="index.html" class="text-sm font-bold text-blue-300 hover:text-white whitespace-nowrap">← 返回主頁</a>
        </div>
    </header>
    <main class="flex-grow p-4 md:p-8 max-w-6xl mx-auto w-full">
        <div class="bg-blue-50 border border-blue-100 rounded-2xl p-4 mb-6">
            <p class="text-sm font-bold text-blue-800 mb-1">🎯 學習目標</p>
            <p class="text-sm text-slate-600">認識冰點（0°C）與汽點（100°C）兩固定點；由線性校準把刻度讀數換算成真溫度。</p>
        </div>

        <div class="grid lg:grid-cols-5 gap-6">
            <div class="lg:col-span-2 space-y-4">
                <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
                    <h2 class="font-bold text-slate-700">校準參數</h2>
                    <label class="block text-sm"><span class="font-medium text-slate-600">冰點刻度 X₀：<b id="x0v">20</b></span>
                        <input id="x0" type="range" min="0" max="40" step="1" value="20" class="w-full accent-cyan-600 mt-1"></label>
                    <label class="block text-sm"><span class="font-medium text-slate-600">汽點刻度 X₁₀₀：<b id="x100v">180</b></span>
                        <input id="x100" type="range" min="100" max="250" step="1" value="180" class="w-full accent-cyan-600 mt-1"></label>
                    <label class="block text-sm"><span class="font-medium text-slate-600">待測刻度 X：<b id="xv">100</b></span>
                        <input id="x" type="range" min="0" max="250" step="1" value="100" class="w-full accent-cyan-600 mt-1"></label>
                    <div class="rounded-xl bg-cyan-50 border border-cyan-100 p-3 text-sm">
                        <p>真溫度 t（線性校準）</p>
                        <p class="text-2xl font-black text-cyan-700 mt-1"><span id="tout">50.0</span> °C</p>
                        <p class="text-xs text-slate-500 mt-2">t = 100 × (X − X₀) / (X₁₀₀ − X₀)</p>
                    </div>
                </div>
            </div>
            <div class="lg:col-span-3 bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
                <canvas id="cv" width="640" height="360" class="w-full h-auto rounded-xl bg-slate-50"></canvas>
            </div>
        </div>

    </main>
    <footer class="bg-slate-900 text-slate-400 py-6 mt-10 border-t border-slate-800">
        <div class="max-w-6xl mx-auto px-6 text-center text-sm">
            &copy; 2026 SHSS物理虛擬實驗室 · 原創課堂互動教材
        </div>
    </footer>
<script>

(function(){
  const x0=document.getElementById('x0'),x100=document.getElementById('x100'),x=document.getElementById('x');
  const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  function sync(){
    document.getElementById('x0v').textContent=x0.value;
    document.getElementById('x100v').textContent=x100.value;
    document.getElementById('xv').textContent=x.value;
    const X0=+x0.value,X100=+x100.value,X=+x.value;
    const den=X100-X0||1;
    const t=100*(X-X0)/den;
    document.getElementById('tout').textContent=t.toFixed(1);
    // graph
    ctx.clearRect(0,0,640,360);
    ctx.fillStyle='#f8fafc'; ctx.fillRect(0,0,640,360);
    const L=60,R=600,T=40,B=300;
    ctx.strokeStyle='#94a3b8'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(L,B); ctx.lineTo(R,B); ctx.moveTo(L,T); ctx.lineTo(L,B); ctx.stroke();
    ctx.fillStyle='#64748b'; ctx.font='12px sans-serif';
    ctx.fillText('刻度 X', R-40, B+24); ctx.fillText('t (°C)', L-50, T+10);
    // axes ticks
    for(let i=0;i<=5;i++){ const yy=B-(B-T)*i/5; ctx.fillText(String(i*20), L-28, yy+4); ctx.beginPath();ctx.moveTo(L,yy);ctx.lineTo(L+4,yy);ctx.stroke();}
    const xmax=Math.max(250,X100+20);
    // calibration line
    function px(Xv){return L+(R-L)*(Xv/xmax);}
    function py(tv){return B-(B-T)*(tv/100);}
    ctx.strokeStyle='#0891b2'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(px(X0),py(0)); ctx.lineTo(px(X100),py(100)); ctx.stroke();
    // points
    function dot(Xv,tv,c,lab){ctx.fillStyle=c;ctx.beginPath();ctx.arc(px(Xv),py(tv),6,0,6.28);ctx.fill();ctx.fillStyle='#334155';ctx.fillText(lab,px(Xv)+8,py(tv)-8);}
    dot(X0,0,'#22d3ee','冰點 (X₀,0)');
    dot(X100,100,'#f97316','汽點 (X₁₀₀,100)');
    dot(X,t,'#7c3aed','待測 ('+X+','+t.toFixed(1)+')');
    // thermometer bar
    const barX=560, barY=50, barH=230;
    ctx.fillStyle='#e2e8f0'; ctx.fillRect(barX,barY,24,barH);
    const frac=Math.max(0,Math.min(1,(X-0)/xmax));
    ctx.fillStyle='#06b6d4'; ctx.fillRect(barX,barY+barH*(1-frac),24,barH*frac);
    ctx.strokeStyle='#0e7490'; ctx.strokeRect(barX,barY,24,barH);
    ctx.fillStyle='#334155'; ctx.fillText('溫度計', barX-10, barY-10);
  }
  [x0,x100,x].forEach(el=>el.addEventListener('input',sync)); sync();
})();

</script>
</body>
</html>
