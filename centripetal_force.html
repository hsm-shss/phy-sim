<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔄 向心力 | SHSS物理虛擬實驗室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { background-color: #f0f9ff; font-family: 'Noto Sans TC', sans-serif; }
        
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">
    <header class="bg-slate-900 text-white p-4 md:p-5 shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <a href="index.html" class="bg-blue-600 p-2 rounded-xl shadow-blue-500/40 shadow-lg shrink-0 hover:bg-blue-500 transition" title="返回主頁">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                    </svg>
                </a>
                <div class="min-w-0">
                    <h1 class="text-lg md:text-xl font-black tracking-wide truncate">🔄 向心力</h1>
                    <p class="text-slate-400 text-xs font-medium tracking-wider">SHSS Physics Lab</p>
                </div>
            </div>
            <a href="index.html" class="text-sm font-bold text-blue-300 hover:text-white whitespace-nowrap">← 返回主頁</a>
        </div>
    </header>
    <main class="flex-grow p-4 md:p-8 max-w-6xl mx-auto w-full">
        <div class="bg-blue-50 border border-blue-100 rounded-2xl p-4 mb-6">
            <p class="text-sm font-bold text-blue-800 mb-1">🎯 學習目標</p>
            <p class="text-sm text-slate-600">視覺化 F = mv²/r：調節質量、速率與半徑，觀察所需向心力大小與圓周運動。</p>
        </div>

        <div class="grid lg:grid-cols-5 gap-6">
            <div class="lg:col-span-2 space-y-4">
                <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
                    <h2 class="font-bold text-slate-700">參數</h2>
                    <label class="block text-sm"><span class="font-medium text-slate-600">質量 m：<b id="mv">2.0</b> kg</span>
                        <input id="m" type="range" min="0.5" max="5" step="0.1" value="2" class="w-full accent-orange-600 mt-1"></label>
                    <label class="block text-sm"><span class="font-medium text-slate-600">速率 v：<b id="vv">4.0</b> m/s</span>
                        <input id="v" type="range" min="1" max="10" step="0.1" value="4" class="w-full accent-orange-600 mt-1"></label>
                    <label class="block text-sm"><span class="font-medium text-slate-600">半徑 r：<b id="rv">3.0</b> m</span>
                        <input id="r" type="range" min="1" max="8" step="0.1" value="3" class="w-full accent-orange-600 mt-1"></label>
                    <div class="rounded-xl bg-orange-50 border border-orange-100 p-3 text-sm">
                        <p>向心力 F = mv²/r</p>
                        <p class="text-2xl font-black text-orange-700 mt-1"><span id="Fout">10.7</span> N</p>
                        <p class="text-xs text-slate-500 mt-1">週期 T = 2πr/v = <span id="Tout">—</span> s</p>
                    </div>
                </div>
            </div>
            <div class="lg:col-span-3 bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
                <canvas id="cv" width="500" height="420" class="w-full h-auto rounded-xl bg-slate-50"></canvas>
            </div>
        </div>

    </main>
    <footer class="bg-slate-900 text-slate-400 py-6 mt-10 border-t border-slate-800">
        <div class="max-w-6xl mx-auto px-6 text-center text-sm">
            &copy; 2026 SHSS物理虛擬實驗室 · 原創課堂互動教材
        </div>
    </footer>
<script>

(function(){
  const mEl=document.getElementById('m'),vEl=document.getElementById('v'),rEl=document.getElementById('r');
  const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  let ang=0,last=performance.now();
  function vals(){return {m:+mEl.value,v:+vEl.value,r:+rEl.value};}
  function draw(ts){
    const {m,v,r}=vals(); const F=m*v*v/r; const T=2*Math.PI*r/v;
    document.getElementById('mv').textContent=m.toFixed(1);
    document.getElementById('vv').textContent=v.toFixed(1);
    document.getElementById('rv').textContent=r.toFixed(1);
    document.getElementById('Fout').textContent=F.toFixed(1);
    document.getElementById('Tout').textContent=T.toFixed(2);
    const dt=(ts-last)/1000; last=ts; ang+= (v/r)*dt;
    ctx.clearRect(0,0,500,420);ctx.fillStyle='#f8fafc';ctx.fillRect(0,0,500,420);
    const cx=250,cy=210,scale=20;
    ctx.strokeStyle='#cbd5e1';ctx.beginPath();ctx.arc(cx,cy,r*scale,0,6.28);ctx.stroke();
    const x=cx+Math.cos(ang)*r*scale, y=cy+Math.sin(ang)*r*scale;
    ctx.strokeStyle='#f97316';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(x,y);ctx.stroke();ctx.lineWidth=1;
    // force arrow toward center
    const fx=cx+(x-cx)*0.55, fy=cy+(y-cy)*0.55;
    ctx.strokeStyle='#dc2626';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(fx,fy);ctx.stroke();ctx.lineWidth=1;
    ctx.fillStyle='#ea580c';ctx.beginPath();ctx.arc(x,y,10+m*2,0,6.28);ctx.fill();
    ctx.fillStyle='#334155';ctx.font='13px sans-serif';ctx.fillText('F 指向圓心', Math.min(x,fx)-20, Math.min(y,fy)-12);
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

</script>
</body>
</html>
